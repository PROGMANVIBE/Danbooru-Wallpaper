    // Evaluates total log-aspect distortion of leaves if laid out inside (w, h)
    function evaluateSubtreeDistortion(node, w, h, gap) {
      if (!node) return 0;
      if (node.isLeaf) {
        const safeW = Math.max(8, w);
        const safeH = Math.max(8, h);
        const boxAspect = safeW / safeH;
        const mediaAspect = clampTileAspect(node.item.aspect);
        const logDiff = Math.abs(Math.log(boxAspect / mediaAspect));
        const minDimPenalty = (safeW < 64 || safeH < 64) ? 1.5 : 0;
        return logDiff + minDimPenalty;
      }
      if (node.splitVertically) {
        const availW = Math.max(16, w - gap);
        const leftW = availW * node.ratio;
        const rightW = availW - leftW;
        return (
          evaluateSubtreeDistortion(node.left, leftW, h, gap) +
          evaluateSubtreeDistortion(node.right, rightW, h, gap)
        );
      } else {
        const availH = Math.max(16, h - gap);
        const topH = availH * node.ratio;
        const bottomH = availH - topH;
        return (
          evaluateSubtreeDistortion(node.left, w, topH, gap) +
          evaluateSubtreeDistortion(node.right, w, bottomH, gap)
        );
      }
    }

    function solveAspectLockedSubtree(items, boxW, boxH, gap, prevMask = null, allowReorder = true) {
      if (!items || items.length === 0) return null;
      if (items.length === 1) {
        const single = buildBinarySubtreeNodes(items, null);
        propagateAspectBottomUp(single);
        single._orderedItems = items.slice();
        return single;
      }

      const candidateOrders = [items.slice()];
      if (allowReorder && items.length >= 3) {
        candidateOrders.push(items.slice().sort((a, b) => a.aspect - b.aspect));
        candidateOrders.push(items.slice().sort((a, b) => b.aspect - a.aspect));
      }

      let bestRoot = null;
      let bestScore = Infinity;
      const targetBoxAspect = Math.max(0.2, boxW / Math.max(1, boxH));

      for (let o = 0; o < candidateOrders.length; o++) {
        const internals = [];
        const root = buildBinarySubtreeNodes(candidateOrders[o], internals);
        const numInternals = internals.length;

        if (numInternals <= 5) {
          const totalMasks = 1 << numInternals;
          for (let mask = 0; mask < totalMasks; mask++) {
            let flipDirectionChanges = 0;
            for (let b = 0; b < numInternals; b++) {
              const isVert = Boolean((mask >> b) & 1);
              internals[b].splitVertically = isVert;
              if (typeof prevMask === 'number' && Boolean((prevMask >> b) & 1) !== isVert) {
                flipDirectionChanges++;
              }
            }
            const rootAspect = propagateAspectBottomUp(root);
            const leafError = evaluateSubtreeDistortion(root, boxW, boxH, gap);
            const rootMatchError = Math.abs(Math.log(rootAspect / targetBoxAspect)) * 0.45;
            const stabilityPenalty = flipDirectionChanges * 0.24;
            const totalScore = leafError + rootMatchError + stabilityPenalty;
            if (totalScore < bestScore) {
              bestScore = totalScore;
              bestRoot = root;
              bestRoot._winMask = mask;
              bestRoot._internals = internals;
              bestRoot._orderedItems = candidateOrders[o];
            }
          }
        } else {
          const assignGreedy = (nd, cw, ch) => {
            if (!nd || nd.isLeaf) return;
            nd.splitVertically = (cw / Math.max(1, ch)) >= 1.02;
            propagateAspectBottomUp(nd);
            if (nd.splitVertically) {
              const aw = Math.max(16, cw - gap);
              assignGreedy(nd.left, aw * nd.ratio, ch);
              assignGreedy(nd.right, aw * (1 - nd.ratio), ch);
            } else {
              const ah = Math.max(16, ch - gap);
              assignGreedy(nd.left, cw, ah * nd.ratio);
              assignGreedy(nd.right, cw, ah * (1 - nd.ratio));
            }
          };
          assignGreedy(root, boxW, boxH);
          propagateAspectBottomUp(root);
          root._orderedItems = candidateOrders[o];
          bestRoot = root;
          break;
        }
      }

      if (bestRoot && bestRoot._internals && typeof bestRoot._winMask === 'number') {
        const mask = bestRoot._winMask;
        const internals = bestRoot._internals;
        for (let b = 0; b < internals.length; b++) {
          internals[b].splitVertically = Boolean((mask >> b) & 1);
        }
        propagateAspectBottomUp(bestRoot);
      }
      return bestRoot;
    }

    function applySubtreeGeometry(node, x, y, w, h, gap, onLeafRect) {
      if (!node) return;
      if (node.isLeaf) {
        const rx = Math.round(x);
        const ry = Math.round(y);
        const rw = Math.max(16, Math.round(w));
        const rh = Math.max(16, Math.round(h));
        onLeafRect(node.item, rx, ry, rw, rh);
        return;
      }
      if (node.splitVertically) {
        const availW = Math.max(0, w - gap);
        const leftW = Math.round(availW * node.ratio);
        const rightW = Math.max(0, availW - leftW);
        applySubtreeGeometry(node.left, x, y, leftW, h, gap, onLeafRect);
        applySubtreeGeometry(node.right, x + leftW + gap, y, rightW, h, gap, onLeafRect);
      } else {
        const availH = Math.max(0, h - gap);
        const topH = Math.round(availH * node.ratio);
        const bottomH = Math.max(0, availH - topH);
        applySubtreeGeometry(node.left, x, y, w, topH, gap, onLeafRect);
        applySubtreeGeometry(node.right, x, y + topH + gap, w, bottomH, gap, onLeafRect);
      }
    }

    function commitTileGeometryImmediate(tile, x, y, w, h) {
      tile.x = x;
      tile.y = y;
      tile.w = w;
      tile.h = h;
      tile.isReflowing = false;
      tile.flipReflowElapsed = 0;
      if (tile.element) {
        tile.element.classList.remove('is-reflowing');
        tile.element.style.width = `${w}px`;
        tile.element.style.height = `${h}px`;
        tile.element.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      }
    }

    function applyTileTargetRectWithFlip(tile, nx, ny, nw, nh, oldRect, snapImmediately = false) {
      tile.x = nx;
      tile.y = ny;
      tile.w = nw;
      tile.h = nh;
      if (tile.element) {
        tile.element.style.width = `${nw}px`;
        tile.element.style.height = `${nh}px`;
      }

      if (!oldRect || snapImmediately) {
        tile.isReflowing = false;
        tile.flipReflowElapsed = 0;
        if (tile.element) {
          tile.element.classList.remove('is-reflowing');
          tile.element.style.transform = `translate3d(${nx}px, ${ny}px, 0)`;
        }
        return;
      }

      const dx = oldRect.x - nx;
      const dy = oldRect.y - ny;
      const sx = oldRect.w / Math.max(1, nw);
      const sy = oldRect.h / Math.max(1, nh);

      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sx - 1) < 0.005 && Math.abs(sy - 1) < 0.005) {
        tile.isReflowing = false;
        if (tile.element) {
          tile.element.classList.remove('is-reflowing');
          tile.element.style.transform = `translate3d(${nx}px, ${ny}px, 0)`;
        }
      } else {
        tile.flipFromX = dx;
        tile.flipFromY = dy;
        tile.flipFromSX = sx;
        tile.flipFromSY = sy;
        tile.flipReflowElapsed = 0;
        tile.isReflowing = true;
        if (tile.element) {
          tile.element.classList.add('is-reflowing');
          tile.element.style.transform = `translate3d(${oldRect.x.toFixed(1)}px, ${oldRect.y.toFixed(1)}px, 0) scale3d(${sx.toFixed(4)}, ${sy.toFixed(4)}, 1)`;
        }
      }
    }

    function getTileCurrentVisualRect(tile) {
      if (!tile.isReflowing) {
        return { x: tile.x, y: tile.y, w: tile.w, h: tile.h };
      }
      const p = Math.min(1.0, tile.flipReflowElapsed / MASONRY_REFLOW_DURATION_SEC);
      const ease = 1 - Math.pow(1 - p, 3);
      const curX = tile.x + tile.flipFromX * (1 - ease);
      const curY = tile.y + tile.flipFromY * (1 - ease);
      const curSX = 1 + (tile.flipFromSX - 1) * (1 - ease);
      const curSY = 1 + (tile.flipFromSY - 1) * (1 - ease);
      return {
        x: curX,
        y: curY,
        w: tile.w * curSX,
        h: tile.h * curSY
      };
    }

    // -------------------------------------------------------------------------
    // ENGINE B: ROWS (GOOGLE PHOTOS JUSTIFIED HORIZONTAL ROWS SOLVER)
    // -------------------------------------------------------------------------
    function computeGooglePhotosRowRects(rowGroup) {
      const rectMap = new Map();
      if (!rowGroup || !rowGroup.tiles || rowGroup.tiles.length === 0) return rectMap;
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));
      const tiles = rowGroup.tiles;
      const n = tiles.length;
      const totalGapW = gap * Math.max(0, n - 1);
      const availW = Math.max(n * 16, rowGroup.w - totalGapW);

      let sumAspect = 0;
      const effAspects = [];
      for (let i = 0; i < n; i++) {
        const a = clampTileAspect(tiles[i].aspect);
        effAspects.push(a);
        sumAspect += a;
      }
      sumAspect = Math.max(0.1, sumAspect);

      let curX = rowGroup.x;
      for (let i = 0; i < n; i++) {
        const tile = tiles[i];
        const isLast = (i === n - 1);
        const rawW = availW * (effAspects[i] / sumAspect);
        const tw = isLast
          ? Math.max(16, (rowGroup.x + rowGroup.w) - curX)
          : Math.max(16, Math.round(rawW));
        const tx = Math.round(curX);
        const ty = Math.round(rowGroup.y);
        const th = Math.max(16, Math.round(rowGroup.h));
        rectMap.set(tile.id, { x: tx, y: ty, w: tw, h: th });
        curX += tw + gap;
      }
      return rectMap;
    }

    function layoutGooglePhotosRowTiles(rowGroup, prevRectsMap = null, flippedTileId = null) {
      if (!rowGroup || !rowGroup.tiles || rowGroup.tiles.length === 0) return;
      const rectMap = computeGooglePhotosRowRects(rowGroup);
      for (let i = 0; i < rowGroup.tiles.length; i++) {
        const tile = rowGroup.tiles[i];
        const target = rectMap.get(tile.id);
        if (!target) continue;
        if (prevRectsMap) {
          const old = prevRectsMap.get(tile.id);
          applyTileTargetRectWithFlip(tile, target.x, target.y, target.w, target.h, old, tile.id === flippedTileId);
        } else {
          commitTileGeometryImmediate(tile, target.x, target.y, target.w, target.h);
        }
      }
    }

    function buildGooglePhotosJustifiedLayout(prevRectsMap = null) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      if (sw <= 0 || sh <= 0 || masonryTileList.length === 0) return;
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));
      const totalTiles = masonryTileList.length;

      let meanAspect = 0;
      for (let i = 0; i < totalTiles; i++) {
        meanAspect += clampTileAspect(masonryTileList[i].aspect);
      }
      meanAspect = meanAspect / Math.max(1, totalTiles);

      const idealRows = Math.round(Math.sqrt((totalTiles * sh * meanAspect) / Math.max(1, sw)));
      const numRows = Math.max(
        totalTiles >= 4 ? 2 : 1,
        Math.min(Math.ceil(totalTiles / 2), idealRows || 2)
      );

      masonryGroups = [];
      masonryTreeRoot = null;

      let startIdx = 0;
      const rawIdealHeights = [];
      let totalIdealHeight = 0;

      for (let r = 0; r < numRows; r++) {
        const remainingTiles = totalTiles - startIdx;
        const remainingRows = numRows - r;
        const count = Math.max(1, Math.round(remainingTiles / remainingRows));
        const slice = masonryTileList.slice(startIdx, startIdx + count);
        startIdx += count;

        let rowAspectSum = 0;
        for (let i = 0; i < slice.length; i++) {
          slice[i].groupIndex = r;
          rowAspectSum += clampTileAspect(slice[i].aspect);
        }
        rowAspectSum = Math.max(0.2, rowAspectSum);

        const rowAvailW = Math.max(64, sw - gap * Math.max(0, slice.length - 1));
        const idealH = rowAvailW / rowAspectSum;
        rawIdealHeights.push(idealH);
        totalIdealHeight += idealH;

        masonryGroups.push({
          index: r,
          tiles: slice,
          aspect: rowAspectSum,
          sizeJitter: 1.0,
          subtreeRoot: null,
          x: 0,
          y: 0,
          w: sw,
          h: 100
        });
      }

      const totalRowGaps = gap * Math.max(0, numRows - 1);
      const availScreenH = Math.max(numRows * 32, sh - totalRowGaps);
      const heightScale = availScreenH / Math.max(1, totalIdealHeight);

      let curY = 0;
      for (let r = 0; r < numRows; r++) {
        const rowGroup = masonryGroups[r];
        rowGroup.index = r;
        const isLastRow = (r === numRows - 1);
        const rh = isLastRow
          ? Math.max(24, sh - curY)
          : Math.max(24, Math.round(rawIdealHeights[r] * heightScale));

        rowGroup.x = 0;
        rowGroup.y = curY;
        rowGroup.w = sw;
        rowGroup.h = rh;

        for (let i = 0; i < rowGroup.tiles.length; i++) {
          rowGroup.tiles[i].groupIndex = r;
        }

        layoutGooglePhotosRowTiles(rowGroup, prevRectsMap, null);
        curY += rh + gap;
      }
    }

    // -------------------------------------------------------------------------
    // BACKGROUND PRE-ORGANIZATION & PRE-RENDERING OF NEXT MEDIA SWITCH
    // -------------------------------------------------------------------------
    function clearPreStagedMasonrySwitch(requeueMedia = true) {
      if (!preStagedMasonryPlan) return;
      const plan = preStagedMasonryPlan;
      preStagedMasonryPlan = null;

      if (plan.stagedMediaEl && plan.stagedMediaEl.parentNode) {
        plan.stagedMediaEl.parentNode.removeChild(plan.stagedMediaEl);
      }
      if (plan.stagedMediaEl) {
        plan.stagedMediaEl.className = 'masonry-media';
      }

      if (requeueMedia && plan.ready && plan.ready.media && readyImageQueue.length < 36) {
        readyImageQueue.unshift(plan.ready);
      } else if (plan.ready && plan.ready.media) {
        cleanupMediaNode(plan.ready.media);
      }
    }

    function cancelActiveMasonryFlipsAndPlans() {
      clearPreStagedMasonrySwitch(true);
      for (let i = 0; i < masonryTileList.length; i++) {
        const t = masonryTileList[i];
        if (t.activePreStage) {
          const ap = t.activePreStage;
          t.activePreStage = null;
          if (ap.stagedMediaEl && ap.stagedMediaEl !== t.mediaElement) {
            if (ap.stagedMediaEl.parentNode) {
              ap.stagedMediaEl.parentNode.removeChild(ap.stagedMediaEl);
            }
            cleanupMediaNode(ap.stagedMediaEl);
          }
        }
        if (t.pendingReady && t.pendingReady.media) {
          if (t.pendingReady.media !== t.mediaElement) {
            cleanupMediaNode(t.pendingReady.media);
          }
          t.pendingReady = null;
        }
        if (t.isFlipping) {
          t.isFlipping = false;
          t.flipPhase = 0;
          t.flipElapsed = 0;
          if (t.flipInner) {
            t.flipInner.style.transform = '';
          }
          if (t.element) {
            t.element.classList.remove('is-flipping');
          }
        }
      }
    }

    // Pre-calculates the exact target rectangles for a local group or horizontal row in the background
    // BEFORE the flip animation starts so zero layout solver math runs at the 90-degree midpoint
    function precomputeGroupReflowPlan(groupIndex, flippedTileId, newAspect, newSizeJitter) {
      const group = masonryGroups[groupIndex];
      if (!group || !group.tiles || group.tiles.length === 0) return null;
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));

      // Create lightweight proxy items reflecting the incoming media's aspect ratio
      const proxyItems = group.tiles.map(t => ({
        id: t.id,
        tileRef: t,
        aspect: t.id === flippedTileId ? clampTileAspect(newAspect) : clampTileAspect(t.aspect),
        sizeJitter: t.id === flippedTileId ? newSizeJitter : t.sizeJitter
      }));

      const plannedRects = new Map();

      if (MASONRY_LAYOUT === 'rows') {
        const fakeRowGroup = {
          x: group.x,
          y: group.y,
          w: group.w,
          h: group.h,
          tiles: proxyItems
        };
        const rowMap = computeGooglePhotosRowRects(fakeRowGroup);
        rowMap.forEach((rect, id) => plannedRects.set(id, rect));
        return {
          layoutMode: 'rows',
          groupIndex,
          plannedRects,
          winMask: null
        };
      }

      const prevMask = (group.subtreeRoot && typeof group.subtreeRoot._winMask === 'number')
        ? group.subtreeRoot._winMask
        : null;
      const solvedRoot = solveAspectLockedSubtree(proxyItems, group.w, group.h, gap, prevMask, false);
      applySubtreeGeometry(solvedRoot, group.x, group.y, group.w, group.h, gap, (proxy, nx, ny, nw, nh) => {
        plannedRects.set(proxy.id, { x: nx, y: ny, w: nw, h: nh });
      });

      return {
        layoutMode: 'mondrian',
        groupIndex,
        plannedRects,
        winMask: solvedRoot ? solvedRoot._winMask : prevMask
      };
    }

    // Pre-stages the next tile flip in the background ~1.2s before the flip timer expires:
    // 1. Pre-mounts the incoming media element in a hidden DOM back-layer (.pre-staged-media) so its GPU texture is rasterized ahead of time
    // 2. Pre-solves the row/subgroup reflow geometry in memory so the 90-degree midpoint does zero solver math
    function preStageNextMasonrySwitch() {
      if (preStagedMasonryPlan || DISPLAY_MODE !== 'masonry' || masonryTileList.length === 0 || readyImageQueue.length === 0) {
        return false;
      }

      for (let i = 0; i < masonryTileList.length; i++) {
        if (masonryTileList[i].isFlipping || masonryTileList[i].isReflowing) {
          return false;
        }
      }

      const eligible = masonryTileList.filter(t => !t.isFlipping && t.hasPlayedOnce);
      if (eligible.length === 0) return false;

      const chosenTile = eligible[Math.floor(Math.random() * eligible.length)];
      const nextReady = readyImageQueue.shift();
      pumpPreloader();

      if (MASONRY_LAYOUT === 'mondrian' && !nextReady.ambientBgUrl && nextReady.media) {
        nextReady.ambientBgUrl = computeAmbientBackdropDataUrl(nextReady.media);
      }

      const newAspect = clampTileAspect(nextReady.aspect);
      const newSizeJitter = 0.92 + Math.random() * 0.16;

      // Pre-mount media in hidden back-layer inside chosenTile.flipInner so WebView2 uploads & rasterizes the texture now
      const stagedMediaEl = nextReady.media;
      if (stagedMediaEl && chosenTile.flipInner) {
        stagedMediaEl.className = 'masonry-media pre-staged-media';
        chosenTile.flipInner.appendChild(stagedMediaEl);
        if (!nextReady.isVideo && typeof stagedMediaEl.decode === 'function') {
          stagedMediaEl.decode().catch(() => {});
        }
      }

      const reflowPlan = precomputeGroupReflowPlan(chosenTile.groupIndex, chosenTile.id, newAspect, newSizeJitter);

      preStagedMasonryPlan = {
        tile: chosenTile,
        ready: nextReady,
        stagedMediaEl: stagedMediaEl,
        newAspect: newAspect,
        newSizeJitter: newSizeJitter,
        reflowPlan: reflowPlan
      };
      return true;
    }

    // Reflows ONLY the flipped row (in Rows mode) or local group (in Mondrian mode),
    // using the pre-calculated layout plan when available
    function reflowMasonryGroupWithFlip(groupIndex, flippedTileId, precomputedReflowPlan = null) {
      const group = masonryGroups[groupIndex];
      if (!group || !group.tiles || group.tiles.length === 0) return;
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));

      // 1. FIRST: Snapshot current visual rects of tiles in this row / local group
      const prevRects = new Map();
      for (let i = 0; i < group.tiles.length; i++) {
        const t = group.tiles[i];
        prevRects.set(t.id, getTileCurrentVisualRect(t));
      }

      // Fast path: Use pre-organized target rects computed before the flip started
      if (
        precomputedReflowPlan &&
        precomputedReflowPlan.layoutMode === MASONRY_LAYOUT &&
        precomputedReflowPlan.groupIndex === groupIndex &&
        precomputedReflowPlan.plannedRects
      ) {
        if (MASONRY_LAYOUT === 'mondrian' && group.subtreeRoot && typeof precomputedReflowPlan.winMask === 'number') {
          group.subtreeRoot._winMask = precomputedReflowPlan.winMask;
        }
        for (let i = 0; i < group.tiles.length; i++) {
          const tile = group.tiles[i];
          const target = precomputedReflowPlan.plannedRects.get(tile.id);
          if (target) {
            const old = prevRects.get(tile.id);
            applyTileTargetRectWithFlip(tile, target.x, target.y, target.w, target.h, old, tile.id === flippedTileId);
          }
        }
        return;
      }

      // Fallback path if triggered manually without pre-stage:
      if (MASONRY_LAYOUT === 'rows') {
        layoutGooglePhotosRowTiles(group, prevRects, flippedTileId);
        return;
      }

      const prevMask = (group.subtreeRoot && typeof group.subtreeRoot._winMask === 'number')
        ? group.subtreeRoot._winMask
        : null;
      group.subtreeRoot = solveAspectLockedSubtree(group.tiles, group.w, group.h, gap, prevMask, false);
      applySubtreeGeometry(group.subtreeRoot, group.x, group.y, group.w, group.h, gap, (tile, nx, ny, nw, nh) => {
        const old = prevRects.get(tile.id);
        applyTileTargetRectWithFlip(tile, nx, ny, nw, nh, old, tile.id === flippedTileId);
      });
    }

    // Partitions all active tiles and solves the full screen layout for the active Masonry Layout
    function rebuildFullMasonryLayout(animateTransition = false) {
      if (DISPLAY_MODE !== 'masonry' || masonryTileList.length === 0) return;
      syncStageRowsModeClass();

      const sw = window.innerWidth;
      const sh = window.innerHeight;
      if (sw <= 0 || sh <= 0) return;
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));

      // Update ambient backdrops on all tiles when switching between Mondrian and Rows
      for (let i = 0; i < masonryTileList.length; i++) {
        const t = masonryTileList[i];
        if (t.flipInner) {
          if (MASONRY_LAYOUT === 'rows') {
            t.flipInner.style.backgroundImage = 'none';
          } else {
            applyTileAmbientBackdrop(t.flipInner, t.mediaElement, t.isVideo, t.ambientBgUrl);
          }
        }
      }

      let prevRectsMap = null;
      if (animateTransition) {
        prevRectsMap = new Map();
        for (let i = 0; i < masonryTileList.length; i++) {
          const t = masonryTileList[i];
          prevRectsMap.set(t.id, getTileCurrentVisualRect(t));
        }
      }

      if (MASONRY_LAYOUT === 'rows') {
        buildGooglePhotosJustifiedLayout(prevRectsMap);
        return;
      }

      const totalTiles = masonryTileList.length;
      const targetGroupSize = totalTiles <= 6 ? 3 : 4;
      const numGroups = Math.max(1, Math.round(totalTiles / targetGroupSize));

      masonryGroups = [];
      let startIdx = 0;
      for (let g = 0; g < numGroups; g++) {
        const remainingTiles = totalTiles - startIdx;
        const remainingGroups = numGroups - g;
        const count = Math.max(1, Math.round(remainingTiles / remainingGroups));
        const slice = masonryTileList.slice(startIdx, startIdx + count);
        startIdx += count;

        for (let i = 0; i < slice.length; i++) {
          slice[i].groupIndex = g;
        }

        const prelimRoot = solveAspectLockedSubtree(slice, Math.round(sw / Math.sqrt(numGroups)), Math.round(sh / Math.sqrt(numGroups)), gap);
        const groupAspect = prelimRoot ? prelimRoot.effAspect : 1.33;

        masonryGroups.push({
          index: g,
          tiles: slice,
          aspect: groupAspect,
          sizeJitter: 0.94 + Math.random() * 0.12,
          subtreeRoot: prelimRoot,
          x: 0,
          y: 0,
          w: sw,
          h: sh
        });
      }

      // Solve top-level screen partition across the local groups
      masonryTreeRoot = solveAspectLockedSubtree(masonryGroups, sw, sh, gap, null, true);
      if (masonryTreeRoot && masonryTreeRoot._orderedItems) {
        masonryGroups = masonryTreeRoot._orderedItems;
      }
      for (let g = 0; g < masonryGroups.length; g++) {
        masonryGroups[g].index = g;
        for (let i = 0; i < masonryGroups[g].tiles.length; i++) {
          masonryGroups[g].tiles[i].groupIndex = g;
        }
      }

      applySubtreeGeometry(masonryTreeRoot, 0, 0, sw, sh, gap, (group, gx, gy, gw, gh) => {
        group.x = gx;
        group.y = gy;
        group.w = gw;
        group.h = gh;
        group.subtreeRoot = solveAspectLockedSubtree(group.tiles, gw, gh, gap, null, true);
        if (group.subtreeRoot && group.subtreeRoot._orderedItems) {
          group.tiles = group.subtreeRoot._orderedItems;
        }
        for (let i = 0; i < group.tiles.length; i++) {
          group.tiles[i].groupIndex = group.index;
        }
        applySubtreeGeometry(group.subtreeRoot, gx, gy, gw, gh, gap, (tile, tx, ty, tw, th) => {
          if (prevRectsMap) {
            const old = prevRectsMap.get(tile.id);
            applyTileTargetRectWithFlip(tile, tx, ty, tw, th, old, false);
          } else {
            commitTileGeometryImmediate(tile, tx, ty, tw, th);
          }
        });
      });
    }

    function relayoutMasonryGrid() {
      if (DISPLAY_MODE !== 'masonry' || masonryTileList.length === 0) return;
      clearPreStagedMasonrySwitch(true);
      syncStageRowsModeClass();
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      if (sw <= 0 || sh <= 0) return;

      if (MASONRY_LAYOUT === 'rows') {
        buildGooglePhotosJustifiedLayout(null);
        return;
      }

      if (!masonryTreeRoot || masonryGroups.length === 0) {
        rebuildFullMasonryLayout(false);
        return;
      }
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));
      applySubtreeGeometry(masonryTreeRoot, 0, 0, sw, sh, gap, (group, gx, gy, gw, gh) => {
        group.x = gx;
        group.y = gy;
        group.w = gw;
        group.h = gh;
        const prevMask = (group.subtreeRoot && typeof group.subtreeRoot._winMask === 'number')
          ? group.subtreeRoot._winMask
          : null;
        group.subtreeRoot = solveAspectLockedSubtree(group.tiles, gw, gh, gap, prevMask, false);
        applySubtreeGeometry(group.subtreeRoot, gx, gy, gw, gh, gap, (tile, tx, ty, tw, th) => {
          commitTileGeometryImmediate(tile, tx, ty, tw, th);
        });
      });
    }

    function switchMasonryLayoutEngine(rawNewLayout) {
      const newLayout = normalizeMasonryLayout(rawNewLayout);
      if (MASONRY_LAYOUT === newLayout) return;
      MASONRY_LAYOUT = newLayout;
      syncStageRowsModeClass();
      if (DISPLAY_MODE === 'masonry' && masonryTileList.length > 0) {
        cancelActiveMasonryFlipsAndPlans();
        rebuildFullMasonryLayout(true);
      }
    }

    function createMasonryTileDom(ready) {
      const tileEl = document.createElement('div');
      tileEl.className = 'masonry-tile';

      const flipInner = document.createElement('div');
      flipInner.className = 'masonry-flip-inner';

      const media = ready.media;
      media.className = 'masonry-media';
      flipInner.appendChild(media);
      tileEl.appendChild(flipInner);
      stage.appendChild(tileEl);

      applyTileAmbientBackdrop(flipInner, media, ready.isVideo, ready.ambientBgUrl);

      if (ready.isVideo) {
        enforceSilentVideo(media);
        media.play().catch(() => {});
      }

      const tileObj = {
        id: nextMasonryTileId++,
        groupIndex: 0,
        element: tileEl,
        flipInner: flipInner,
        mediaElement: media,
        ambientBgUrl: ready.ambientBgUrl || '',
        url: ready.url,
        isVideo: ready.isVideo,
        isAnimated: ready.isAnimated,
        isGif: ready.isGif,
        gifLoopDurationSec: ready.gifLoopDurationSec,
        aspect: clampTileAspect(ready.aspect),
        sizeJitter: 0.92 + Math.random() * 0.16,
        x: 0,
        y: 0,
        w: 100,
        h: 100,
        liveElapsedSec: 0,
        minPlayDurationSec: 0,
        hasPlayedOnce: !ready.isAnimated,
        isFlipping: false,
        flipPhase: 0,
        flipElapsed: 0,
        pendingReady: null,
        activePreStage: null,
        isReflowing: false,
        flipFromX: 0,
        flipFromY: 0,
        flipFromSX: 1,
        flipFromSY: 1,
        flipReflowElapsed: 0
      };

      attachPlaythroughTracker(tileObj);
      return tileObj;
    }

    function populateMasonryIfNeeded() {
      if (DISPLAY_MODE !== 'masonry' || APP_PAUSED || !SCREEN_ENABLED) return;
      syncStageRowsModeClass();
      const targetCount = Math.max(4, Math.min(36, Math.round(Number(MASONRY_TILES) || 12)));

      let changedStructure = false;
      if (masonryTileList.length !== targetCount) {
        cancelActiveMasonryFlipsAndPlans();
      }
      while (masonryTileList.length > targetCount) {
        const removed = masonryTileList.pop();
        destroyItem(removed);
        changedStructure = true;
      }

      while (masonryTileList.length < targetCount && readyImageQueue.length > 0) {
        const ready = readyImageQueue.shift();
        recordShownMedia(ready);
        const tileObj = createMasonryTileDom(ready);
        masonryTileList.push(tileObj);
        changedStructure = true;
      }

      if (changedStructure && masonryTileList.length > 0) {
        rebuildFullMasonryLayout(false);
      }

      if (masonryTileList.length < targetCount) {
        pumpPreloader();
      }
    }

    function isAnyMasonryTileBusy() {
      for (let i = 0; i < masonryTileList.length; i++) {
        if (masonryTileList[i].isFlipping || masonryTileList[i].isReflowing) {
          return true;
        }
      }
      return false;
    }

    function triggerNextMasonryFlip(forceIgnorePlayGuard = false) {
      if (DISPLAY_MODE !== 'masonry' || masonryTileList.length === 0) {
        pumpPreloader();
        return false;
      }

      // High-stress protection: strictly allow at most 1 active flip/reflow at a time across the 36-tile grid
      // so rapid Next clicks never launch overlapping 3D GPU layers or corrupt mid-animation FLIP rects
      if (isAnyMasonryTileBusy()) {
        return false;
      }

      // Fast path: If a background pre-staged switch is ready and valid, launch it with zero setup overhead
      if (
        preStagedMasonryPlan &&
        preStagedMasonryPlan.tile &&
        !preStagedMasonryPlan.tile.isFlipping &&
        masonryTileList.includes(preStagedMasonryPlan.tile)
      ) {
        const plan = preStagedMasonryPlan;
        preStagedMasonryPlan = null;
        const chosenTile = plan.tile;
        recordShownMedia(plan.ready);

        if (chosenTile.element) {
          chosenTile.element.classList.add('is-flipping');
        }
        chosenTile.isFlipping = true;
        chosenTile.flipPhase = 1;
        chosenTile.flipElapsed = 0;
        chosenTile.activePreStage = plan;
        chosenTile.pendingReady = null;
        return true;
      }

      clearPreStagedMasonrySwitch(true);
      if (readyImageQueue.length === 0) {
        pumpPreloader();
        return false;
      }

      const busyGroups = new Set();
      for (let i = 0; i < masonryTileList.length; i++) {
        if (masonryTileList[i].isFlipping || masonryTileList[i].isReflowing) {
          busyGroups.add(masonryTileList[i].groupIndex);
        }
      }

      let eligible = masonryTileList.filter(
        t => !t.isFlipping && !busyGroups.has(t.groupIndex) && (forceIgnorePlayGuard || t.hasPlayedOnce)
      );
      if (eligible.length === 0) {
        return false;
      }

      const chosenTile = eligible[Math.floor(Math.random() * eligible.length)];
      const nextReady = readyImageQueue.shift();
      recordShownMedia(nextReady);
      pumpPreloader();

      if (MASONRY_LAYOUT === 'mondrian' && !nextReady.ambientBgUrl && nextReady.media) {
        nextReady.ambientBgUrl = computeAmbientBackdropDataUrl(nextReady.media);
      }

      const newAspect = clampTileAspect(nextReady.aspect);
      const newSizeJitter = 0.92 + Math.random() * 0.16;
      const stagedMediaEl = nextReady.media;
      if (stagedMediaEl && chosenTile.flipInner) {
        stagedMediaEl.className = 'masonry-media pre-staged-media';
        chosenTile.flipInner.appendChild(stagedMediaEl);
      }
      const reflowPlan = precomputeGroupReflowPlan(chosenTile.groupIndex, chosenTile.id, newAspect, newSizeJitter);

      if (chosenTile.element) {
        chosenTile.element.classList.add('is-flipping');
      }
      chosenTile.isFlipping = true;
      chosenTile.flipPhase = 1;
      chosenTile.flipElapsed = 0;
      chosenTile.activePreStage = {
        tile: chosenTile,
        ready: nextReady,
        stagedMediaEl: stagedMediaEl,
        newAspect: newAspect,
        newSizeJitter: newSizeJitter,
        reflowPlan: reflowPlan
      };
      chosenTile.pendingReady = null;
      return true;
    }

    function updateMasonryMode(deltaTime) {
      if (masonryTileList.length < MASONRY_TILES && readyImageQueue.length > 0) {
        populateMasonryIfNeeded();
      }

      for (let i = 0; i < masonryTileList.length; i++) {
        const tile = masonryTileList[i];
        if (!tile.hasPlayedOnce) {
          tile.liveElapsedSec += deltaTime;
          if (tile.liveElapsedSec >= (tile.minPlayDurationSec || 2.5)) {
            tile.hasPlayedOnce = true;
          }
        }

        // Advance GPU FLIP neighbor reflow animation (translate3d + scale3d only, zero layout thrashing)
        if (tile.isReflowing) {
          tile.flipReflowElapsed += deltaTime;
          const rp = Math.min(1.0, tile.flipReflowElapsed / MASONRY_REFLOW_DURATION_SEC);
          if (rp >= 1.0) {
            tile.isReflowing = false;
            if (tile.element) {
              tile.element.classList.remove('is-reflowing');
              tile.element.style.transform = `translate3d(${tile.x}px, ${tile.y}px, 0)`;
            }
          } else {
            const ease = 1 - Math.pow(1 - rp, 3);
            const curX = tile.x + tile.flipFromX * (1 - ease);
            const curY = tile.y + tile.flipFromY * (1 - ease);
            const curSX = 1 + (tile.flipFromSX - 1) * (1 - ease);
            const curSY = 1 + (tile.flipFromSY - 1) * (1 - ease);
            if (tile.element) {
              tile.element.style.transform = `translate3d(${curX.toFixed(1)}px, ${curY.toFixed(1)}px, 0) scale3d(${curSX.toFixed(4)}, ${curSY.toFixed(4)}, 1)`;
            }
          }
        }

        if (tile.isFlipping) {
          tile.flipElapsed += deltaTime;
          if (tile.flipPhase === 1) {
            const p = Math.min(1.0, tile.flipElapsed / MASONRY_FLIP_HALF_SEC);
            const deg = p * 90.0;
            if (tile.flipInner) {
              tile.flipInner.style.transform = `rotateY(${deg.toFixed(1)}deg)`;
            }
            if (p >= 1.0) {
              // At 90 degrees (edge-on), activate the pre-rendered DOM back-layer and apply pre-organized rects
              const preStage = tile.activePreStage;
              tile.activePreStage = null;
              if (preStage && preStage.ready && preStage.stagedMediaEl) {
                const incoming = preStage.ready;
                const newMedia = preStage.stagedMediaEl;

                // Strictly destroy and detach the outgoing media node to prevent any memory bloat
                if (tile.mediaElement && tile.mediaElement !== newMedia) {
                  const oldMedia = tile.mediaElement;
                  if (oldMedia.parentNode) {
                    oldMedia.parentNode.removeChild(oldMedia);
                  }
                  cleanupMediaNode(oldMedia);
                }

                // Reveal the pre-rendered media node (already mounted in tile.flipInner)
                newMedia.className = 'masonry-media';
                if (!newMedia.parentNode && tile.flipInner) {
                  tile.flipInner.appendChild(newMedia);
                }

                tile.ambientBgUrl = incoming.ambientBgUrl || '';
                applyTileAmbientBackdrop(tile.flipInner, newMedia, incoming.isVideo, tile.ambientBgUrl);

                if (incoming.isVideo) {
                  enforceSilentVideo(newMedia);
                  newMedia.play().catch(() => {});
                }
                tile.mediaElement = newMedia;
                tile.url = incoming.url;
                tile.isVideo = incoming.isVideo;
                tile.isAnimated = incoming.isAnimated;
                tile.isGif = incoming.isGif;
                tile.gifLoopDurationSec = incoming.gifLoopDurationSec;
                tile.aspect = preStage.newAspect;
                tile.sizeJitter = preStage.newSizeJitter;
                attachPlaythroughTracker(tile);

                // Apply pre-organized row/group rects via GPU FLIP
                reflowMasonryGroupWithFlip(tile.groupIndex, tile.id, preStage.reflowPlan);
              }
              tile.flipPhase = 2;
              tile.flipElapsed = 0;
              if (tile.flipInner) {
                tile.flipInner.style.transform = 'rotateY(-90deg)';
              }
            }
          } else if (tile.flipPhase === 2) {
            const p = Math.min(1.0, tile.flipElapsed / MASONRY_FLIP_HALF_SEC);
            const deg = -90.0 + p * 90.0;
            if (tile.flipInner) {
              tile.flipInner.style.transform = `rotateY(${deg.toFixed(1)}deg)`;
            }
            if (p >= 1.0) {
              if (tile.flipInner) {
                tile.flipInner.style.transform = '';
              }
              if (tile.element) {
                tile.element.classList.remove('is-flipping');
              }
              tile.isFlipping = false;
              tile.flipPhase = 0;
              tile.flipElapsed = 0;
            }
          }
        }
      }

      if (WALLPAPER_PAUSED) return;

      masonrySwitchTimer += deltaTime;
      const delayTarget = Math.max(1, Math.min(60, Number(MASONRY_DELAY) || 5));

      // Pre-render & pre-organize the next media switch in the background before the flip timer fires
      const preStageThreshold = Math.max(0.15, delayTarget - MASONRY_PRE_STAGE_LEAD_SEC);
      if (!preStagedMasonryPlan && masonrySwitchTimer >= preStageThreshold && masonrySwitchTimer < delayTarget) {
        preStageNextMasonrySwitch();
      }

      if (masonrySwitchTimer >= delayTarget) {
        if (triggerNextMasonryFlip(false)) {
          masonrySwitchTimer = 0;
        } else {
          masonrySwitchTimer = Math.max(0, delayTarget - 0.25);
        }
      }
    }

    // =========================================================================
    // MAIN ANIMATION LOOP & RESIZE HANDLING
    // =========================================================================
    window.addEventListener('resize', () => {
      if (DISPLAY_MODE === 'scroll') {
        relayoutScrollItems();
      } else if (DISPLAY_MODE === 'slideshow') {
        filterQueuesForSlideshowOrientation();
        if (currentSlideItem && !matchesScreenOrientation(currentSlideItem.aspect)) {
          advanceSlideshowIfReady();
        }
        pumpPreloader();
      } else if (DISPLAY_MODE === 'masonry') {
        relayoutMasonryGrid();
      } else {
        resizePolaroidCanvas(true);
        coverageGrid.fill(0);
        coveredCellCount = 0;
        screenFullyCovered = false;
        for (let i = 0; i < polaroidItems.length; i++) {
          markCoverageForLandedItem(polaroidItems[i]);
        }
      }
    });

    function animate(currentTime) {
      if (lastTime === null) {
        lastTime = currentTime;
      }
      const rawDelta = (currentTime - lastTime) / 1000;
      const deltaTime = rawDelta > 0 ? Math.min(rawDelta, 0.25) : 0;
      lastTime = currentTime;

      if (!APP_PAUSED && SCREEN_ENABLED) {
        if (DISPLAY_MODE === 'scroll') {
          updateScrollMode(deltaTime);
        } else if (DISPLAY_MODE === 'slideshow') {
          updateSlideshowMode(deltaTime);
        } else if (DISPLAY_MODE === 'masonry') {
          updateMasonryMode(deltaTime);
        } else {
          updatePolaroidMode(deltaTime);
        }
      }

      requestAnimationFrame(animate);
    }

    // =========================================================================
    // EPOCH, PAUSE & NAVIGATION STATE POLLING
    // =========================================================================
    setInterval(async () => {
      try {
        const res = await fetch(`${LOCAL_ORIGIN}/epoch?screen=${encodeURIComponent(SCREEN_ID)}`);
        if (res.ok) {
          const data = await res.json();
          if (typeof data.enabled === 'boolean') {
            window.setScreenEnabled(data.enabled);
          }

          if (typeof data.app_paused === 'boolean' || typeof data.wallpaper_paused === 'boolean') {
            window.applyPauseStates(data.app_paused, data.wallpaper_paused);
          }

          if (typeof data.nav_seq === 'number') {
            if (lastNavSeq === null) {
              lastNavSeq = data.nav_seq;
            } else if (data.nav_seq > lastNavSeq) {
              if (data.nav_action === 'prev') {
                window.triggerPreviousMedia(data.nav_seq);
              } else if (data.nav_action === 'next') {
                window.triggerNextMedia(data.nav_seq);
              } else {
                lastNavSeq = data.nav_seq;
              }
            }
          }

          if (typeof data.prop_seq === 'number') {
            if (lastPropSeq === null) {
              lastPropSeq = data.prop_seq;
            } else if (data.prop_seq > lastPropSeq) {
              lastPropSeq = data.prop_seq;
              const propRes = await fetch(`${LOCAL_ORIGIN}/properties?screen=${encodeURIComponent(SCREEN_ID)}`);
              if (propRes.ok) {
                const payload = await propRes.json();
                if (typeof payload.enabled === 'boolean') {
                  window.setScreenEnabled(payload.enabled);
                }
                const props = payload.properties || payload;
                if (window.wallpaperPropertyListener && window.wallpaperPropertyListener.applyUserProperties) {
                  window.wallpaperPropertyListener.applyUserProperties(props);
                }
              }
            }
          }

          if (currentEpoch === null) {
            currentEpoch = data.epoch;
            return;
          }

          if (data.epoch !== currentEpoch) {
            currentEpoch = data.epoch;
            postQueue = [];
            consecutiveEmptyFetches = 0;
            consecutiveLoadErrors = 0;
            preloaderBackoffUntil = 0;
            nextAllowedFetchTime = 0;
            clearReadyQueue();

            if (!APP_PAUSED && SCREEN_ENABLED) {
              if (DISPLAY_MODE === 'scroll') {
                const visibleItems = [];
                for (let i = 0; i < activeItems.length; i++) {
                  const item = activeItems[i];
                  const isVisible = isHorizontalScroll()
                    ? ((item.x + item.width > 0) && (item.x < window.innerWidth))
                    : ((item.y + item.height > 0) && (item.y < window.innerHeight));
                  if (isVisible) {
                    visibleItems.push(item);
                  } else {
                    destroyItem(item);
                  }
                }
                activeItems = visibleItems;
                await fetchNextPage(true);
                fillScrollBuffer();
              } else if (DISPLAY_MODE === 'slideshow') {
                slideshowTimer = 999999;
                await fetchNextPage(true);
              } else {
                await fetchNextPage(true);
              }
            }
          }
        }
      } catch (e) {}
    }, 1000);

    // =========================================================================
    // WALLPAPER ENGINE PROPERTY LISTENER
    // =========================================================================
    window.wallpaperPropertyListener = {
      applyUserProperties: function(properties) {
        if (!properties) return;
        if (properties.schemecolor && properties.schemecolor.value) {
          const parts = String(properties.schemecolor.value).trim().split(/\s+/).map(Number);
          if (parts.length >= 3 && !parts.some(isNaN)) {
            const r = Math.round(Math.min(1, Math.max(0, parts[0])) * 255);
            const g = Math.round(Math.min(1, Math.max(0, parts[1])) * 255);
            const b = Math.round(Math.min(1, Math.max(0, parts[2])) * 255);
            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
          }
        }
        if (properties.scrolldirection && properties.scrolldirection.value) {
          const val = String(properties.scrolldirection.value).toLowerCase();
          const allowedDirs = ['left', 'right', 'up', 'down'];
          const newDir = allowedDirs.includes(val) ? val : 'left';
          if (SCROLL_DIRECTION !== newDir) {
            const axisChanged = (SCROLL_DIRECTION === 'left' || SCROLL_DIRECTION === 'right') !==
                                (newDir === 'left' || newDir === 'right');
            SCROLL_DIRECTION = newDir;
            if (DISPLAY_MODE === 'scroll') {
              if (axisChanged) {
                for (let i = 0; i < activeItems.length; i++) {
                  const it = activeItems[i];
                  if (it.mediaElement) {
                    readyImageQueue.unshift({
                      media: it.mediaElement,
                      url: it.mediaElement.src || '',
                      isVideo: it.isVideo,
                      isAnimated: it.isAnimated,
                      isGif: false,
                      gifLoopDurationSec: 2.5,
                      aspect: it.aspect,
                      naturalW: 1,
                      naturalH: 1
                    });
                    if (it.element && it.element.parentNode) {
                      it.element.parentNode.removeChild(it.element);
                    }
                  }
                }
                activeItems = [];
              }
              fillScrollBuffer();
            }
          }
        }
        if (properties.scrollspeed !== undefined && properties.scrollspeed !== null) {
          const parsedSpeed = Number(properties.scrollspeed.value);
          if (Number.isFinite(parsedSpeed) && parsedSpeed >= 0) {
            SCROLL_SPEED = parsedSpeed;
          }
        }
        if (properties.gapsize !== undefined) {
          GAP = Number(properties.gapsize.value);
          if (DISPLAY_MODE === 'scroll') relayoutScrollItems();
        }
        if (properties.dropspeed) {
          POLAROID_DROP_SPEED = Number(properties.dropspeed.value) || 1.0;
        }
        if (properties.minsize) {
          POLAROID_MIN_SIZE = Number(properties.minsize.value) || 220;
          if (POLAROID_MIN_SIZE > POLAROID_MAX_SIZE) POLAROID_MAX_SIZE = POLAROID_MIN_SIZE;
        }
        if (properties.maxsize) {
          POLAROID_MAX_SIZE = Number(properties.maxsize.value) || 440;
          if (POLAROID_MAX_SIZE < POLAROID_MIN_SIZE) POLAROID_MIN_SIZE = POLAROID_MAX_SIZE;
        }
        if (properties.dropdelay !== undefined) {
          const rawDelay = Number(properties.dropdelay.value);
          POLAROID_DROP_DELAY = isNaN(rawDelay) ? 0 : Math.max(0, Math.min(600, rawDelay));
        }
        if (properties.slideshowfade !== undefined && properties.slideshowfade !== null) {
          const rawFade = Number(properties.slideshowfade.value);
          SLIDESHOW_FADE = isNaN(rawFade) ? 5.0 : Math.max(0, Math.min(10, rawFade));
        }
        if (properties.slideshowduration !== undefined && properties.slideshowduration !== null) {
          const rawDur = Number(properties.slideshowduration.value);
          SLIDESHOW_DURATION = isNaN(rawDur) ? 10 : Math.max(0, Math.min(600, rawDur));
        }
        if (properties.masonrylayout && properties.masonrylayout.value !== undefined) {
          switchMasonryLayoutEngine(properties.masonrylayout.value);
        }
        if (properties.masonrytiles !== undefined && properties.masonrytiles !== null) {
          const rawTiles = Math.round(Number(properties.masonrytiles.value));
          const newTiles = isNaN(rawTiles) ? 12 : Math.max(4, Math.min(36, rawTiles));
          if (MASONRY_TILES !== newTiles) {
            MASONRY_TILES = newTiles;
            if (DISPLAY_MODE === 'masonry') {
              populateMasonryIfNeeded();
            }
          }
        }
        if (properties.masonrygap !== undefined && properties.masonrygap !== null) {
          const rawGap = Math.round(Number(properties.masonrygap.value));
          const newGap = isNaN(rawGap) ? 4 : Math.max(0, Math.min(10, rawGap));
          if (MASONRY_GAP !== newGap) {
            MASONRY_GAP = newGap;
            if (DISPLAY_MODE === 'masonry') {
              relayoutMasonryGrid();
            }
          }
        }
        if (properties.masonrydelay !== undefined && properties.masonrydelay !== null) {
          const rawMDelay = Math.round(Number(properties.masonrydelay.value));
          MASONRY_DELAY = isNaN(rawMDelay) ? 5 : Math.max(1, Math.min(60, rawMDelay));
        }
        if (properties.displaymode && properties.displaymode.value) {
          switchDisplayMode(properties.displaymode.value);
        }
      }
    };

    async function init() {
      resizePolaroidCanvas(false);
      try {
        const propRes = await fetch(`${LOCAL_ORIGIN}/properties?screen=${encodeURIComponent(SCREEN_ID)}`);
        if (propRes.ok) {
          const payload = await propRes.json();
          const props = payload.properties || payload;
          if (window.wallpaperPropertyListener && window.wallpaperPropertyListener.applyUserProperties) {
            window.wallpaperPropertyListener.applyUserProperties(props);
          }
          if (typeof payload.enabled === 'boolean') {
            window.setScreenEnabled(payload.enabled);
          }
          if (typeof payload.app_paused === 'boolean' || typeof payload.wallpaper_paused === 'boolean') {
            window.applyPauseStates(payload.app_paused, payload.wallpaper_paused);
          }
        }
      } catch (e) {}

      if (SCREEN_ENABLED && !APP_PAUSED) {
        await fetchNextPage(true);
      }
      requestAnimationFrame(animate);
    }

    window.onload = init;
  </script>
</body>
</html>
