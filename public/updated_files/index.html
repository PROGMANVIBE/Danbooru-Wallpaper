          t.isFlipping = false;
          t.flipPhase = 0;
          t.flipElapsed = 0;
          t.flipAccumSec = 0;
          if (t.flipInner) {
            t.flipInner.style.transform = '';
          }
          if (t.element) {
            t.element.classList.remove('is-flipping');
          }
        }
        if (t.isReflowing) {
          t.isReflowing = false;
          t.flipReflowElapsed = 0;
          t.reflowAccumSec = 0;
          if (t.element) {
            t.element.classList.remove('is-reflowing');
            t.element.style.transform = `translate3d(${t.x}px, ${t.y}px, 0)`;
          }
        }
      }
    }

    // Evaluates the maximum single-leaf log-aspect distortion across a set of planned rects
    function computeMaxLeafDistortionForPlan(plannedRects, aspectByIdMap) {
      let maxErr = 0;
      plannedRects.forEach((rect, id) => {
        const a = clampTileAspect(aspectByIdMap.get(id) || 1.0);
        const boxA = Math.max(8, rect.w) / Math.max(8, rect.h);
        const err = Math.abs(Math.log(boxA / a));
        if (err > maxErr) maxErr = err;
      });
      return maxErr;
    }

    // Solves a full-screen Mondrian group partition across proxy items (when local group reshuffle
    // cannot eliminate distortion on its own because the group's bounding box aspect needs to resize)
    function solveGlobalMondrianPlanForProxies(allProxies, sw, sh, gap) {
      const totalTiles = allProxies.length;
      const targetGroupSize = totalTiles <= 6 ? 3 : 4;
      const baseNumGroups = Math.max(1, Math.round(totalTiles / targetGroupSize));
      const candidateGroupCounts = [baseNumGroups];
      if (baseNumGroups > 1 && totalTiles >= (baseNumGroups - 1) * 2) {
        candidateGroupCounts.push(baseNumGroups - 1);
      }
      if (totalTiles >= (baseNumGroups + 1) * 2 && baseNumGroups + 1 <= 10) {
        candidateGroupCounts.push(baseNumGroups + 1);
      }

      // Deduplicate top-level tile orders (current, ascending aspect, descending aspect)
      const ascProxies = allProxies.slice().sort((a, b) => a.aspect - b.aspect);
      const descProxies = ascProxies.slice().reverse();
      const orders = [allProxies.slice()];
      const seenTopSigs = new Set([allProxies.map(p => p.id).join(',')]);
      for (const candOrder of [ascProxies, descProxies]) {
        const sig = candOrder.map(p => p.id).join(',');
        if (!seenTopSigs.has(sig)) {
          seenTopSigs.add(sig);
          orders.push(candOrder);
        }
      }

      const aspectById = new Map();
      for (let i = 0; i < allProxies.length; i++) {
        aspectById.set(allProxies[i].id, allProxies[i].aspect);
      }

      let bestPlan = null;
      let bestMaxErr = Infinity;

      for (let gcIdx = 0; gcIdx < candidateGroupCounts.length; gcIdx++) {
        const numGroups = candidateGroupCounts[gcIdx];
        const prelimW = Math.round(sw / Math.sqrt(numGroups));
        const prelimH = Math.round(sh / Math.sqrt(numGroups));
        const prelimBoxAspect = Math.max(0.2, prelimW / Math.max(1, prelimH));

        for (let oIdx = 0; oIdx < orders.length; oIdx++) {
          const orderedProxies = orders[oIdx];
          const tempGroups = new Array(numGroups);
          let startIdx = 0;
          for (let g = 0; g < numGroups; g++) {
            const remTiles = totalTiles - startIdx;
            const remGroups = numGroups - g;
            const count = Math.max(1, Math.round(remTiles / remGroups));
            const slice = orderedProxies.slice(startIdx, startIdx + count);
            startIdx += count;

            const prelimRoot = solveAspectLockedSubtree(
              slice,
              prelimW,
              prelimH,
              gap,
              null,
              true
            );
            tempGroups[g] = {
              index: g,
              proxies: prelimRoot && prelimRoot._orderedItems ? prelimRoot._orderedItems : slice,
              aspect: prelimRoot ? prelimRoot.effAspect : 1.33,
              winMask: prelimRoot ? prelimRoot._winMask : null,
              winTopology: prelimRoot ? prelimRoot._winTopology : 'balanced',
              sizeJitter: 1.0,
              subtreeRoot: prelimRoot,
              x: 0,
              y: 0,
              w: sw,
              h: sh
            };
          }

          const topRoot = solveAspectLockedSubtree(tempGroups, sw, sh, gap, null, true);
          const plannedRects = new Map();
          const groupSpecs = [];

          applySubtreeGeometry(topRoot, 0, 0, sw, sh, gap, (grp, gx, gy, gw, gh) => {
            const actualBoxAspect = Math.max(0.2, gw / Math.max(1, gh));
            // Only re-search leaf permutations if the group's final bounding box aspect differs significantly (>18%) from preliminary
            const needsFullReorder = Math.abs(Math.log(actualBoxAspect / prelimBoxAspect)) > 0.165;
            const solvedSub = solveAspectLockedSubtree(
              grp.proxies,
              gw,
              gh,
              gap,
              grp.winMask,
              needsFullReorder
            );
            const finalProxies = (solvedSub && solvedSub._orderedItems) ? solvedSub._orderedItems : grp.proxies;
            applySubtreeGeometry(solvedSub, gx, gy, gw, gh, gap, (proxy, tx, ty, tw, th) => {
              plannedRects.set(proxy.id, { x: tx, y: ty, w: tw, h: th });
            });
            groupSpecs.push({
              x: gx,
              y: gy,
              w: gw,
              h: gh,
              aspect: solvedSub ? solvedSub.effAspect : grp.aspect,
              winMask: solvedSub ? solvedSub._winMask : null,
              winTopology: solvedSub ? solvedSub._winTopology : 'balanced',
              tileIds: finalProxies.map(p => p.id)
            });
          });

          const maxErr = computeMaxLeafDistortionForPlan(plannedRects, aspectById);
          const orderPenalty = (oIdx === 0 && gcIdx === 0) ? 0 : 0.004;
          const score = maxErr + orderPenalty;
          if (score < bestMaxErr) {
            bestMaxErr = score;
            bestPlan = {
              layoutMode: 'mondrian',
              scope: 'global',
              groupIndex: 0,
              plannedRects,
              groupSpecs,
              topWinMask: topRoot ? topRoot._winMask : null,
              topWinTopology: topRoot ? topRoot._winTopology : 'balanced',
              maxErr
            };
            if (bestMaxErr <= 0.006) {
              return bestPlan;
            }
          }
        }
      }

      return bestPlan;
    }

    // Pre-calculates the exact target rectangles for a local group/row or full-grid reshuffle in the background
    // BEFORE the flip animation starts so zero layout solver math runs at the flip midpoint.
    function precomputeGroupReflowPlan(groupIndex, flippedTileId, newAspect, newSizeJitter) {
      const group = masonryGroups[groupIndex];
      if (!group || !group.tiles || group.tiles.length === 0) return null;
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));
      const sw = Math.max(320, window.innerWidth || 1920);
      const sh = Math.max(240, window.innerHeight || 1080);

      if (MASONRY_LAYOUT === 'rows') {
        // Fast local-first check for Rows mode: if the incoming tile's aspect ratio matches the outgoing tile
        // closely enough that the current row's natural height barely changes (<= 3.5%), only reflow this row!
        const rowProxies = group.tiles.map(t => ({
          id: t.id,
          aspect: t.id === flippedTileId ? clampRowTileAspect(newAspect) : clampRowTileAspect(t.rawAspect || t.aspect),
          rawAspect: t.id === flippedTileId ? clampRowTileAspect(newAspect) : clampRowTileAspect(t.rawAspect || t.aspect)
        }));
        let newRowSumA = 0;
        for (let i = 0; i < rowProxies.length; i++) newRowSumA += rowProxies[i].rawAspect;
        newRowSumA = Math.max(0.25, newRowSumA);
        const rowAvailW = Math.max(64, group.w - gap * Math.max(0, rowProxies.length - 1));
        const newNaturalRowH = rowAvailW / newRowSumA;
        const heightRatioErr = Math.abs(Math.log(Math.max(24, newNaturalRowH) / Math.max(24, group.h)));

        if (heightRatioErr <= 0.035) {
          const fakeLocalGroup = { x: group.x, y: group.y, w: group.w, h: group.h, tiles: rowProxies };
          const localRowMap = computeGooglePhotosRowRects(fakeLocalGroup);
          return {
            layoutMode: 'rows',
            scope: 'local',
            groupIndex,
            plannedRects: localRowMap,
            orderedTileIds: rowProxies.map(p => p.id),
            winMask: null,
            winTopology: 'balanced'
          };
        }

        // Otherwise re-solve variable row heights across rows so natural row heights sum to availScreenH
        // with zero extra inter-row or intra-row gaps
        const allRowProxies = masonryTileList.map(t => ({
          id: t.id,
          aspect: t.id === flippedTileId ? clampRowTileAspect(newAspect) : clampRowTileAspect(t.rawAspect || t.aspect),
          rawAspect: t.id === flippedTileId ? clampRowTileAspect(newAspect) : clampRowTileAspect(t.rawAspect || t.aspect)
        }));
        const solvedRows = solveOptimalRowsPartitionForAspects(
          allRowProxies.map(p => p.rawAspect),
          sw,
          sh,
          gap,
          MASONRY_TILES,
          true
        );
        const orderedProxies = isValidIndexPermutation(solvedRows.orderedIndices, allRowProxies.length)
          ? solvedRows.orderedIndices.map(idx => allRowProxies[idx])
          : allRowProxies;
        const numRows = solvedRows.numRows;
        const rowCounts = solvedRows.rowCounts;
        const plannedRects = new Map();
        const rowBuckets = [];
        const rowAspectSums = [];
        let cursor = 0;
        for (let r = 0; r < numRows; r++) {
          const count = rowCounts[r];
          const slice = orderedProxies.slice(cursor, cursor + count);
          cursor += count;
          let aSum = 0;
          for (let i = 0; i < slice.length; i++) aSum += slice[i].rawAspect;
          rowBuckets.push(slice);
          rowAspectSums.push(Math.max(0.25, aSum));
        }

        const rawHeights = [];
        let rawHeightSum = 0;
        for (let r = 0; r < numRows; r++) {
          const slice = rowBuckets[r];
          const rAvailW = Math.max(64, sw - gap * Math.max(0, slice.length - 1));
          const exactUncroppedH = rAvailW / rowAspectSums[r];
          const clampedH = Math.max(24, exactUncroppedH);
          rawHeights.push(clampedH);
          rawHeightSum += clampedH;
        }
        const totalRowGaps = gap * Math.max(0, numRows - 1);
        const availScreenH = Math.max(numRows * 24, sh - totalRowGaps);
        const normScale = availScreenH / Math.max(1, rawHeightSum);

        const groupSpecs = [];
        let curY = 0;
        for (let r = 0; r < numRows; r++) {
          const slice = rowBuckets[r];
          const isLastRow = (r === numRows - 1);
          const rh = isLastRow
            ? Math.max(24, sh - curY)
            : Math.max(24, Math.round(rawHeights[r] * normScale));
          const fakeRowGroup = { x: 0, y: curY, w: sw, h: rh, tiles: slice };
          const rowMap = computeGooglePhotosRowRects(fakeRowGroup);
          rowMap.forEach((rect, id) => plannedRects.set(id, rect));
          groupSpecs.push({
            x: 0,
            y: curY,
            w: sw,
            h: rh,
            aspect: rowAspectSums[r],
            tileIds: slice.map(p => p.id)
          });
          curY += rh + gap;
        }

        return {
          layoutMode: 'rows',
          scope: 'global',
          groupIndex,
          plannedRects,
          groupSpecs,
          winMask: null,
          winTopology: 'balanced'
        };
      }

      // Create lightweight proxy items reflecting the incoming media's aspect ratio
      const proxyItems = group.tiles.map(t => ({
        id: t.id,
        tileRef: t,
        aspect: t.id === flippedTileId ? clampTileAspect(newAspect) : clampTileAspect(t.aspect),
        rawAspect: t.id === flippedTileId ? clampRowTileAspect(newAspect) : clampRowTileAspect(t.rawAspect || t.aspect),
        sizeJitter: 1.0
      }));

      const aspectById = new Map();
      for (let i = 0; i < masonryTileList.length; i++) {
        const t = masonryTileList[i];
        aspectById.set(t.id, t.id === flippedTileId ? clampTileAspect(newAspect) : clampTileAspect(t.aspect));
      }

      // Tier 1A: Local group reshuffle (allowReorder = true) within current group box.
      // Relaxed threshold (0.085) keeps most flips strictly inside the 3-4 tile local group
      // so the other ~32 tiles on screen remain 100% stationary with zero GPU reflow cost.
      const prevMask = (group.subtreeRoot && typeof group.subtreeRoot._winMask === 'number')
        ? group.subtreeRoot._winMask
        : null;
      const localSolvedRoot = solveAspectLockedSubtree(proxyItems, group.w, group.h, gap, prevMask, true);
      const localRects = new Map();
      applySubtreeGeometry(localSolvedRoot, group.x, group.y, group.w, group.h, gap, (proxy, nx, ny, nw, nh) => {
        localRects.set(proxy.id, { x: nx, y: ny, w: nw, h: nh });
      });
      const localAspectMap = new Map();
      for (let i = 0; i < proxyItems.length; i++) {
        localAspectMap.set(proxyItems[i].id, proxyItems[i].aspect);
      }
      const localMaxErr = computeMaxLeafDistortionForPlan(localRects, localAspectMap);

      if (localMaxErr <= 0.085) {
        return {
          layoutMode: 'mondrian',
          scope: 'local',
          groupIndex,
          plannedRects: localRects,
          orderedTileIds: localSolvedRoot && localSolvedRoot._orderedItems
            ? localSolvedRoot._orderedItems.map(p => p.id)
            : proxyItems.map(p => p.id),
          winMask: localSolvedRoot ? localSolvedRoot._winMask : prevMask,
          winTopology: localSolvedRoot ? localSolvedRoot._winTopology : 'balanced'
        };
      }

      // Tier 1B: Keep current groups without cross-group tile migration, resizing group boxes
      const groupProxies = masonryGroups.map((g, gIdx) => {
        const gItems = gIdx === groupIndex
          ? (localSolvedRoot && localSolvedRoot._orderedItems ? localSolvedRoot._orderedItems : proxyItems)
          : g.tiles.map(t => ({
              id: t.id,
              tileRef: t,
              aspect: clampTileAspect(t.aspect),
              rawAspect: clampRowTileAspect(t.rawAspect || t.aspect),
              sizeJitter: 1.0
            }));
        const gSub = solveAspectLockedSubtree(gItems, g.w, g.h, gap, null, true);
        return {
          index: gIdx,
          proxies: gSub && gSub._orderedItems ? gSub._orderedItems : gItems,
          aspect: gSub ? gSub.effAspect : g.aspect,
          sizeJitter: 1.0
        };
      });

      const resizedTopRoot = solveAspectLockedSubtree(groupProxies, sw, sh, gap, null, false);
      const resizedRects = new Map();
      const resizedGroupSpecs = [];
      applySubtreeGeometry(resizedTopRoot, 0, 0, sw, sh, gap, (grp, gx, gy, gw, gh) => {
        const gSub = solveAspectLockedSubtree(grp.proxies, gw, gh, gap, null, true);
        const finalProxies = (gSub && gSub._orderedItems) ? gSub._orderedItems : grp.proxies;
        applySubtreeGeometry(gSub, gx, gy, gw, gh, gap, (proxy, tx, ty, tw, th) => {
          resizedRects.set(proxy.id, { x: tx, y: ty, w: tw, h: th });
        });
        resizedGroupSpecs.push({
          x: gx,
          y: gy,
          w: gw,
          h: gh,
          aspect: gSub ? gSub.effAspect : grp.aspect,
          winMask: gSub ? gSub._winMask : null,
          winTopology: gSub ? gSub._winTopology : 'balanced',
          tileIds: finalProxies.map(p => p.id)
        });
      });

      const resizedMaxErr = computeMaxLeafDistortionForPlan(resizedRects, aspectById);
      if (resizedMaxErr <= 0.14) {
        return {
          layoutMode: 'mondrian',
          scope: 'global',
          groupIndex,
          plannedRects: resizedRects,
          groupSpecs: resizedGroupSpecs,
          topWinMask: resizedTopRoot ? resizedTopRoot._winMask : null,
          topWinTopology: resizedTopRoot ? resizedTopRoot._winTopology : 'balanced',
          winMask: null
        };
      }

      // Tier 2: Escalate to full-grid re-partition & reshuffle only when distortion exceeds 0.14
      const allProxies = masonryTileList.map(t => ({
        id: t.id,
        tileRef: t,
        aspect: t.id === flippedTileId ? clampTileAspect(newAspect) : clampTileAspect(t.aspect),
        rawAspect: t.id === flippedTileId ? clampRowTileAspect(newAspect) : clampRowTileAspect(t.rawAspect || t.aspect),
        sizeJitter: 1.0
      }));
      const globalPlan = solveGlobalMondrianPlanForProxies(allProxies, sw, sh, gap);
      if (globalPlan && globalPlan.maxErr < resizedMaxErr) {
        return globalPlan;
      }

      return {
        layoutMode: 'mondrian',
        scope: 'global',
        groupIndex,
        plannedRects: resizedRects,
        groupSpecs: resizedGroupSpecs,
        topWinMask: resizedTopRoot ? resizedTopRoot._winMask : null,
        topWinTopology: resizedTopRoot ? resizedTopRoot._winTopology : 'balanced',
        winMask: null
      };
    }

    // Pre-stages the next tile flip in the background ~1.2s before the flip timer expires:
    // 1. Pre-mounts the incoming media element in a hidden DOM back-layer (.pre-staged-media) so its GPU texture is rasterized ahead of time
    // 2. Pre-solves the local/global reflow geometry in memory so the flip midpoint does zero solver math
    function preStageNextMasonrySwitch() {
      if (preStagedMasonryPlan || DISPLAY_MODE !== 'masonry' || masonryTileList.length === 0 || readyImageQueue.length === 0) {
        return false;
      }

      for (let i = 0; i < masonryTileList.length; i++) {
        if (masonryTileList[i].isFlipping || masonryTileList[i].isReflowing) {
          return false;
        }
      }

      const eligible = masonryTileList.filter(t => !t.isFlipping && t.hasPlayedOnce);
      if (eligible.length === 0) return false;

      const chosenTile = eligible[Math.floor(Math.random() * eligible.length)];
      let desiredFlipAspect = chosenTile.rawAspect || chosenTile.aspect;
      if (MASONRY_LAYOUT === 'rows' && masonryGroups[chosenTile.groupIndex]) {
        const grp = masonryGroups[chosenTile.groupIndex];
        const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));
        const availRowW = Math.max(64, grp.w - gap * Math.max(0, grp.tiles.length - 1));
        let otherAspectSum = 0;
        for (let i = 0; i < grp.tiles.length; i++) {
          if (grp.tiles[i].id !== chosenTile.id) {
            otherAspectSum += clampRowTileAspect(grp.tiles[i].rawAspect || grp.tiles[i].aspect);
          }
        }
        const idealRowAspectSum = availRowW / Math.max(24, grp.h);
        desiredFlipAspect = Math.max(0.25, idealRowAspectSum - otherAspectSum);
      }

      const nextReady = MASONRY_LAYOUT === 'rows'
        ? pullBestAspectMatchFromReadyQueue(desiredFlipAspect)
        : readyImageQueue.shift();
      if (!nextReady) return false;
      pumpPreloader();

      if (MASONRY_EDGE_FILL === 'blur' && !nextReady.ambientBgUrl && nextReady.media) {
        nextReady.ambientBgUrl = computeAmbientBackdropDataUrl(nextReady.media);
      }

      const newAspect = clampTileAspect(nextReady.aspect);
      const newSizeJitter = 1.0;

      // Pre-mount media in hidden back-layer inside chosenTile.flipInner so WebView2 uploads & rasterizes the texture now
      const stagedMediaEl = nextReady.media;
      if (stagedMediaEl && chosenTile.flipInner) {
        stagedMediaEl.className = 'masonry-media pre-staged-media';
        chosenTile.flipInner.appendChild(stagedMediaEl);
        if (!nextReady.isVideo && typeof stagedMediaEl.decode === 'function') {
          stagedMediaEl.decode().catch(() => {});
        }
      }

      const reflowPlan = precomputeGroupReflowPlan(chosenTile.groupIndex, chosenTile.id, newAspect, newSizeJitter);

      preStagedMasonryPlan = {
        tile: chosenTile,
        ready: nextReady,
        stagedMediaEl: stagedMediaEl,
        newAspect: newAspect,
        newRawAspect: clampRowTileAspect(nextReady.aspect),
        newSizeJitter: newSizeJitter,
        reflowPlan: reflowPlan
      };
      return true;
    }

    // Dynamically adjusts the active tile count within the ±25% Target Tile Count window [minCount, maxCount]
    // when active tile count is outside the allowed window.
    function adjustMasonryTileCountOnFlipIfBeneficial(flippedTileId, allowOpportunisticChange = false) {
      const { minCount, maxCount } = getTargetTileCountBounds(MASONRY_TILES);
      const outOfBounds = masonryTileList.length < minCount || masonryTileList.length > maxCount;
      if (!outOfBounds && !allowOpportunisticChange) {
        return false;
      }
      const desiredCount = getDesiredMasonryTileCount(allowOpportunisticChange);
      if (desiredCount === masonryTileList.length) {
        return false;
      }
      let modified = false;
      while (masonryTileList.length < desiredCount && masonryTileList.length < maxCount && readyImageQueue.length > 0) {
        const extraReady = MASONRY_LAYOUT === 'rows'
          ? pullBestAspectMatchFromReadyQueue(1.28)
          : readyImageQueue.shift();
        if (!extraReady) break;
        recordShownMedia(extraReady);
        const newTile = createMasonryTileDom(extraReady);
        const sw = Math.max(320, window.innerWidth || 1920);
        const sh = Math.max(240, window.innerHeight || 1080);
        commitTileGeometryImmediate(newTile, Math.round(sw * 0.5 - 60), Math.round(sh * 0.5 - 60), 120, 120);
        masonryTileList.push(newTile);
        modified = true;
      }
      while (masonryTileList.length > desiredCount && masonryTileList.length > minCount) {
        let removeIdx = -1;
        for (let i = masonryTileList.length - 1; i >= 0; i--) {
          const candidate = masonryTileList[i];
          if (candidate.id !== flippedTileId && !candidate.isFlipping) {
            removeIdx = i;
            break;
          }
        }
        if (removeIdx < 0) break;
        const [removed] = masonryTileList.splice(removeIdx, 1);
        destroyItem(removed);
        modified = true;
      }
      if (modified) {
        pumpPreloader();
      }
      return modified;
    }

    // Reflows either the local group (`scope: 'local'`) or the entire grid (`scope: 'global'`)
    // using the pre-calculated layout plan via smooth WAAPI GPU FLIP (translate3d + scale3d)
    function reflowMasonryGroupWithFlip(groupIndex, flippedTileId, precomputedReflowPlan = null) {
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));

      // Only adjust tile count if out of [minCount, maxCount] bounds, preserving local reflow locality
      if (adjustMasonryTileCountOnFlipIfBeneficial(flippedTileId, false)) {
        rebuildFullMasonryLayout(true);
        return;
      }

      // Ensure groupIndex is synchronized with masonryGroups
      let actualGroupIndex = groupIndex;
      if (
        !masonryGroups[actualGroupIndex] ||
        !masonryGroups[actualGroupIndex].tiles ||
        !masonryGroups[actualGroupIndex].tiles.some(t => t.id === flippedTileId)
      ) {
        for (let g = 0; g < masonryGroups.length; g++) {
          if (masonryGroups[g] && masonryGroups[g].tiles && masonryGroups[g].tiles.some(t => t.id === flippedTileId)) {
            actualGroupIndex = g;
            break;
          }
        }
      }

      // Global reshuffle/resize path (Mondrian full-grid / adjacent group resize or Rows full-grid height balance)
      if (
        precomputedReflowPlan &&
        precomputedReflowPlan.scope === 'global' &&
        precomputedReflowPlan.layoutMode === MASONRY_LAYOUT &&
        precomputedReflowPlan.plannedRects
      ) {
        const prevRects = new Map();
        const tileById = new Map();
        for (let i = 0; i < masonryTileList.length; i++) {
          const t = masonryTileList[i];
          prevRects.set(t.id, getTileCurrentVisualRect(t));
          tileById.set(t.id, t);
        }

        // Validate that the precomputed global plan still matches the active tile set 1-to-1
        // BEFORE mutating any tile.groupIndex or masonryGroups!
        let planMatchesActiveTiles =
          precomputedReflowPlan.plannedRects.size === masonryTileList.length &&
          Array.isArray(precomputedReflowPlan.groupSpecs) &&
          precomputedReflowPlan.groupSpecs.length > 0;

        if (planMatchesActiveTiles) {
          let totalPlannedIds = 0;
          const seenPlannedIds = new Set();
          for (let g = 0; g < precomputedReflowPlan.groupSpecs.length; g++) {
            const spec = precomputedReflowPlan.groupSpecs[g];
            if (!spec || !Array.isArray(spec.tileIds) || spec.tileIds.length === 0) {
              planMatchesActiveTiles = false;
              break;
            }
            for (let i = 0; i < spec.tileIds.length; i++) {
              const tid = spec.tileIds[i];
              if (!tileById.has(tid) || seenPlannedIds.has(tid) || !precomputedReflowPlan.plannedRects.has(tid)) {
                planMatchesActiveTiles = false;
                break;
              }
              seenPlannedIds.add(tid);
              totalPlannedIds++;
            }
            if (!planMatchesActiveTiles) break;
          }
          if (totalPlannedIds !== masonryTileList.length) {
            planMatchesActiveTiles = false;
          }
        }

        if (!planMatchesActiveTiles) {
          rebuildFullMasonryLayout(true);
          return;
        }

        const newGroups = [];
        const newTileOrder = [];
        for (let g = 0; g < precomputedReflowPlan.groupSpecs.length; g++) {
          const spec = precomputedReflowPlan.groupSpecs[g];
          const gTiles = [];
          for (let i = 0; i < spec.tileIds.length; i++) {
            const t = tileById.get(spec.tileIds[i]);
            if (t) {
              t.groupIndex = g;
              gTiles.push(t);
              newTileOrder.push(t);
            }
          }
          if (gTiles.length > 0) {
            const solvedSub = MASONRY_LAYOUT === 'mondrian'
              ? buildSubtreeWithFixedMaskAndTopology(gTiles, spec.winTopology || 'balanced', spec.winMask)
              : null;
            newGroups.push({
              index: newGroups.length,
              tiles: gTiles,
              aspect: spec.aspect || 1.33,
              sizeJitter: 1.0,
              subtreeRoot: solvedSub,
              x: spec.x,
              y: spec.y,
              w: spec.w,
              h: spec.h
            });
          }
        }

        masonryGroups = newGroups;
        masonryTileList = newTileOrder;
        if (MASONRY_LAYOUT === 'mondrian') {
          masonryTreeRoot = buildSubtreeWithFixedMaskAndTopology(
            masonryGroups,
            precomputedReflowPlan.topWinTopology || 'balanced',
            precomputedReflowPlan.topWinMask
          );
        }

        for (let i = 0; i < masonryTileList.length; i++) {
          const tile = masonryTileList[i];
          const target = precomputedReflowPlan.plannedRects.get(tile.id);
          if (target) {
            const old = prevRects.get(tile.id);
            applyTileTargetRectWithFlip(tile, target.x, target.y, target.w, target.h, old, tile.id === flippedTileId);
          }
        }
        return;
      }

      const group = masonryGroups[actualGroupIndex];
      if (!group || !group.tiles || group.tiles.length === 0) {
        rebuildFullMasonryLayout(true);
        return;
      }

      // Snapshot current visual rects of tiles in this row / local group
      const prevRects = new Map();
      for (let i = 0; i < group.tiles.length; i++) {
        const t = group.tiles[i];
        prevRects.set(t.id, getTileCurrentVisualRect(t));
      }

      // Fast path: Use pre-organized local group target rects computed before the flip started
      if (
        precomputedReflowPlan &&
        precomputedReflowPlan.scope === 'local' &&
        precomputedReflowPlan.layoutMode === MASONRY_LAYOUT &&
        precomputedReflowPlan.groupIndex === actualGroupIndex &&
        precomputedReflowPlan.plannedRects &&
        precomputedReflowPlan.plannedRects.size === group.tiles.length &&
        group.tiles.every(t => precomputedReflowPlan.plannedRects.has(t.id))
      ) {
        if (Array.isArray(precomputedReflowPlan.orderedTileIds) && precomputedReflowPlan.orderedTileIds.length === group.tiles.length) {
          const byId = new Map(group.tiles.map(t => [t.id, t]));
          const reordered = [];
          const seenIds = new Set();
          for (let i = 0; i < precomputedReflowPlan.orderedTileIds.length; i++) {
            const tid = precomputedReflowPlan.orderedTileIds[i];
            const found = byId.get(tid);
            if (found && !seenIds.has(tid)) {
              seenIds.add(tid);
              reordered.push(found);
            }
          }
          if (reordered.length === group.tiles.length) {
            group.tiles = reordered;
          }
        }
        for (let i = 0; i < group.tiles.length; i++) {
          group.tiles[i].groupIndex = actualGroupIndex;
        }
        if (MASONRY_LAYOUT === 'mondrian') {
          group.subtreeRoot = buildSubtreeWithFixedMaskAndTopology(
            group.tiles,
            precomputedReflowPlan.winTopology || 'balanced',
            precomputedReflowPlan.winMask
          );
        }
        for (let i = 0; i < group.tiles.length; i++) {
          const tile = group.tiles[i];
          const target = precomputedReflowPlan.plannedRects.get(tile.id);
          if (target) {
            const old = prevRects.get(tile.id);
            applyTileTargetRectWithFlip(tile, target.x, target.y, target.w, target.h, old, tile.id === flippedTileId);
          }
        }
        return;
      }

      // Fallback path if triggered manually without pre-stage:
      if (MASONRY_LAYOUT === 'rows') {
        layoutGooglePhotosRowTiles(group, prevRects, flippedTileId);
        return;
      }

      const prevMask = (group.subtreeRoot && typeof group.subtreeRoot._winMask === 'number')
        ? group.subtreeRoot._winMask
        : null;
      group.subtreeRoot = solveAspectLockedSubtree(group.tiles, group.w, group.h, gap, prevMask, true);
      if (group.subtreeRoot && group.subtreeRoot._orderedItems) {
        group.tiles = group.subtreeRoot._orderedItems;
      }
      for (let i = 0; i < group.tiles.length; i++) {
        group.tiles[i].groupIndex = actualGroupIndex;
      }
      applySubtreeGeometry(group.subtreeRoot, group.x, group.y, group.w, group.h, gap, (tile, nx, ny, nw, nh) => {
        const old = prevRects.get(tile.id);
        applyTileTargetRectWithFlip(tile, nx, ny, nw, nh, old, tile.id === flippedTileId);
      });
    }

    // Partitions all active tiles and solves the full screen layout for the active Masonry Layout
    function rebuildFullMasonryLayout(animateTransition = false) {
      if (DISPLAY_MODE !== 'masonry' || masonryTileList.length === 0) return;
      syncStageRowsModeClass();

      const sw = window.innerWidth;
      const sh = window.innerHeight;
      if (sw <= 0 || sh <= 0) return;
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));

      // Update ambient backdrops on all tiles when switching between Mondrian and Rows (Blur/Black)
      refreshAllMasonryTileBackdrops();

      let prevRectsMap = null;
      if (animateTransition) {
        prevRectsMap = new Map();
        for (let i = 0; i < masonryTileList.length; i++) {
          const t = masonryTileList[i];
          prevRectsMap.set(t.id, getTileCurrentVisualRect(t));
        }
      }

      if (MASONRY_LAYOUT === 'rows') {
        buildGooglePhotosJustifiedLayout(prevRectsMap);
        return;
      }

      const allProxies = masonryTileList.map(t => ({
        id: t.id,
        tileRef: t,
        aspect: clampTileAspect(t.aspect),
        rawAspect: clampRowTileAspect(t.rawAspect || t.aspect),
        sizeJitter: 1.0
      }));
      const globalPlan = solveGlobalMondrianPlanForProxies(allProxies, sw, sh, gap);

      if (globalPlan && Array.isArray(globalPlan.groupSpecs) && globalPlan.groupSpecs.length > 0) {
        const tileById = new Map(masonryTileList.map(t => [t.id, t]));
        const candidateGroups = [];
        const newTileOrder = [];
        const seenIds = new Set();
        for (let g = 0; g < globalPlan.groupSpecs.length; g++) {
          const spec = globalPlan.groupSpecs[g];
          const gTiles = [];
          for (let i = 0; i < spec.tileIds.length; i++) {
            const tid = spec.tileIds[i];
            const t = tileById.get(tid);
            if (t && !seenIds.has(tid)) {
              seenIds.add(tid);
              t.groupIndex = candidateGroups.length;
              gTiles.push(t);
              newTileOrder.push(t);
            }
          }
          if (gTiles.length > 0) {
            const solvedSub = buildSubtreeWithFixedMaskAndTopology(gTiles, spec.winTopology || 'balanced', spec.winMask);
            candidateGroups.push({
              index: candidateGroups.length,
              tiles: gTiles,
              aspect: spec.aspect || 1.33,
              sizeJitter: 1.0,
              subtreeRoot: solvedSub,
              x: spec.x,
              y: spec.y,
              w: spec.w,
              h: spec.h
            });
          }
        }
        if (newTileOrder.length === masonryTileList.length && candidateGroups.length > 0) {
          masonryGroups = candidateGroups;
          masonryTileList = newTileOrder;
          masonryTreeRoot = buildSubtreeWithFixedMaskAndTopology(
            masonryGroups,
            globalPlan.topWinTopology || 'balanced',
            globalPlan.topWinMask
          );
          for (let i = 0; i < masonryTileList.length; i++) {
            const tile = masonryTileList[i];
            const target = globalPlan.plannedRects.get(tile.id);
            if (target) {
              if (prevRectsMap) {
                const old = prevRectsMap.get(tile.id);
                applyTileTargetRectWithFlip(tile, target.x, target.y, target.w, target.h, old, false);
              } else {
                commitTileGeometryImmediate(tile, target.x, target.y, target.w, target.h);
              }
            }
          }
          return;
        }
      }

      const totalTiles = masonryTileList.length;
      const targetGroupSize = totalTiles <= 6 ? 3 : 4;
      const numGroups = Math.max(1, Math.round(totalTiles / targetGroupSize));

      masonryGroups = [];
      let startIdx = 0;
      for (let g = 0; g < numGroups; g++) {
        const remainingTiles = totalTiles - startIdx;
        const remainingGroups = numGroups - g;
        const count = Math.max(1, Math.round(remainingTiles / remainingGroups));
        const slice = masonryTileList.slice(startIdx, startIdx + count);
        startIdx += count;

        for (let i = 0; i < slice.length; i++) {
          slice[i].groupIndex = g;
        }

        const prelimRoot = solveAspectLockedSubtree(slice, Math.round(sw / Math.sqrt(numGroups)), Math.round(sh / Math.sqrt(numGroups)), gap);
        const groupAspect = prelimRoot ? prelimRoot.effAspect : 1.33;

        masonryGroups.push({
          index: g,
          tiles: slice,
          aspect: groupAspect,
          sizeJitter: 1.0,
          subtreeRoot: prelimRoot,
          x: 0,
          y: 0,
          w: sw,
          h: sh
        });
      }

      // Solve top-level screen partition across the local groups
      masonryTreeRoot = solveAspectLockedSubtree(masonryGroups, sw, sh, gap, null, true);
      if (masonryTreeRoot && masonryTreeRoot._orderedItems) {
        masonryGroups = masonryTreeRoot._orderedItems;
      }
      for (let g = 0; g < masonryGroups.length; g++) {
        masonryGroups[g].index = g;
        for (let i = 0; i < masonryGroups[g].tiles.length; i++) {
          masonryGroups[g].tiles[i].groupIndex = g;
        }
      }

      applySubtreeGeometry(masonryTreeRoot, 0, 0, sw, sh, gap, (group, gx, gy, gw, gh) => {
        group.x = gx;
        group.y = gy;
        group.w = gw;
        group.h = gh;
        group.subtreeRoot = solveAspectLockedSubtree(group.tiles, gw, gh, gap, null, true);
        if (group.subtreeRoot && group.subtreeRoot._orderedItems) {
          group.tiles = group.subtreeRoot._orderedItems;
        }
        for (let i = 0; i < group.tiles.length; i++) {
          group.tiles[i].groupIndex = group.index;
        }
        applySubtreeGeometry(group.subtreeRoot, gx, gy, gw, gh, gap, (tile, tx, ty, tw, th) => {
          if (prevRectsMap) {
            const old = prevRectsMap.get(tile.id);
            applyTileTargetRectWithFlip(tile, tx, ty, tw, th, old, false);
          } else {
            commitTileGeometryImmediate(tile, tx, ty, tw, th);
          }
        });
      });
    }

    function relayoutMasonryGrid() {
      if (DISPLAY_MODE !== 'masonry' || masonryTileList.length === 0) return;
      cancelActiveMasonryFlipsAndPlans();
      syncStageRowsModeClass();
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      if (sw <= 0 || sh <= 0) return;

      if (MASONRY_LAYOUT === 'rows') {
        buildGooglePhotosJustifiedLayout(null);
        return;
      }

      rebuildFullMasonryLayout(false);
    }

    function switchMasonryLayoutEngine(rawNewLayout) {
      const newLayout = normalizeMasonryLayout(rawNewLayout);
      if (MASONRY_LAYOUT === newLayout) return;
      MASONRY_LAYOUT = newLayout;
      syncStageRowsModeClass();
      if (DISPLAY_MODE === 'masonry') {
        cancelActiveMasonryFlipsAndPlans();
        populateMasonryIfNeeded(false, true);
        if (masonryTileList.length > 0) {
          rebuildFullMasonryLayout(true);
        }
      }
    }

    function createMasonryTileDom(ready) {
      const tileEl = document.createElement('div');
      tileEl.className = 'masonry-tile';

      const flipInner = document.createElement('div');
      flipInner.className = 'masonry-flip-inner';

      const media = ready.media;
      media.className = 'masonry-media';
      flipInner.appendChild(media);
      tileEl.appendChild(flipInner);
      stage.appendChild(tileEl);

      applyTileAmbientBackdrop(flipInner, media, ready.isVideo, ready.ambientBgUrl);

      if (ready.isVideo) {
        enforceSilentVideo(media);
        media.play().catch(() => {});
      }

      const tileObj = {
        id: nextMasonryTileId++,
        groupIndex: 0,
        element: tileEl,
        flipInner: flipInner,
        mediaElement: media,
        ambientBgUrl: ready.ambientBgUrl || '',
        url: ready.url,
        isVideo: ready.isVideo,
        isAnimated: ready.isAnimated,
        isGif: ready.isGif,
        gifLoopDurationSec: ready.gifLoopDurationSec,
        aspect: clampTileAspect(ready.aspect),
        rawAspect: clampRowTileAspect(ready.aspect),
        sizeJitter: 1.0,
        x: 0,
        y: 0,
        w: 100,
        h: 100,
        liveElapsedSec: 0,
        minPlayDurationSec: 0,
        hasPlayedOnce: !ready.isAnimated,
        isFlipping: false,
        flipPhase: 0,
        flipElapsed: 0,
        flipAccumSec: 0,
        flipAnim: null,
        activePreStage: null,
        isReflowing: false,
        flipFromX: 0,
        flipFromY: 0,
        flipFromSX: 1,
        flipFromSY: 1,
        flipReflowElapsed: 0,
        reflowAccumSec: 0,
        reflowAnim: null
      };

      attachPlaythroughTracker(tileObj);
      return tileObj;
    }

    // =========================================================================
    // MASONRY CARDBOARD BOX LOADING OVERLAY (CLOSED -> TOP OPENS -> FADE IN)
    // =========================================================================
    function drawMasonryCardboardBox(openProgress, boxAlpha = 1.0) {
      if (!masonryBoxCtx || !masonryBoxCanvas) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const cssSize = 156;
      const targetPx = Math.round(cssSize * dpr);
      if (masonryBoxCanvas.width !== targetPx || masonryBoxCanvas.height !== targetPx) {
        masonryBoxCanvas.width = targetPx;
        masonryBoxCanvas.height = targetPx;
      }

      const ctx = masonryBoxCtx;
      ctx.save();
      ctx.clearRect(0, 0, targetPx, targetPx);
      ctx.globalAlpha = Math.max(0, Math.min(1, boxAlpha));

      // Scale from 64x64 reference coordinate space (matching create_cardboard_box_icon in danbooru_service.py)
      const s = targetPx / 64;
      ctx.scale(s, s);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      const p = Math.max(0, Math.min(1, openProgress));
      // Smooth ease-out cubic for flap opening
      const easeOpen = 1 - Math.pow(1 - p, 3);

      const fillPoly = (pts, fillStyle, strokeStyle = '#3d2814', lineWidth = 1.15) => {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i][0], pts[i][1]);
        }
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
        if (strokeStyle && lineWidth > 0) {
          ctx.strokeStyle = strokeStyle;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }
      };

      // Subtle floor shadow under the box
      ctx.beginPath();
      ctx.ellipse(32, 57.5, 22, 4.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fill();

      // Back interior walls (visible as the top flaps open)
      // Top diamond of the box rim: Left(10, 22), Back(32, 11), Right(54, 22), Front(32, 33)
      fillPoly([[10, 22], [32, 11], [32, 33]], '#634121', '#3d2814', 1.0);
      fillPoly([[32, 11], [54, 22], [32, 33]], '#734e2a', '#3d2814', 1.0);

      // Subtle warm glow rising from inside the box as the top opens
      if (easeOpen > 0.02) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(10, 22);
        ctx.lineTo(32, 11);
        ctx.lineTo(54, 22);
        ctx.lineTo(32, 33);
        ctx.closePath();
        ctx.clip();
        const grad = ctx.createRadialGradient(32, 24, 2, 32, 22, 22);
        grad.addColorStop(0, `rgba(255, 214, 153, ${(0.42 * easeOpen).toFixed(3)})`);
        grad.addColorStop(1, 'rgba(115, 78, 42, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(8, 8, 48, 28);
        ctx.restore();
      }

      // Back-left top flap (hinged along Left(10,22) -> Back(32,11))
      // Closed: covers back-left half of top diamond to center (32, 22)
      // Open: swings up and outward to [(4, 12), (26, 2), (32, 11), (10, 22)]
      const blP2x = 32 + (26 - 32) * easeOpen;
      const blP2y = 22 + (2 - 22) * easeOpen;
      const blP3x = 10 + (4 - 10) * easeOpen;
      const blP3y = 22 + (12 - 22) * easeOpen;
      fillPoly(
        [[10, 22], [32, 11], [blP2x, blP2y], [blP3x, blP3y]],
        easeOpen > 0.35 ? '#b9854d' : '#c9965d'
      );

      // Back-right top flap (hinged along Back(32,11) -> Right(54,22))
      // Closed: covers back-right half of top diamond to center (32, 22)
      // Open: swings up and outward to [(32, 11), (38, 2), (60, 12), (54, 22)]
      const brP1x = 32 + (38 - 32) * easeOpen;
      const brP1y = 22 + (2 - 22) * easeOpen;
      const brP2x = 54 + (60 - 54) * easeOpen;
      const brP2y = 22 + (12 - 22) * easeOpen;
      fillPoly(
        [[32, 11], [brP1x, brP1y], [brP2x, brP2y], [54, 22]],
        easeOpen > 0.35 ? '#ad7a44' : '#be8b52'
      );

      // Front-left body panel (matched to create_cardboard_box_icon box_base #c28e56)
      fillPoly([[10, 22], [32, 33], [32, 56], [10, 44]], '#c28e56');

      // Front-right body panel (matched to create_cardboard_box_icon box_dark #96693c)
      fillPoly([[32, 33], [54, 22], [54, 44], [32, 56]], '#96693c');

      // Vertical center seam & shipping label accent on front-left panel
      ctx.beginPath();
      ctx.moveTo(32, 33);
      ctx.lineTo(32, 56);
      ctx.strokeStyle = '#3d2814';
      ctx.lineWidth = 1.25;
      ctx.stroke();

      // Front-left top flap (hinged along Left(10,22) -> Front(32,33))
      // Closed: meets the center seam [(10,22), (32,22), (32,33)]
      // Open: folds outward and down to match system tray icon [(10,22), (32,33), (26,41), (4,30)]
      const flTip1x = 32 + (26 - 32) * easeOpen;
      const flTip1y = 22 + (41 - 22) * easeOpen;
      const flTip2x = 10 + (4 - 10) * easeOpen;
      const flTip2y = 22 + (30 - 22) * easeOpen;
      fillPoly(
        [[10, 22], [32, 33], [flTip1x, flTip1y], [flTip2x, flTip2y]],
        '#d4a26a'
      );

      // Front-right top flap (hinged along Front(32,33) -> Right(54,22))
      // Closed: meets the center seam [(32,33), (32,22), (54,22)]
      // Open: folds outward and down to match system tray icon [(32,33), (54,22), (60,30), (38,41)]
      const frTip1x = 54 + (60 - 54) * easeOpen;
      const frTip1y = 22 + (30 - 22) * easeOpen;
      const frTip2x = 32 + (38 - 32) * easeOpen;
      const frTip2y = 22 + (41 - 22) * easeOpen;
      fillPoly(
        [[32, 33], [54, 22], [frTip1x, frTip1y], [frTip2x, frTip2y]],
        '#c28e56'
      );

      // Packing tape strip across the closed top seam (splits as the box opens)
      if (easeOpen < 0.25) {
        const tapeAlpha = 1 - (easeOpen / 0.25);
        ctx.save();
        ctx.globalAlpha *= tapeAlpha;
        fillPoly([[11, 21.5], [53, 21.5], [53, 23.2], [11, 23.2]], '#825832', null, 0);
        ctx.restore();
      }

      // Front vertical packing tape tab (from create_cardboard_box_icon tape_color #825832)
      fillPoly([[30, 32], [34, 32], [34, 42], [30, 42]], '#825832', '#3d2814', 0.9);

      ctx.restore();
    }

    function startMasonryLoadingSequence() {
      if (DISPLAY_MODE !== 'masonry' || !SCREEN_ENABLED) return;
      masonryLoadPhase = 'loading';
      masonryLoadElapsedSec = 0;
      masonryOpenProgress = 0;
      if (masonryLoadingOverlay) {
        masonryLoadingOverlay.classList.remove('fade-out');
        masonryLoadingOverlay.style.opacity = '1';
        masonryLoadingOverlay.classList.add('active');
      }
      drawMasonryCardboardBox(0, 1.0);
      pumpPreloader();
    }

    function hideMasonryLoadingOverlay() {
      masonryLoadPhase = 'idle';
      masonryLoadElapsedSec = 0;
      masonryOpenProgress = 0;
      if (masonryLoadingOverlay) {
        masonryLoadingOverlay.classList.remove('active', 'fade-out');
        masonryLoadingOverlay.style.opacity = '0';
      }
    }

    function populateMasonryIfNeeded(forceImmediateMount = false, allowSteadyStateChange = false) {
      if (DISPLAY_MODE !== 'masonry' || APP_PAUSED || !SCREEN_ENABLED) return;
      // While the initial Masonry cardboard box loading screen is closed and buffering in the background,
      // wait until the batch is ready so all tiles mount and layout in a single stutter-free pass
      if (masonryLoadPhase === 'loading' && !forceImmediateMount && masonryTileList.length === 0) {
        pumpPreloader();
        return;
      }

      const { minCount, maxCount } = getTargetTileCountBounds(MASONRY_TILES);
      const withinSteadyBounds = masonryTileList.length >= minCount && masonryTileList.length <= maxCount;
      // Do not mutate tile count or rebuild the grid mid-flip / mid-prestage if already within valid bounds
      if (!forceImmediateMount && !allowSteadyStateChange && withinSteadyBounds && (isAnyMasonryTileBusy() || preStagedMasonryPlan !== null)) {
        return;
      }

      syncStageRowsModeClass();
      const targetCount = getDesiredMasonryTileCount(forceImmediateMount || allowSteadyStateChange);
      const hadExistingTiles = masonryTileList.length > 0;

      let changedStructure = false;
      if (masonryTileList.length > targetCount || (masonryTileList.length < targetCount && readyImageQueue.length > 0)) {
        cancelActiveMasonryFlipsAndPlans();
      }
      while (masonryTileList.length > targetCount) {
        const removed = masonryTileList.pop();
        destroyItem(removed);
        changedStructure = true;
      }

      while (masonryTileList.length < targetCount && readyImageQueue.length > 0) {
        const ready = MASONRY_LAYOUT === 'rows'
          ? pullBestAspectMatchFromReadyQueue(1.28)
          : readyImageQueue.shift();
        if (!ready) break;
        recordShownMedia(ready);
        const tileObj = createMasonryTileDom(ready);
        masonryTileList.push(tileObj);
        changedStructure = true;
      }

      if (changedStructure && masonryTileList.length > 0) {
        rebuildFullMasonryLayout(hadExistingTiles && !forceImmediateMount);
      }

      if (masonryTileList.length < targetCount) {
        pumpPreloader();
      }
    }

    function isAnyMasonryTileBusy() {
      for (let i = 0; i < masonryTileList.length; i++) {
        if (masonryTileList[i].isFlipping || masonryTileList[i].isReflowing) {
          return true;
        }
      }
      return false;
    }

    function executeMasonryFlipMidpoint(tile) {
      if (!tile || !tile.isFlipping || tile.flipPhase !== 1) return;
      // CRITICAL: Cancel Phase 1's WAAPI animation (and any lingering element animations) BEFORE
      // launching Phase 2 so a Phase 1 `scaleX(0.01)` animation never persists in the WAAPI cascade
      cancelTileFlipAnimation(tile);

      const preStage = tile.activePreStage;
      tile.activePreStage = null;
      if (preStage && preStage.ready && preStage.stagedMediaEl) {
        const incoming = preStage.ready;
        const newMedia = preStage.stagedMediaEl;

        if (tile.mediaElement && tile.mediaElement !== newMedia) {
          const oldMedia = tile.mediaElement;
          if (oldMedia.parentNode) {
            oldMedia.parentNode.removeChild(oldMedia);
          }
          cleanupMediaNode(oldMedia);
        }

        // Defensive sweep: ensure no stale media elements remain inside flipInner
        if (tile.flipInner) {
          const existingMedia = Array.from(tile.flipInner.querySelectorAll('img, video'));
          for (let i = 0; i < existingMedia.length; i++) {
            const el = existingMedia[i];
            if (el !== newMedia) {
              if (el.parentNode) {
                el.parentNode.removeChild(el);
              }
              cleanupMediaNode(el);
            }
          }
        }

        newMedia.className = 'masonry-media';
        if (!newMedia.parentNode && tile.flipInner) {
          tile.flipInner.appendChild(newMedia);
        }

        tile.ambientBgUrl = incoming.ambientBgUrl || '';
        applyTileAmbientBackdrop(tile.flipInner, newMedia, incoming.isVideo, tile.ambientBgUrl);

        if (incoming.isVideo) {
          enforceSilentVideo(newMedia);
          newMedia.play().catch(() => {});
        }
        tile.mediaElement = newMedia;
        tile.url = incoming.url;
        tile.isVideo = incoming.isVideo;
        tile.isAnimated = incoming.isAnimated;
        tile.isGif = incoming.isGif;
        tile.gifLoopDurationSec = incoming.gifLoopDurationSec;
        tile.aspect = preStage.newAspect;
        tile.rawAspect = preStage.newRawAspect || clampRowTileAspect(incoming.aspect);
        tile.sizeJitter = preStage.newSizeJitter;
        attachPlaythroughTracker(tile);

        reflowMasonryGroupWithFlip(tile.groupIndex, tile.id, preStage.reflowPlan);
      }

      tile.flipPhase = 2;
      tile.flipElapsed = 0;
      tile.flipAccumSec = 0;

      if (tile.flipInner && typeof tile.flipInner.animate === 'function') {
        try {
          // Base inline transform is '' (scaleX(1)) so when anim2 finishes with fill: 'none',
          // the tile cleanly rests at full width scaleX(1) and can never stick at scaleX(0.01)
          tile.flipInner.style.transform = '';
          const anim2 = tile.flipInner.animate(
            [{ transform: 'scaleX(0.01)' }, { transform: 'scaleX(1)' }],
            {
              duration: Math.round(MASONRY_FLIP_HALF_SEC * 1000),
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
              fill: 'none'
            }
          );
          tile.flipAnim = anim2;
          anim2.onfinish = () => {
            if (tile.flipAnim === anim2) {
              tile.flipAnim = null;
            }
            finishMasonryTileFlip(tile);
          };
          anim2.oncancel = () => {
            if (tile.flipAnim === anim2) {
              tile.flipAnim = null;
            }
          };
          return;
        } catch (e) {
          tile.flipAnim = null;
        }
      }
      if (tile.flipInner) {
        tile.flipInner.style.transform = 'scaleX(0.01)';
      }
    }

    function finishMasonryTileFlip(tile) {
      if (!tile) return;
      cancelTileFlipAnimation(tile);
      if (tile.flipInner) {
        tile.flipInner.style.transform = '';
      }
      if (tile.element) {
        tile.element.classList.remove('is-flipping');
      }
      tile.isFlipping = false;
      tile.flipPhase = 0;
      tile.flipElapsed = 0;
      tile.flipAccumSec = 0;
    }

    function launchTileFlipPhase1(chosenTile, plan) {
      if (chosenTile.element) {
        chosenTile.element.classList.add('is-flipping');
      }
      chosenTile.isFlipping = true;
      chosenTile.flipPhase = 1;
      chosenTile.flipElapsed = 0;
      chosenTile.flipAccumSec = 0;
      chosenTile.activePreStage = plan;

      if (chosenTile.flipInner && typeof chosenTile.flipInner.animate === 'function') {
        try {
          cancelTileFlipAnimation(chosenTile);
          // Set inline style to scaleX(0.01) while anim1 animates from scaleX(1) -> scaleX(0.01) with fill: 'none'.
          // This avoids WAAPI `fill: 'forwards'` ever locking the element at a thin vertical line in Phase 2!
          chosenTile.flipInner.style.transform = 'scaleX(0.01)';
          const anim1 = chosenTile.flipInner.animate(
            [{ transform: 'scaleX(1)' }, { transform: 'scaleX(0.01)' }],
            {
              duration: Math.round(MASONRY_FLIP_HALF_SEC * 1000),
              easing: 'cubic-bezier(0.4, 0, 0.85, 0.6)',
              fill: 'none'
            }
          );
          chosenTile.flipAnim = anim1;
          anim1.onfinish = () => {
            cancelTileFlipAnimation(chosenTile);
            executeMasonryFlipMidpoint(chosenTile);
          };
          anim1.oncancel = () => {
            if (chosenTile.flipAnim === anim1) {
              chosenTile.flipAnim = null;
            }
          };
          return;
        } catch (e) {
          chosenTile.flipAnim = null;
        }
      }
    }

    function triggerNextMasonryFlip(forceIgnorePlayGuard = false) {
      if (DISPLAY_MODE !== 'masonry' || masonryTileList.length === 0) {
        pumpPreloader();
        return false;
      }

      // Strictly allow at most 1 active flip/reflow at a time across the 36-tile grid
      if (isAnyMasonryTileBusy()) {
        return false;
      }

      // Fast path: If a background pre-staged switch is ready and valid, launch it with zero setup overhead
      if (
        preStagedMasonryPlan &&
        preStagedMasonryPlan.tile &&
        !preStagedMasonryPlan.tile.isFlipping &&
        masonryTileList.includes(preStagedMasonryPlan.tile)
      ) {
        const plan = preStagedMasonryPlan;
        preStagedMasonryPlan = null;
        const chosenTile = plan.tile;
        recordShownMedia(plan.ready);
        launchTileFlipPhase1(chosenTile, plan);
        return true;
      }

      clearPreStagedMasonrySwitch(true);
      if (readyImageQueue.length === 0) {
        pumpPreloader();
        return false;
      }

      const busyGroups = new Set();
      for (let i = 0; i < masonryTileList.length; i++) {
        if (masonryTileList[i].isFlipping || masonryTileList[i].isReflowing) {
          busyGroups.add(masonryTileList[i].groupIndex);
        }
      }

      let eligible = masonryTileList.filter(
        t => !t.isFlipping && !busyGroups.has(t.groupIndex) && (forceIgnorePlayGuard || t.hasPlayedOnce)
      );
      if (eligible.length === 0) {
        return false;
      }

      const chosenTile = eligible[Math.floor(Math.random() * eligible.length)];
      let desiredFlipAspect = chosenTile.rawAspect || chosenTile.aspect;
      if (MASONRY_LAYOUT === 'rows' && masonryGroups[chosenTile.groupIndex]) {
        const grp = masonryGroups[chosenTile.groupIndex];
        const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));
        const availRowW = Math.max(64, grp.w - gap * Math.max(0, grp.tiles.length - 1));
        let otherAspectSum = 0;
        for (let i = 0; i < grp.tiles.length; i++) {
          if (grp.tiles[i].id !== chosenTile.id) {
            otherAspectSum += clampRowTileAspect(grp.tiles[i].rawAspect || grp.tiles[i].aspect);
          }
        }
        const idealRowAspectSum = availRowW / Math.max(24, grp.h);
        desiredFlipAspect = Math.max(0.25, idealRowAspectSum - otherAspectSum);
      }

      const nextReady = MASONRY_LAYOUT === 'rows'
        ? pullBestAspectMatchFromReadyQueue(desiredFlipAspect)
        : readyImageQueue.shift();
      if (!nextReady) return false;
      recordShownMedia(nextReady);
      pumpPreloader();

      if (MASONRY_EDGE_FILL === 'blur' && !nextReady.ambientBgUrl && nextReady.media) {
        nextReady.ambientBgUrl = computeAmbientBackdropDataUrl(nextReady.media);
      }

      const newAspect = clampTileAspect(nextReady.aspect);
      const newRawAspect = clampRowTileAspect(nextReady.aspect);
      const newSizeJitter = 1.0;
      const stagedMediaEl = nextReady.media;
      if (stagedMediaEl && chosenTile.flipInner) {
        stagedMediaEl.className = 'masonry-media pre-staged-media';
        chosenTile.flipInner.appendChild(stagedMediaEl);
      }
      const reflowPlan = precomputeGroupReflowPlan(chosenTile.groupIndex, chosenTile.id, newAspect, newSizeJitter);

      launchTileFlipPhase1(chosenTile, {
        tile: chosenTile,
        ready: nextReady,
        stagedMediaEl: stagedMediaEl,
        newAspect: newAspect,
        newRawAspect: newRawAspect,
        newSizeJitter: newSizeJitter,
        reflowPlan: reflowPlan
      });
      return true;
    }

    function updateMasonryMode(deltaTime) {
      const targetTileCount = getDesiredMasonryTileCount(false);
      const { minCount } = getTargetTileCountBounds(MASONRY_TILES);

      // Handle initial Masonry cardboard box loading screen & smooth fade-in transition
      if (masonryLoadPhase !== 'done') {
        if (masonryLoadPhase === 'idle') {
          startMasonryLoadingSequence();
        }

        if (masonryLoadPhase === 'loading') {
          masonryLoadElapsedSec += deltaTime;
          pumpPreloader();
          drawMasonryCardboardBox(0, 1.0);

          const readyCount = masonryTileList.length + readyImageQueue.length;
          const queueExhausted = !isFetching && activePreloadCount === 0 && postQueue.length === 0 && readyCount > 0;
          const enoughLoaded = readyCount >= targetTileCount ||
                               (readyCount >= minCount && masonryLoadElapsedSec >= 1.5) ||
                               queueExhausted ||
                               (masonryLoadElapsedSec >= MASONRY_MAX_LOAD_WAIT_SEC && readyCount > 0);

          if (masonryLoadElapsedSec >= MASONRY_MIN_CLOSED_SEC && enoughLoaded) {
            // Mount and layout the entire Masonry grid atomically behind the black overlay
            populateMasonryIfNeeded(true);
            masonryLoadPhase = 'opening';
            masonryLoadElapsedSec = 0;
            masonryOpenProgress = 0;
          }
          return;
        }

        if (masonryLoadPhase === 'opening') {
          masonryLoadElapsedSec += deltaTime;
          masonryOpenProgress = Math.min(1.0, masonryLoadElapsedSec / MASONRY_BOX_OPEN_SEC);
          drawMasonryCardboardBox(masonryOpenProgress, 1.0);

          if (masonryLoadElapsedSec >= MASONRY_BOX_OPEN_SEC + MASONRY_BOX_OPEN_HOLD_SEC) {
            masonryLoadPhase = 'fading';
            masonryLoadElapsedSec = 0;
            if (masonryLoadingOverlay) {
              masonryLoadingOverlay.classList.add('fade-out');
              masonryLoadingOverlay.style.opacity = '0';
            }
          }
          return;
        }

        if (masonryLoadPhase === 'fading') {
          masonryLoadElapsedSec += deltaTime;
          if (masonryLoadElapsedSec >= MASONRY_FADE_IN_SEC + 0.08) {
            masonryLoadPhase = 'done';
            if (masonryLoadingOverlay) {
              masonryLoadingOverlay.classList.remove('active', 'fade-out');
              masonryLoadingOverlay.style.opacity = '0';
            }
          }
          return;
        }
      }

      if (masonryTileList.length < minCount || (!isAnyMasonryTileBusy() && preStagedMasonryPlan === null && masonryTileList.length < targetTileCount)) {
        if (readyImageQueue.length > 0) {
          populateMasonryIfNeeded();
        } else if (activePreloadCount === 0) {
          pumpPreloader();
        }
      }

      for (let i = 0; i < masonryTileList.length; i++) {
        const tile = masonryTileList[i];
        if (!tile.hasPlayedOnce) {
          tile.liveElapsedSec += deltaTime;
          if (tile.liveElapsedSec >= (tile.minPlayDurationSec || 2.5)) {
            tile.hasPlayedOnce = true;
          }
        }

        // Advance neighbor FLIP timer; include a watchdog timeout in case WAAPI onfinish is delayed
        if (tile.isReflowing) {
          tile.flipReflowElapsed += deltaTime;
          const rp = Math.min(1.0, tile.flipReflowElapsed / MASONRY_REFLOW_DURATION_SEC);
          if (tile.reflowAnim && tile.flipReflowElapsed >= MASONRY_REFLOW_DURATION_SEC + 0.06) {
            cancelTileReflowAnimation(tile);
            tile.isReflowing = false;
            tile.reflowAccumSec = 0;
            if (tile.element) {
              tile.element.classList.remove('is-reflowing');
              tile.element.style.transform = `translate3d(${tile.x}px, ${tile.y}px, 0)`;
            }
          } else if (!tile.reflowAnim) {
            if (rp >= 1.0) {
              tile.isReflowing = false;
              tile.reflowAccumSec = 0;
              if (tile.element) {
                tile.element.classList.remove('is-reflowing');
                tile.element.style.transform = `translate3d(${tile.x}px, ${tile.y}px, 0)`;
              }
            } else {
              tile.reflowAccumSec = (tile.reflowAccumSec || 0) + deltaTime;
              if (tile.reflowAccumSec >= 0.016) {
                tile.reflowAccumSec = 0;
                const ease = 1 - Math.pow(1 - rp, 3);
                const curX = tile.x + tile.flipFromX * (1 - ease);
                const curY = tile.y + tile.flipFromY * (1 - ease);
                const curSX = 1 + (tile.flipFromSX - 1) * (1 - ease);
                const curSY = 1 + (tile.flipFromSY - 1) * (1 - ease);
                if (tile.element) {
                  tile.element.style.transform = `translate3d(${curX.toFixed(1)}px, ${curY.toFixed(1)}px, 0) scale3d(${curSX.toFixed(4)}, ${curSY.toFixed(4)}, 1)`;
                }
              }
            }
          }
        }

        // Advance card flip timer; include a watchdog timeout so a tile can never stay stuck mid-flip
        if (tile.isFlipping) {
          tile.flipElapsed += deltaTime;
          if (tile.flipAnim && tile.flipElapsed >= MASONRY_FLIP_HALF_SEC + 0.06) {
            cancelTileFlipAnimation(tile);
            if (tile.flipPhase === 1) {
              executeMasonryFlipMidpoint(tile);
            } else {
              finishMasonryTileFlip(tile);
            }
          } else if (!tile.flipAnim) {
            tile.flipAccumSec = (tile.flipAccumSec || 0) + deltaTime;
            if (tile.flipPhase === 1) {
              const p = Math.min(1.0, tile.flipElapsed / MASONRY_FLIP_HALF_SEC);
              if (p >= 1.0) {
                executeMasonryFlipMidpoint(tile);
              } else if (tile.flipAccumSec >= 0.016 && tile.flipInner) {
                tile.flipAccumSec = 0;
                const sx = Math.max(0.01, 1.0 - p * 0.99);
                tile.flipInner.style.transform = `scaleX(${sx.toFixed(3)})`;
              }
            } else if (tile.flipPhase === 2) {
              const p = Math.min(1.0, tile.flipElapsed / MASONRY_FLIP_HALF_SEC);
              if (p >= 1.0) {
                finishMasonryTileFlip(tile);
              } else if (tile.flipAccumSec >= 0.016 && tile.flipInner) {
                tile.flipAccumSec = 0;
                const sx = Math.max(0.01, 0.01 + p * 0.99);
                tile.flipInner.style.transform = `scaleX(${sx.toFixed(3)})`;
              }
            }
          }
        }
      }

      if (WALLPAPER_PAUSED) return;

      masonrySwitchTimer += deltaTime;
      const delayTarget = Math.max(1, Math.min(60, Number(MASONRY_DELAY) || 5));

      // Pre-render & pre-organize the next media switch in the background before the flip timer fires
      const preStageThreshold = Math.max(0.15, delayTarget - MASONRY_PRE_STAGE_LEAD_SEC);
      if (!preStagedMasonryPlan && masonrySwitchTimer >= preStageThreshold && masonrySwitchTimer < delayTarget) {
        preStageNextMasonrySwitch();
      }

      if (masonrySwitchTimer >= delayTarget) {
        if (triggerNextMasonryFlip(false)) {
          masonrySwitchTimer = 0;
        } else {
          masonrySwitchTimer = Math.max(0, delayTarget - 0.25);
        }
      }
    }

    // =========================================================================
    // MAIN ANIMATION LOOP & RESIZE HANDLING
    // =========================================================================
    window.addEventListener('resize', () => {
      if (DISPLAY_MODE === 'scroll') {
        relayoutScrollItems();
      } else if (DISPLAY_MODE === 'slideshow') {
        filterQueuesForSlideshowOrientation();
        if (currentSlideItem && !matchesScreenOrientation(currentSlideItem.aspect)) {
          advanceSlideshowIfReady();
        }
        pumpPreloader();
      } else if (DISPLAY_MODE === 'masonry') {
        relayoutMasonryGrid();
      } else {
        resizePolaroidCanvas(true);
        coverageGrid.fill(0);
        coveredCellCount = 0;
        screenFullyCovered = false;
        for (let i = 0; i < polaroidItems.length; i++) {
          markCoverageForLandedItem(polaroidItems[i]);
        }
      }
    });

    function animate(currentTime) {
      if (!VSYNC_ENABLED) {
        if (lastRafTimestamp === null) {
          lastRafTimestamp = currentTime;
        }
        const rafElapsedMs = Math.max(0, currentTime - lastRafTimestamp);
        lastRafTimestamp = currentTime;
        const clampedFps = Math.max(15, Math.min(240, TARGET_FPS || 60));
        const targetIntervalMs = 1000 / clampedFps;
        frameAccumulatorMs += Math.min(rafElapsedMs, 250);
        if (frameAccumulatorMs + 0.35 < targetIntervalMs) {
          requestAnimationFrame(animate);
          return;
        }
        frameAccumulatorMs %= targetIntervalMs;
      } else {
        lastRafTimestamp = currentTime;
        frameAccumulatorMs = 0;
      }

      if (lastTime === null) {
        lastTime = currentTime;
      }
      const rawDelta = (currentTime - lastTime) / 1000;
      const deltaTime = rawDelta > 0 ? Math.min(rawDelta, 0.25) : 0;
      lastTime = currentTime;

      if (!APP_PAUSED && !WALLPAPER_PAUSED && SCREEN_ENABLED) {
        if (DISPLAY_MODE === 'scroll') {
          updateScrollMode(deltaTime);
        } else if (DISPLAY_MODE === 'slideshow') {
          updateSlideshowMode(deltaTime);
        } else if (DISPLAY_MODE === 'masonry') {
          updateMasonryMode(deltaTime);
        } else {
          updatePolaroidMode(deltaTime);
        }
      }

      requestAnimationFrame(animate);
    }

    // =========================================================================
    // EPOCH, PAUSE & NAVIGATION STATE POLLING
    // =========================================================================
    setInterval(async () => {
      if (isPollingEpoch) return;
      isPollingEpoch = true;
      try {
        const res = await fetch(`${LOCAL_ORIGIN}/epoch?screen=${encodeURIComponent(SCREEN_ID)}&_t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (typeof data.enabled === 'boolean') {
            window.setScreenEnabled(data.enabled);
          }

          if (typeof data.app_paused === 'boolean' || typeof data.wallpaper_paused === 'boolean') {
            window.applyPauseStates(data.app_paused, data.wallpaper_paused);
          }

          if (typeof data.nav_seq === 'number') {
            if (lastNavSeq === null) {
              lastNavSeq = data.nav_seq;
            } else if (data.nav_seq > lastNavSeq) {
              if (data.nav_action === 'prev') {
                window.triggerPreviousMedia(data.nav_seq);
              } else if (data.nav_action === 'next') {
                window.triggerNextMedia(data.nav_seq);
              } else {
                lastNavSeq = data.nav_seq;
              }
            }
          }

          if (typeof data.prop_seq === 'number') {
            if (lastPropSeq === null) {
              lastPropSeq = data.prop_seq;
            } else if (data.prop_seq > lastPropSeq) {
              lastPropSeq = data.prop_seq;
              const propRes = await fetch(`${LOCAL_ORIGIN}/properties?screen=${encodeURIComponent(SCREEN_ID)}&_t=${Date.now()}`, { cache: 'no-store' });
              if (propRes.ok) {
                const payload = await propRes.json();
                if (typeof payload.enabled === 'boolean') {
                  window.setScreenEnabled(payload.enabled);
                }
                const props = payload.properties || payload;
                if (window.wallpaperPropertyListener && window.wallpaperPropertyListener.applyUserProperties) {
                  window.wallpaperPropertyListener.applyUserProperties(props);
                }
              }
            }
          }

          if (currentEpoch === null) {
            currentEpoch = data.epoch;
            return;
          }

          if (data.epoch !== currentEpoch) {
            currentEpoch = data.epoch;
            postQueue = [];
            consecutiveEmptyFetches = 0;
            consecutiveLoadErrors = 0;
            preloaderBackoffUntil = 0;
            nextAllowedFetchTime = 0;
            clearReadyQueue();

            if (!APP_PAUSED && SCREEN_ENABLED) {
              if (DISPLAY_MODE === 'scroll') {
                const visibleItems = [];
                for (let i = 0; i < activeItems.length; i++) {
                  const item = activeItems[i];
                  const isVisible = isHorizontalScroll()
                    ? ((item.x + item.width > 0) && (item.x < window.innerWidth))
                    : ((item.y + item.height > 0) && (item.y < window.innerHeight));
                  if (isVisible) {
                    visibleItems.push(item);
                  } else {
                    destroyItem(item);
                  }
                }
                activeItems = visibleItems;
                await fetchNextPage(true);
                fillScrollBuffer();
              } else if (DISPLAY_MODE === 'slideshow') {
                slideshowTimer = 999999;
                await fetchNextPage(true);
              } else if (DISPLAY_MODE === 'masonry') {
                clearPreStagedMasonrySwitch(false);
                masonrySwitchTimer = 999;
                await fetchNextPage(true);
              } else {
                timeSinceLastDrop = 999;
                await fetchNextPage(true);
              }
            }
          }
        }
      } catch (e) {
      } finally {
        isPollingEpoch = false;
      }
    }, 400);

    // =========================================================================
    // WALLPAPER ENGINE PROPERTY LISTENER
    // =========================================================================
    window.wallpaperPropertyListener = {
      applyUserProperties: function(properties) {
        if (!properties) return;
        if (properties.vsync !== undefined && properties.vsync !== null) {
          const rawVsync = properties.vsync.value !== undefined ? properties.vsync.value : properties.vsync;
          const newVsync = !(
            rawVsync === false ||
            rawVsync === 0 ||
            String(rawVsync).trim().toLowerCase() === 'false' ||
            String(rawVsync).trim().toLowerCase() === 'off' ||
            String(rawVsync).trim().toLowerCase() === '0'
          );
          if (VSYNC_ENABLED !== newVsync) {
            VSYNC_ENABLED = newVsync;
            frameAccumulatorMs = 0;
            lastRafTimestamp = null;
            lastTime = null;
            for (let i = 0; i < fallingItems.length; i++) {
              const it = fallingItems[i];
              if (!VSYNC_ENABLED && it.dropAnim) {
                try { it.dropAnim.cancel(); } catch (e) {}
                it.dropAnim = null;
              } else if (VSYNC_ENABLED && !it.dropAnim) {
                launchPolaroidWaapiDrop(it);
              }
            }
          }
        }
        if (properties.targetfps !== undefined && properties.targetfps !== null) {
          const rawFps = Number(properties.targetfps.value !== undefined ? properties.targetfps.value : properties.targetfps);
          if (Number.isFinite(rawFps)) {
            TARGET_FPS = Math.max(15, Math.min(240, Math.round(rawFps)));
          }
        }
        if (properties.schemecolor && properties.schemecolor.value) {
          const parts = String(properties.schemecolor.value).trim().split(/\s+/).map(Number);
          if (parts.length >= 3 && !parts.some(isNaN)) {
            const r = Math.round(Math.min(1, Math.max(0, parts[0])) * 255);
            const g = Math.round(Math.min(1, Math.max(0, parts[1])) * 255);
            const b = Math.round(Math.min(1, Math.max(0, parts[2])) * 255);
            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
          }
        }
        if (properties.scrolldirection && properties.scrolldirection.value) {
          const val = String(properties.scrolldirection.value).toLowerCase();
          const allowedDirs = ['left', 'right', 'up', 'down'];
          const newDir = allowedDirs.includes(val) ? val : 'left';
          if (SCROLL_DIRECTION !== newDir) {
            const axisChanged = (SCROLL_DIRECTION === 'left' || SCROLL_DIRECTION === 'right') !==
                                (newDir === 'left' || newDir === 'right');
            SCROLL_DIRECTION = newDir;
            if (DISPLAY_MODE === 'scroll') {
              if (axisChanged) {
                for (let i = 0; i < activeItems.length; i++) {
                  const it = activeItems[i];
                  if (it.mediaElement) {
                    readyImageQueue.unshift({
                      media: it.mediaElement,
                      url: it.url || it.mediaElement.src || '',
                      postId: Number(it.postId) || 0,
                      tags: String(it.tags || ''),
                      artistTags: String(it.artistTags || ''),
                      isVideo: Boolean(it.isVideo),
                      isAnimated: Boolean(it.isAnimated),
                      isGif: Boolean(it.isGif),
                      gifLoopDurationSec: Number(it.gifLoopDurationSec) || 2.5,
                      aspect: Number(it.aspect) || 1.0,
                      naturalW: Number(it.naturalW) || 1,
                      naturalH: Number(it.naturalH) || 1,
                      ambientBgUrl: it.ambientBgUrl || ''
                    });
                    if (it.element && it.element.parentNode) {
                      it.element.parentNode.removeChild(it.element);
                    }
                  }
                }
                activeItems = [];
              }
              fillScrollBuffer();
            }
          }
        }
        if (properties.scrollspeed !== undefined && properties.scrollspeed !== null) {
          const parsedSpeed = Number(properties.scrollspeed.value);
          if (Number.isFinite(parsedSpeed) && parsedSpeed >= 0) {
            SCROLL_SPEED = parsedSpeed;
          }
        }
        if (properties.gapsize !== undefined) {
          GAP = Number(properties.gapsize.value);
          if (DISPLAY_MODE === 'scroll') relayoutScrollItems();
        }
        if (properties.dropspeed) {
          POLAROID_DROP_SPEED = Number(properties.dropspeed.value) || 1.0;
        }
        if (properties.minsize) {
          POLAROID_MIN_SIZE = Number(properties.minsize.value) || 220;
          if (POLAROID_MIN_SIZE > POLAROID_MAX_SIZE) POLAROID_MAX_SIZE = POLAROID_MIN_SIZE;
        }
        if (properties.maxsize) {
          POLAROID_MAX_SIZE = Number(properties.maxsize.value) || 440;
          if (POLAROID_MAX_SIZE < POLAROID_MIN_SIZE) POLAROID_MIN_SIZE = POLAROID_MAX_SIZE;
        }
        if (properties.dropdelay !== undefined) {
          const rawDelay = Number(properties.dropdelay.value);
          POLAROID_DROP_DELAY = isNaN(rawDelay) ? 0 : Math.max(0, Math.min(600, rawDelay));
        }
        if (properties.slideshowfade !== undefined && properties.slideshowfade !== null) {
          const rawFade = Number(properties.slideshowfade.value);
          SLIDESHOW_FADE = isNaN(rawFade) ? 5.0 : Math.max(0, Math.min(10, rawFade));
        }
        if (properties.slideshowduration !== undefined && properties.slideshowduration !== null) {
          const rawDur = Number(properties.slideshowduration.value);
          SLIDESHOW_DURATION = isNaN(rawDur) ? 10 : Math.max(0, Math.min(600, rawDur));
        }
        if (properties.masonrytiles !== undefined && properties.masonrytiles !== null) {
          const rawTiles = Math.round(Number(properties.masonrytiles.value));
          const newTiles = isNaN(rawTiles) ? 12 : Math.max(4, Math.min(36, rawTiles));
          if (MASONRY_TILES !== newTiles) {
            MASONRY_TILES = newTiles;
            if (DISPLAY_MODE === 'masonry') {
              cancelActiveMasonryFlipsAndPlans();
              populateMasonryIfNeeded(false, true);
              if (masonryTileList.length > 0 && masonryLoadPhase === 'done') {
                rebuildFullMasonryLayout(true);
              }
            }
          }
        }
        if (properties.masonryedgefill && properties.masonryedgefill.value !== undefined) {
          switchMasonryEdgeFill(properties.masonryedgefill.value);
        }
        if (properties.masonrylayout && properties.masonrylayout.value !== undefined) {
          switchMasonryLayoutEngine(properties.masonrylayout.value);
        }
        if (properties.masonrygap !== undefined && properties.masonrygap !== null) {
          const rawGap = Math.round(Number(properties.masonrygap.value));
          const newGap = isNaN(rawGap) ? 4 : Math.max(0, Math.min(10, rawGap));
          if (MASONRY_GAP !== newGap) {
            MASONRY_GAP = newGap;
            if (DISPLAY_MODE === 'masonry') {
              relayoutMasonryGrid();
            }
          }
        }
        if (properties.masonrydelay !== undefined && properties.masonrydelay !== null) {
          const rawMDelay = Math.round(Number(properties.masonrydelay.value));
          MASONRY_DELAY = isNaN(rawMDelay) ? 5 : Math.max(1, Math.min(60, rawMDelay));
        }
        if (properties.displaymode && properties.displaymode.value) {
          switchDisplayMode(properties.displaymode.value);
        }
      }
    };

    async function init() {
      resizePolaroidCanvas(false);
      try {
        const propRes = await fetch(`${LOCAL_ORIGIN}/properties?screen=${encodeURIComponent(SCREEN_ID)}&_t=${Date.now()}`, { cache: 'no-store' });
        if (propRes.ok) {
          const payload = await propRes.json();
          const props = payload.properties || payload;
          // Apply screen enabled and pause states BEFORE applyUserProperties so switchDisplayMode()
          // and startMasonryLoadingSequence() see SCREEN_ENABLED === true on startup
          if (typeof payload.enabled === 'boolean') {
            window.setScreenEnabled(payload.enabled);
          }
          if (typeof payload.app_paused === 'boolean' || typeof payload.wallpaper_paused === 'boolean') {
            window.applyPauseStates(payload.app_paused, payload.wallpaper_paused);
          }
          if (window.wallpaperPropertyListener && window.wallpaperPropertyListener.applyUserProperties) {
            window.wallpaperPropertyListener.applyUserProperties(props);
          }
        }
      } catch (e) {}

      requestAnimationFrame(animate);
      if (SCREEN_ENABLED && !APP_PAUSED) {
        if (DISPLAY_MODE === 'masonry' && masonryLoadPhase === 'idle') {
          startMasonryLoadingSequence();
        }
        await fetchNextPage(true);
        pumpPreloader();
        if (DISPLAY_MODE === 'scroll') {
          fillScrollBuffer();
        } else if (DISPLAY_MODE === 'masonry' && masonryLoadPhase === 'done') {
          populateMasonryIfNeeded();
        } else if (DISPLAY_MODE === 'slideshow') {
          advanceSlideshowIfReady();
        }
      }
    }

    window.onload = init;
  </script>
</body>
</html>
