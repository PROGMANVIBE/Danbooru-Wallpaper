      if (DISPLAY_MODE !== 'scroll' || activeItems.length === 0) return;
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      if (screenWidth <= 0 || screenHeight <= 0) return;

      if (isHorizontalScroll()) {
        let runningX = activeItems[0].x;
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.width = Math.max(1, item.aspect * screenHeight);
          item.height = screenHeight;
          item.x = runningX;
          item.y = 0;
          item.element.style.width = `${item.width}px`;
          item.element.style.height = `${screenHeight}px`;
          item.element.style.transform = `translate3d(${item.x}px, 0, 0)`;
          runningX += item.width + GAP;
        }
      } else {
        let runningY = activeItems[0].y;
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.width = screenWidth;
          item.height = Math.max(1, screenWidth / Math.max(0.05, item.aspect));
          item.x = 0;
          item.y = runningY;
          item.element.style.width = `${screenWidth}px`;
          item.element.style.height = `${item.height}px`;
          item.element.style.transform = `translate3d(0, ${item.y}px, 0)`;
          runningY += item.height + GAP;
        }
      }
      fillScrollBuffer();
    }

    function updateScrollMode(deltaTime) {
      if (WALLPAPER_PAUSED) return;

      const moveBy = SCROLL_SPEED * deltaTime;
      let removedAny = false;
      const sw = window.innerWidth;
      const sh = window.innerHeight;

      if (SCROLL_DIRECTION === 'left') {
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.x -= moveBy;
          item.element.style.transform = `translate3d(${item.x}px, 0, 0)`;
          if (!item.hasReportedShown && item.x < sw && (item.x + item.width) > 0) {
            item.hasReportedShown = true;
            recordShownMedia(item);
          }
        }
        while (activeItems.length > 0 && (activeItems[0].x + activeItems[0].width) < -100) {
          destroyItem(activeItems.shift());
          removedAny = true;
        }
      } else if (SCROLL_DIRECTION === 'right') {
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.x += moveBy;
          item.element.style.transform = `translate3d(${item.x}px, 0, 0)`;
          if (!item.hasReportedShown && item.x < sw && (item.x + item.width) > 0) {
            item.hasReportedShown = true;
            recordShownMedia(item);
          }
        }
        while (activeItems.length > 0 && activeItems[activeItems.length - 1].x > sw + 100) {
          destroyItem(activeItems.pop());
          removedAny = true;
        }
      } else if (SCROLL_DIRECTION === 'up') {
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.y -= moveBy;
          item.element.style.transform = `translate3d(0, ${item.y}px, 0)`;
          if (!item.hasReportedShown && item.y < sh && (item.y + item.height) > 0) {
            item.hasReportedShown = true;
            recordShownMedia(item);
          }
        }
        while (activeItems.length > 0 && (activeItems[0].y + activeItems[0].height) < -100) {
          destroyItem(activeItems.shift());
          removedAny = true;
        }
      } else if (SCROLL_DIRECTION === 'down') {
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.y += moveBy;
          item.element.style.transform = `translate3d(0, ${item.y}px, 0)`;
          if (!item.hasReportedShown && item.y < sh && (item.y + item.height) > 0) {
            item.hasReportedShown = true;
            recordShownMedia(item);
          }
        }
        while (activeItems.length > 0 && activeItems[activeItems.length - 1].y > sh + 100) {
          destroyItem(activeItems.pop());
          removedAny = true;
        }
      }

      if (removedAny || readyImageQueue.length > 0 || activeItems.length === 0) {
        fillScrollBuffer();
      }
    }

    // =========================================================================
    // MODE 2: CONTINUOUS STACKING POLAROID
    // =========================================================================
    function chooseSmartLandingSpot(totalW, totalH) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const cellW = sw / GRID_COLS;
      const cellH = sh / GRID_ROWS;

      if (!screenFullyCovered && Math.random() < 0.85) {
        const uncoveredIndices = [];
        for (let i = 0; i < TOTAL_GRID_CELLS; i++) {
          if (coverageGrid[i] === 0) uncoveredIndices.push(i);
        }
        if (uncoveredIndices.length > 0) {
          const chosenIdx = uncoveredIndices[Math.floor(Math.random() * uncoveredIndices.length)];
          const col = chosenIdx % GRID_COLS;
          const row = Math.floor(chosenIdx / GRID_COLS);

          const jitterX = (Math.random() - 0.5) * cellW * 3;
          const jitterY = (Math.random() - 0.5) * cellH * 3;
          const centerX = (col + 0.5) * cellW + jitterX;
          const centerY = (row + 0.5) * cellH + jitterY;

          return {
            x: centerX - totalW / 2,
            y: centerY - totalH / 2
          };
        }
      }

      if (polaroidItems.length > 0 && Math.random() < 0.35) {
        const oldestId = polaroidItems[0].id;
        const oldestCells = [];
        for (let i = 0; i < TOTAL_GRID_CELLS; i++) {
          if (coverageGrid[i] === oldestId) oldestCells.push(i);
        }
        if (oldestCells.length > 0) {
          const chosenIdx = oldestCells[Math.floor(Math.random() * oldestCells.length)];
          const col = chosenIdx % GRID_COLS;
          const row = Math.floor(chosenIdx / GRID_COLS);

          const jitterX = (Math.random() - 0.5) * totalW * 0.35;
          const jitterY = (Math.random() - 0.5) * totalH * 0.35;
          const centerX = (col + 0.5) * cellW + jitterX;
          const centerY = (row + 0.5) * cellH + jitterY;

          return {
            x: centerX - totalW / 2,
            y: centerY - totalH / 2
          };
        }
      }

      const marginX = totalW * 0.2;
      const marginY = totalH * 0.2;
      const x = -marginX + Math.random() * (sw - totalW + marginX * 2);
      const y = -marginY + Math.random() * (sh - totalH + marginY * 2);
      return { x, y };
    }

    function markCoverageForLandedItem(item) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      if (sw <= 0 || sh <= 0) return;

      const cellW = sw / GRID_COLS;
      const cellH = sh / GRID_ROWS;

      const cx = item.targetX + item.totalW / 2;
      const cy = item.targetY + item.totalH / 2;

      const halfW = Math.max(10, item.totalW / 2 - COVERAGE_INSET_PX);
      const halfH = Math.max(10, item.totalH / 2 - COVERAGE_INSET_PX);

      const rad = (-item.targetRot * Math.PI) / 180;
      const cosA = Math.cos(rad);
      const sinA = Math.sin(rad);

      for (let r = 0; r < GRID_ROWS; r++) {
        const py = (r + 0.5) * cellH - cy;
        for (let c = 0; c < GRID_COLS; c++) {
          const px = (c + 0.5) * cellW - cx;
          const localX = px * cosA - py * sinA;
          const localY = px * sinA + py * cosA;

          if (Math.abs(localX) <= halfW && Math.abs(localY) <= halfH) {
            const idx = r * GRID_COLS + c;
            if (coverageGrid[idx] === 0) {
              coveredCellCount++;
            }
            coverageGrid[idx] = item.id;
          }
        }
      }

      if (coveredCellCount >= TOTAL_GRID_CELLS * 0.985) {
        screenFullyCovered = true;
      }
    }

    function doPolaroidsOverlap(a, b) {
      if (!a || !b) return false;
      const aRad = Math.abs((a.targetRot || 0) * Math.PI / 180);
      const bRad = Math.abs((b.targetRot || 0) * Math.PI / 180);
      const aCos = Math.cos(aRad), aSin = Math.sin(aRad);
      const bCos = Math.cos(bRad), bSin = Math.sin(bRad);

      const aHalfW = (a.totalW * aCos + a.totalH * aSin) * 0.5 + 14;
      const aHalfH = (a.totalW * aSin + a.totalH * aCos) * 0.5 + 14;
      const bHalfW = (b.totalW * bCos + b.totalH * bSin) * 0.5 + 14;
      const bHalfH = (b.totalW * bSin + b.totalH * bCos) * 0.5 + 14;

      const aCx = a.targetX + a.totalW * 0.5;
      const aCy = a.targetY + a.totalH * 0.5;
      const bCx = b.targetX + b.totalW * 0.5;
      const bCy = b.targetY + b.totalH * 0.5;

      return Math.abs(aCx - bCx) <= (aHalfW + bHalfW) &&
             Math.abs(aCy - bCy) <= (aHalfH + bHalfH);
    }

    function prunePolaroidStackIfNeeded() {
      const visibleIds = new Set(coverageGrid);
      const toBakeSet = new Set();

      // 1. Mark any Polaroid (static or animated) that is 100% occluded for >= OCCLUDED_GRACE_DROPS
      for (let i = 0; i < polaroidItems.length; i++) {
        const item = polaroidItems[i];
        if (!visibleIds.has(item.id)) {
          item.occludedDrops = (item.occludedDrops || 0) + 1;
        } else {
          item.occludedDrops = 0;
        }
        if (item.occludedDrops >= OCCLUDED_GRACE_DROPS) {
          toBakeSet.add(item);
        }
      }

      // 2. Cap the number of live animated Polaroids in the DOM to MAX_LIVE_POLAROID_DOM
      let liveAnimatedCount = 0;
      for (let i = polaroidItems.length - 1; i >= 0; i--) {
        const item = polaroidItems[i];
        if (!toBakeSet.has(item) && item.isAnimated) {
          liveAnimatedCount++;
          if (liveAnimatedCount > MAX_LIVE_POLAROID_DOM) {
            toBakeSet.add(item);
          }
        }
      }

      // 3. Immediately bake every landed static Polaroid onto #polaroidBaseCanvas unless it overlaps
      //    an older live Polaroid below it in z-order (which must remain an active DOM node for animation).
      const remaining = [];
      for (let i = 0; i < polaroidItems.length; i++) {
        const item = polaroidItems[i];
        if (toBakeSet.has(item)) {
          pendingPolaroidBakes.push(item);
          continue;
        }
        if (!item.isAnimated) {
          let overlapsLowerLiveItem = false;
          for (let j = 0; j < remaining.length; j++) {
            if (doPolaroidsOverlap(item, remaining[j])) {
              overlapsLowerLiveItem = true;
              break;
            }
          }
          if (!overlapsLowerLiveItem) {
            pendingPolaroidBakes.push(item);
            continue;
          }
        }
        remaining.push(item);
      }

      // 4. Hard upper bound safety net for live DOM nodes
      while (remaining.length > MAX_LIVE_POLAROID_DOM + 4) {
        const oldest = remaining.shift();
        pendingPolaroidBakes.push(oldest);
      }

      polaroidItems = remaining;

      // Sort pending bakes strictly by ascending item.id (zIndex) so canvas layers never bake out of order
      if (pendingPolaroidBakes.length > 1) {
        pendingPolaroidBakes.sort((a, b) => a.id - b.id);
      }
    }

    function processPendingPolaroidBakes() {
      if (pendingPolaroidBakes.length === 0) return;
      if (DISPLAY_MODE === 'polaroid' && polaroidBaseCanvas.style.display !== 'block') {
        polaroidBaseCanvas.style.display = 'block';
      }
      // Defer 2D canvas baking while a Polaroid is actively mid-air unless the queue has > 3 items
      if (fallingItems.length > 0 && pendingPolaroidBakes.length <= 3) return;

      const maxBakesThisFrame = fallingItems.length === 0 ? 2 : 1;
      for (let i = 0; i < maxBakesThisFrame && pendingPolaroidBakes.length > 0; i++) {
        const nextToBake = pendingPolaroidBakes.shift();
        if (nextToBake) {
          bakePolaroidToCanvas(nextToBake);
          destroyItem(nextToBake);
        }
      }
    }

    function finishFallingPolaroidItem(item) {
      if (!item || item.landedDone) return;
      item.landedDone = true;

      if (item.dropAnim) {
        try { item.dropAnim.cancel(); } catch (e) {}
        item.dropAnim = null;
      }

      if (item.element) {
        if (typeof item.element.getAnimations === 'function') {
          try {
            const anims = item.element.getAnimations();
            for (let i = 0; i < anims.length; i++) {
              anims[i].cancel();
            }
          } catch (e) {}
        }
        item.element.classList.remove('falling');
        item.element.style.willChange = 'auto';
        item.element.style.opacity = '1';
        item.element.style.transform = `translate3d(${item.targetX.toFixed(1)}px, ${item.targetY.toFixed(1)}px, 0) scale(1) rotate(${item.targetRot.toFixed(2)}deg)`;
      }

      const idx = fallingItems.indexOf(item);
      if (idx !== -1) {
        fallingItems.splice(idx, 1);
      }
      markCoverageForLandedItem(item);
      polaroidItems.push(item);
      prunePolaroidStackIfNeeded();
    }

    function launchPolaroidWaapiDrop(itemObj) {
      if (!itemObj || !itemObj.element || typeof itemObj.element.animate !== 'function') return;
      const startTransform = `translate3d(${itemObj.startX.toFixed(1)}px, ${itemObj.startY.toFixed(1)}px, 0) scale(${itemObj.startScale.toFixed(3)}) rotate(${itemObj.startRot.toFixed(2)}deg)`;
      const endTransform = `translate3d(${itemObj.targetX.toFixed(1)}px, ${itemObj.targetY.toFixed(1)}px, 0) scale(1) rotate(${itemObj.targetRot.toFixed(2)}deg)`;
      const midX = itemObj.startX + (itemObj.targetX - itemObj.startX) * 0.42;
      const midY = itemObj.startY + (itemObj.targetY - itemObj.startY) * 0.42;
      const midScale = itemObj.startScale + (itemObj.targetScale - itemObj.startScale) * 0.42;
      const midRot = itemObj.startRot + (itemObj.targetRot - itemObj.startRot) * 0.42;
      const midTransform = `translate3d(${midX.toFixed(1)}px, ${midY.toFixed(1)}px, 0) scale(${midScale.toFixed(3)}) rotate(${midRot.toFixed(2)}deg)`;

      try {
        const remainingSec = Math.max(0.05, itemObj.duration - itemObj.elapsed);
        const anim = itemObj.element.animate(
          [
            { transform: startTransform, opacity: 0, offset: 0 },
            { transform: midTransform, opacity: 1, offset: 0.16 },
            { transform: endTransform, opacity: 1, offset: 1 }
          ],
          {
            duration: Math.round(remainingSec * 1000),
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
          }
        );
        if (APP_PAUSED || WALLPAPER_PAUSED) {
          anim.pause();
        }
        itemObj.dropAnim = anim;
        anim.onfinish = () => {
          finishFallingPolaroidItem(itemObj);
        };
      } catch (e) {
        itemObj.dropAnim = null;
      }
    }

    function spawnNextPolaroidItem() {
      if (DISPLAY_MODE !== 'polaroid' || readyImageQueue.length === 0 || APP_PAUSED || !SCREEN_ENABLED) {
        pumpPreloader();
        return false;
      }
      if (window.innerWidth <= 0 || window.innerHeight <= 0) {
        return false;
      }

      const ready = readyImageQueue.shift();
      recordShownMedia(ready);

      const media = ready.media;
      const aspect = ready.aspect;

      const minS = Math.min(POLAROID_MIN_SIZE, POLAROID_MAX_SIZE);
      const maxS = Math.max(POLAROID_MIN_SIZE, POLAROID_MAX_SIZE);
      const randomBaseSize = minS + Math.random() * (maxS - minS);

      let imgW, imgH;
      if (aspect >= 1) {
        imgW = randomBaseSize;
        imgH = randomBaseSize / aspect;
      } else {
        imgH = randomBaseSize;
        imgW = randomBaseSize * aspect;
      }

      const totalW = Math.round(imgW + POLAROID_PAD_SIDE * 2);
      const totalH = Math.round(imgH + POLAROID_PAD_TOP + POLAROID_PAD_BOTTOM);

      const landing = chooseSmartLandingSpot(totalW, totalH);
      const targetRot = (Math.random() - 0.5) * 28;
      const startRot = targetRot + (Math.random() - 0.5) * 24;

      const startX = (window.innerWidth - totalW) * 0.5 + (landing.x - (window.innerWidth - totalW) * 0.5) * 0.38;
      const startY = (window.innerHeight - totalH) * 0.5 + (landing.y - (window.innerHeight - totalH) * 0.5) * 0.38;
      const startScale = 1.85;
      const fallDuration = Math.max(0.25, 1.15 / Math.max(0.2, POLAROID_DROP_SPEED));

      const wrapper = document.createElement('div');
      wrapper.className = 'polaroid-item falling';
      wrapper.style.width = `${totalW}px`;
      wrapper.style.height = `${totalH}px`;
      wrapper.style.zIndex = String(nextZIndex++);
      wrapper.style.opacity = '0';
      wrapper.style.transform = `translate3d(${startX.toFixed(1)}px, ${startY.toFixed(1)}px, 0) scale(${startScale}) rotate(${startRot.toFixed(2)}deg)`;

      media.className = 'polaroid-img';
      wrapper.appendChild(media);

      const captionEl = document.createElement('div');
      captionEl.className = 'polaroid-caption';
      const bySpan = document.createElement('span');
      bySpan.className = 'polaroid-by';
      bySpan.textContent = 'By:';
      const artistSpan = document.createElement('span');
      artistSpan.className = 'polaroid-artist';
      artistSpan.textContent = formatPolaroidArtistText(ready.artistTags);
      captionEl.appendChild(bySpan);
      captionEl.appendChild(artistSpan);
      wrapper.appendChild(captionEl);

      stage.appendChild(wrapper);

      if (ready.isVideo) {
        enforceSilentVideo(media);
        media.play().catch(() => {});
      }

      const itemObj = {
        id: nextPolaroidId++,
        element: wrapper,
        mediaElement: media,
        artistTags: String(ready.artistTags || ''),
        isVideo: ready.isVideo,
        isAnimated: ready.isAnimated,
        totalW,
        totalH,
        startX,
        startY,
        targetX: landing.x,
        targetY: landing.y,
        startScale,
        targetScale: 1.0,
        startRot,
        targetRot,
        elapsed: 0,
        duration: fallDuration,
        occludedDrops: 0,
        dropAnim: null,
        landedDone: false
      };

      markCoverageForLandedItem(itemObj);
      fallingItems.push(itemObj);

      if (VSYNC_ENABLED) {
        launchPolaroidWaapiDrop(itemObj);
      }

      // Defer preloader replenishment if queue still has ready items so new drop starts with zero contention
      if (readyImageQueue.length < 4) {
        pumpPreloader();
      } else {
        setTimeout(pumpPreloader, 60);
      }

      return true;
    }

    function updatePolaroidMode(deltaTime) {
      if (WALLPAPER_PAUSED) return;

      if (fillScreenBurstRemaining > 0) {
        drainFillScreenBurst();
      } else {
        timeSinceLastDrop += deltaTime;
        const baseInterval = Math.max(0.25, 1.6 / Math.max(0.2, POLAROID_DROP_SPEED));
        const spawnInterval = baseInterval + Math.max(0, Math.min(600, POLAROID_DROP_DELAY));

        if (timeSinceLastDrop >= spawnInterval) {
          if (spawnNextPolaroidItem()) {
            timeSinceLastDrop = 0;
          } else {
            timeSinceLastDrop = spawnInterval - 0.25;
          }
        }
      }

      for (let i = fallingItems.length - 1; i >= 0; i--) {
        const item = fallingItems[i];
        item.elapsed += deltaTime;

        // If WAAPI compositor animation is active (V-Sync On), let the GPU compositor drive transform/opacity
        if (item.dropAnim) {
          if (item.elapsed >= item.duration + 0.08) {
            finishFallingPolaroidItem(item);
          }
          continue;
        }

        const progress = Math.min(item.elapsed / item.duration, 1.0);
        const ease = 1 - Math.pow(1 - progress, 3);

        const curX = item.startX + (item.targetX - item.startX) * ease;
        const curY = item.startY + (item.targetY - item.startY) * ease;
        const curScale = item.startScale + (item.targetScale - item.startScale) * ease;
        const curRot = item.startRot + (item.targetRot - item.startRot) * ease;
        const curOpacity = Math.min(progress / 0.16, 1.0);

        item.element.style.opacity = curOpacity.toFixed(3);
        item.element.style.transform = `translate3d(${curX.toFixed(1)}px, ${curY.toFixed(1)}px, 0) scale(${curScale.toFixed(4)}) rotate(${curRot.toFixed(2)}deg)`;

        if (progress >= 1.0) {
          finishFallingPolaroidItem(item);
        }
      }

      processPendingPolaroidBakes();
    }

    // =========================================================================
    // MODE 3: FULLSCREEN ORIENTATION-MATCHED SLIDESHOW WITH FADE TRANSITION
    // =========================================================================
    function popNextOrientationMatchedSlide() {
      while (readyImageQueue.length > 0) {
        const candidate = readyImageQueue.shift();
        if (matchesScreenOrientation(candidate.aspect)) {
          return candidate;
        }
        if (candidate && candidate.media) {
          cleanupMediaNode(candidate.media);
        }
      }
      return null;
    }

    function advanceSlideshowIfReady(forceInstantWhenManual = false) {
      if (DISPLAY_MODE !== 'slideshow' || APP_PAUSED || !SCREEN_ENABLED) {
        return false;
      }
      if (slideshowIsFading && !forceInstantWhenManual) {
        return false;
      }

      const nextReady = popNextOrientationMatchedSlide();
      pumpPreloader();
      if (!nextReady) return false;

      recordShownMedia(nextReady);

      const media = nextReady.media;
      media.className = 'slideshow-item';
      media.style.zIndex = '2';

      const fadeSec = Math.max(0, Math.min(10, SLIDESHOW_FADE)) / 10.0;

      if (!currentSlideItem || fadeSec <= 0.005) {
        media.style.opacity = '1';
        stage.appendChild(media);
        if (nextReady.isVideo) {
          enforceSilentVideo(media);
          media.play().catch(() => {});
        }
        if (previousSlideItem) {
          destroyItem(previousSlideItem);
          previousSlideItem = null;
        }
        if (currentSlideItem) {
          destroyItem(currentSlideItem);
        }
        currentSlideItem = {
          element: media,
          mediaElement: media,
          isVideo: nextReady.isVideo,
          isAnimated: nextReady.isAnimated,
          aspect: nextReady.aspect
        };
        slideshowTimer = 0;
        slideshowIsFading = false;
      } else {
        if (previousSlideItem) {
          destroyItem(previousSlideItem);
        }
        previousSlideItem = currentSlideItem;
        if (previousSlideItem && previousSlideItem.element) {
          previousSlideItem.element.style.zIndex = '1';
          previousSlideItem.element.style.opacity = '1';
        }

        media.style.opacity = '0';
        stage.appendChild(media);
        if (nextReady.isVideo) {
          enforceSilentVideo(media);
          media.play().catch(() => {});
        }

        currentSlideItem = {
          element: media,
          mediaElement: media,
          isVideo: nextReady.isVideo,
          isAnimated: nextReady.isAnimated,
          aspect: nextReady.aspect
        };
        slideshowFadeElapsed = 0;
        activeFadeDurationSec = fadeSec;
        slideshowIsFading = true;
        slideshowTimer = 0;
      }

      return true;
    }

    function updateSlideshowMode(deltaTime) {
      if (WALLPAPER_PAUSED) return;

      if (slideshowIsFading) {
        slideshowFadeElapsed += deltaTime;
        const progress = activeFadeDurationSec > 0
          ? Math.min(1.0, slideshowFadeElapsed / activeFadeDurationSec)
          : 1.0;

        if (currentSlideItem && currentSlideItem.element) {
          currentSlideItem.element.style.opacity = progress.toFixed(3);
        }
        if (previousSlideItem && previousSlideItem.element) {
          previousSlideItem.element.style.opacity = (1.0 - progress).toFixed(3);
        }

        if (progress >= 1.0) {
          if (currentSlideItem && currentSlideItem.element) {
            currentSlideItem.element.style.opacity = '1';
          }
          if (previousSlideItem) {
            destroyItem(previousSlideItem);
            previousSlideItem = null;
          }
          slideshowIsFading = false;
          slideshowTimer = 0;
        }
        return;
      }

      if (!currentSlideItem) {
        advanceSlideshowIfReady();
        return;
      }

      slideshowTimer += deltaTime;
      const holdSeconds = Math.max(0.25, Math.min(600, Number(SLIDESHOW_DURATION) || 0));
      if (slideshowTimer >= holdSeconds) {
        if (!advanceSlideshowIfReady()) {
          slideshowTimer = Math.max(0, holdSeconds - 0.25);
        }
      }
    }

    // =========================================================================
    // MODE 4: MASONRY LAYOUT (MONDRIAN BSP + ROWS JUSTIFIED LAYOUT +
    //         BACKGROUND PRE-RENDERING & PRE-ORGANIZATION OF NEXT MEDIA SWITCH)
    // =========================================================================

    function syncStageRowsModeClass() {
      if (!stage) return;
      if (DISPLAY_MODE === 'masonry' && MASONRY_LAYOUT === 'rows') {
        stage.classList.add('rows-mode');
      } else {
        stage.classList.remove('rows-mode');
      }
      if (DISPLAY_MODE === 'masonry' && MASONRY_EDGE_FILL === 'black') {
        stage.classList.add('mondrian-black-mode');
      } else {
        stage.classList.remove('mondrian-black-mode');
      }
    }

    function computeAmbientBackdropDataUrl(mediaEl) {
      if (!mediaEl || !ambientSampleCtx) return '';
      try {
        if (mediaEl.tagName === 'VIDEO' && mediaEl.readyState < 2) {
          return '';
        }
        ambientSampleCtx.clearRect(0, 0, 24, 24);
        ambientSampleCtx.drawImage(mediaEl, 0, 0, 24, 24);
        ambientSampleCtx.fillStyle = 'rgba(10, 10, 14, 0.44)';
        ambientSampleCtx.fillRect(0, 0, 24, 24);
        return ambientSampleCanvas.toDataURL('image/jpeg', 0.65);
      } catch (e) {
        return '';
      }
    }

    // Applies the pre-baked 24x24 color-matched ambient backdrop in Blur mode (both Mondrian & Rows),
    // or removes the blurred/ambient backdrop completely when Black mode is active.
    function applyTileAmbientBackdrop(flipInner, mediaEl, isVideo, precomputedUrl) {
      if (!flipInner) return;
      if (MASONRY_EDGE_FILL === 'black') {
        flipInner.style.backgroundImage = 'none';
        return;
      }
      if (precomputedUrl) {
        flipInner.style.backgroundImage = `url("${precomputedUrl}")`;
        return;
      }
      if (!mediaEl) return;
      const assignFromMedia = () => {
        if (MASONRY_EDGE_FILL === 'black') {
          flipInner.style.backgroundImage = 'none';
          return;
        }
        const url = computeAmbientBackdropDataUrl(mediaEl);
        if (url) {
          flipInner.style.backgroundImage = `url("${url}")`;
        }
      };
      if (isVideo && mediaEl.readyState < 2) {
        mediaEl.addEventListener('loadeddata', assignFromMedia, { once: true });
      } else {
        assignFromMedia();
      }
    }

    function refreshAllMasonryTileBackdrops() {
      syncStageRowsModeClass();
      for (let i = 0; i < masonryTileList.length; i++) {
        const t = masonryTileList[i];
        if (!t.flipInner) continue;
        if (MASONRY_EDGE_FILL === 'black') {
          t.flipInner.style.backgroundImage = 'none';
        } else {
          if (!t.ambientBgUrl && t.mediaElement) {
            t.ambientBgUrl = computeAmbientBackdropDataUrl(t.mediaElement);
          }
          applyTileAmbientBackdrop(t.flipInner, t.mediaElement, t.isVideo, t.ambientBgUrl);
        }
      }
    }

    function switchMasonryEdgeFill(rawNewFill) {
      const newFill = normalizeMasonryEdgeFill(rawNewFill);
      if (MASONRY_EDGE_FILL === newFill) {
        syncStageRowsModeClass();
        return;
      }
      MASONRY_EDGE_FILL = newFill;
      refreshAllMasonryTileBackdrops();
    }

    function clampTileAspect(aspect) {
      return Math.max(0.28, Math.min(3.6, Number(aspect) || 1.0));
    }

    function clampRowTileAspect(aspect) {
      return Math.max(0.20, Math.min(4.5, Number(aspect) || 1.0));
    }

    function estimateRowsFromTiles(tileCount) {
      const t = Math.max(4, Math.min(36, Math.round(Number(tileCount) || 12)));
      return Math.max(2, Math.min(12, Math.round(Math.sqrt(t * 0.68))));
    }

    // Dynamic ±25% Target Tile Count window (clamped to [4, 36])
    function getTargetTileCountBounds(target = MASONRY_TILES) {
      const base = Math.max(4, Math.min(36, Math.round(Number(target) || 12)));
      const delta = Math.max(1, Math.round(base * 0.25));
      const minCount = Math.max(4, base - delta);
      const maxCount = Math.min(36, base + delta);
      return { target: base, minCount, maxCount, delta };
    }

    // Evaluates how cleanly a set of tile aspect ratios partitions into variable-height horizontal rows
    // on (sw, sh) without cropping. Allows each row r to adopt its natural uncropped height H_r = W_r / S_r
    // and optimizes row counts + tile groupings so sum(H_r) matches availScreenH (normScale ~ 1.0),
    // eliminating both inter-row letterboxing gaps and intra-row pillarboxing gaps.
    // Bounded LRU caches for Rows DP and Mondrian BSP solvers to eliminate redundant calculations
    const ROWS_SOLVER_CACHE = new Map();
    const MAX_ROWS_SOLVER_CACHE = 128;
    const MONDRIAN_SUBTREE_CACHE = new Map();
    const MAX_MONDRIAN_SUBTREE_CACHE = 256;

    // Verifies that an index array is a strict 1-to-1 bijection of 0..n-1 with no duplicate or missing indices
    function isValidIndexPermutation(indices, n) {
      if (!Array.isArray(indices) || indices.length !== n) return false;
      const seen = new Uint8Array(n);
      for (let i = 0; i < n; i++) {
        const idx = indices[i];
        if (typeof idx !== 'number' || idx < 0 || idx >= n || seen[idx] !== 0) {
          return false;
        }
        seen[idx] = 1;
      }
      return true;
    }

    // Evaluates how cleanly a set of tile aspect ratios partitions into variable-height horizontal rows
    // on (sw, sh) without cropping. Uses O(1) incremental two-row delta math during swap/move refinement
    // and bounded memoization to run in sub-millisecond time with zero inner-loop array allocations.
    function solveOptimalRowsPartitionForAspects(aspects, sw, sh, gap, targetTileCount, allowReorder = true) {
      const n = aspects.length;
      if (n === 0) {
        return { rowCounts: [1], numRows: 1, score: Infinity, orderedIndices: [0] };
      }

      const clamped = new Float64Array(n);
      const qParts = new Array(n);
      for (let i = 0; i < n; i++) {
        const c = clampRowTileAspect(aspects[i]);
        clamped[i] = c;
        qParts[i] = Math.round(c * 200);
      }

      const cacheKey = `${Math.round(sw)}x${Math.round(sh)}|${gap}|${targetTileCount}|${allowReorder ? 1 : 0}|${qParts.join(',')}`;
      const cached = ROWS_SOLVER_CACHE.get(cacheKey);
      if (cached && isValidIndexPermutation(cached.orderedIndices, n)) {
        ROWS_SOLVER_CACHE.delete(cacheKey);
        ROWS_SOLVER_CACHE.set(cacheKey, cached);
        return {
          rowCounts: cached.rowCounts.slice(),
          numRows: cached.numRows,
          score: cached.score,
          scaleErr: cached.scaleErr,
          orderedIndices: cached.orderedIndices.slice()
        };
      }

      const identityOrder = Array.from({ length: n }, (_, i) => i);
      const candidateOrders = [identityOrder];
      if (allowReorder && n >= 3) {
        const seenOrderSigs = new Set([qParts.join(',')]);
        const tryPushOrder = (ord) => {
          const sig = ord.map(idx => qParts[idx]).join(',');
          if (!seenOrderSigs.has(sig)) {
            seenOrderSigs.add(sig);
            candidateOrders.push(ord);
          }
        };
        const asc = identityOrder.slice().sort((a, b) => clamped[a] - clamped[b]);
        const desc = asc.slice().reverse();
        const alt = [];
        let lo = 0;
        let hi = n - 1;
        while (lo <= hi) {
          alt.push(asc[lo++]);
          if (lo <= hi) alt.push(asc[hi--]);
        }
        tryPushOrder(asc);
        tryPushOrder(desc);
        tryPushOrder(alt);
      }

      const baseRows = estimateRowsFromTiles(targetTileCount);
      const estRowsFromN = estimateRowsFromTiles(n);
      const centerRows = Math.round((baseRows + estRowsFromN) * 0.5);
      const minR = Math.max(1, Math.min(n, Math.max(1, centerRows - 2)));
      const maxR = Math.max(minR, Math.min(n, Math.min(12, centerRows + 3)));

      const minNaturalRowH = Math.max(42, sh * 0.10);
      const maxNaturalRowH = Math.max(120, sh * 0.74);

      const evalRowHeightAndPen = (sumA, len) => {
        const safeA = Math.max(0.2, sumA);
        const rw = Math.max(64, sw - gap * Math.max(0, len - 1));
        const nh = rw / safeA;
        let pen = 0;
        if (nh < minNaturalRowH) {
          const rt = minNaturalRowH / Math.max(8, nh);
          pen = (rt - 1) * (rt - 1) * 0.35;
        } else if (nh > maxNaturalRowH) {
          const rt = nh / maxNaturalRowH;
          pen = (rt - 1) * (rt - 1) * 0.35;
        }
        return { nh, pen };
      };

      const prefix = new Float64Array(n + 1);
      let bestResult = null;
      let bestScore = Infinity;

      for (let rCount = minR; rCount <= maxR; rCount++) {
        const totalRowGaps = gap * Math.max(0, rCount - 1);
        const availScreenH = Math.max(rCount * 24, sh - totalRowGaps);
        const rowCountDiffPenalty = Math.abs(rCount - centerRows) * 0.006;
        if (rowCountDiffPenalty >= bestScore) continue;

        for (let oIdx = 0; oIdx < candidateOrders.length; oIdx++) {
          const order = candidateOrders[oIdx];
          prefix[0] = 0;
          for (let i = 0; i < n; i++) {
            prefix[i + 1] = prefix[i] + clamped[order[i]];
          }

          const dpStates = Array.from({ length: rCount + 1 }, () =>
            Array.from({ length: n + 1 }, () => [])
          );
          dpStates[0][0].push({ sumH: 0, penalty: 0, prevI: -1, prevStateIdx: -1 });

          for (let r = 1; r <= rCount; r++) {
            const targetCumH = (r / rCount) * availScreenH;
            const maxI = n - (rCount - r);
            for (let i = r; i <= maxI; i++) {
              const candidates = [];
              for (let p = r - 1; p < i; p++) {
                const prevList = dpStates[r - 1][p];
                if (prevList.length === 0) continue;
                const { nh: naturalH, pen: boundPen } = evalRowHeightAndPen(prefix[i] - prefix[p], i - p);

                for (let sIdx = 0; sIdx < prevList.length; sIdx++) {
                  const st = prevList[sIdx];
                  const newSumH = st.sumH + naturalH;
                  const newPen = st.penalty + boundPen;
                  candidates.push({
                    sumH: newSumH,
                    penalty: newPen,
                    prevI: p,
                    prevStateIdx: sIdx,
                    distToTarget: Math.abs(newSumH - targetCumH) + newPen * availScreenH
                  });
                }
              }

              if (candidates.length > 0) {
                candidates.sort((a, b) => a.distToTarget - b.distToTarget);
                const kept = [];
                const minSep = availScreenH * 0.015;
                for (let c = 0; c < candidates.length && kept.length < 5; c++) {
                  const cand = candidates[c];
                  let tooClose = false;
                  for (let k = 0; k < kept.length; k++) {
                    if (Math.abs(kept[k].sumH - cand.sumH) < minSep) {
                      tooClose = true;
                      break;
                    }
                  }
                  if (!tooClose || kept.length < 2) {
                    kept.push(cand);
                  }
                }
                dpStates[r][i] = kept;
              }
            }
          }

          const finalList = dpStates[rCount][n];
          if (!finalList || finalList.length === 0) continue;

          for (let fIdx = 0; fIdx < finalList.length; fIdx++) {
            const counts = new Int32Array(rCount);
            let curI = n;
            let curS = fIdx;
            for (let r = rCount; r >= 1; r--) {
              const st = dpStates[r][curI][curS];
              counts[r - 1] = curI - st.prevI;
              curI = st.prevI;
              curS = st.prevStateIdx;
            }

            // Build mutable row buckets and per-row O(1) state vectors
            const buckets = new Array(rCount);
            const rowSumA = new Float64Array(rCount);
            const rowNatH = new Float64Array(rCount);
            const rowPen = new Float64Array(rCount);
            let totalH = 0;
            let totalPen = 0;
            let cursor = 0;
            for (let r = 0; r < rCount; r++) {
              const c = counts[r];
              const b = order.slice(cursor, cursor + c);
              cursor += c;
              buckets[r] = b;
              let sA = 0;
              for (let j = 0; j < c; j++) sA += clamped[b[j]];
              rowSumA[r] = sA;
              const { nh, pen } = evalRowHeightAndPen(sA, c);
              rowNatH[r] = nh;
              rowPen[r] = pen;
              totalH += nh;
              totalPen += pen;
            }

            let curScaleErr = Math.abs(Math.log(Math.max(24, totalH) / availScreenH));
            let curCost = curScaleErr * 2.2 + totalPen / rCount;

            // Fast O(1) incremental swap & move refinement (evaluates only the 2 modified rows per test)
            if (allowReorder && rCount >= 2 && curScaleErr > 0.004) {
              for (let pass = 0; pass < 4; pass++) {
                let improved = false;
                // 1. Pairwise tile swap between row r1 and row r2 in O(1) per pair
                for (let r1 = 0; r1 < rCount; r1++) {
                  const b1 = buckets[r1];
                  const len1 = b1.length;
                  for (let r2 = r1 + 1; r2 < rCount; r2++) {
                    const b2 = buckets[r2];
                    const len2 = b2.length;
                    for (let i1 = 0; i1 < len1; i1++) {
                      let u = b1[i1];
                      let aU = clamped[u];
                      for (let i2 = 0; i2 < len2; i2++) {
                        const v = b2[i2];
                        const aV = clamped[v];
                        const deltaA = aV - aU;
                        if (Math.abs(deltaA) < 1e-4) continue;
                        const newSA1 = rowSumA[r1] + deltaA;
                        const newSA2 = rowSumA[r2] - deltaA;
                        const ev1 = evalRowHeightAndPen(newSA1, len1);
                        const ev2 = evalRowHeightAndPen(newSA2, len2);
                        const candTotalH = totalH - rowNatH[r1] - rowNatH[r2] + ev1.nh + ev2.nh;
                        const candTotalPen = totalPen - rowPen[r1] - rowPen[r2] + ev1.pen + ev2.pen;
                        const candScaleErr = Math.abs(Math.log(Math.max(24, candTotalH) / availScreenH));
                        const candCost = candScaleErr * 2.2 + candTotalPen / rCount;
                        if (candCost + 0.0005 < curCost) {
                          b1[i1] = v;
                          b2[i2] = u;
                          // CRITICAL: Update u and aU to the newly swapped tile v at b1[i1] so subsequent
                          // i2 iterations never duplicate the old u or overwrite v in b1[i1]
                          u = v;
                          aU = aV;
                          rowSumA[r1] = newSA1;
                          rowSumA[r2] = newSA2;
                          rowNatH[r1] = ev1.nh;
                          rowNatH[r2] = ev2.nh;
                          rowPen[r1] = ev1.pen;
                          rowPen[r2] = ev2.pen;
                          totalH = candTotalH;
                          totalPen = candTotalPen;
                          curScaleErr = candScaleErr;
                          curCost = candCost;
                          improved = true;
                        }
                      }
                    }
                  }
                }
                // 2. Single-tile move from row r1 (len > 1) to row r2 in O(1) per candidate
                for (let r1 = 0; r1 < rCount; r1++) {
                  const b1 = buckets[r1];
                  if (b1.length <= 1) continue;
                  for (let i1 = 0; i1 < b1.length; i1++) {
                    const moved = b1[i1];
                    const aM = clamped[moved];
                    const newSA1 = rowSumA[r1] - aM;
                    const ev1 = evalRowHeightAndPen(newSA1, b1.length - 1);
                    let bestTargetR = -1;
                    let bestEv2 = null;
                    let bestCandH = totalH;
                    let bestCandPen = totalPen;
                    let bestCandErr = curScaleErr;
                    for (let r2 = 0; r2 < rCount; r2++) {
                      if (r2 === r1) continue;
                      const newSA2 = rowSumA[r2] + aM;
                      const ev2 = evalRowHeightAndPen(newSA2, buckets[r2].length + 1);
                      const candTotalH = totalH - rowNatH[r1] - rowNatH[r2] + ev1.nh + ev2.nh;
                      const candTotalPen = totalPen - rowPen[r1] - rowPen[r2] + ev1.pen + ev2.pen;
                      const candScaleErr = Math.abs(Math.log(Math.max(24, candTotalH) / availScreenH));
                      const candCost = candScaleErr * 2.2 + candTotalPen / rCount;
                      if (candCost + 0.0005 < curCost) {
                        curCost = candCost;
                        bestCandH = candTotalH;
                        bestCandPen = candTotalPen;
                        bestCandErr = candScaleErr;
                        bestTargetR = r2;
                        bestEv2 = ev2;
                      }
                    }
                    if (bestTargetR >= 0 && bestEv2) {
                      b1.splice(i1, 1);
                      buckets[bestTargetR].push(moved);
                      rowSumA[r1] = newSA1;
                      rowNatH[r1] = ev1.nh;
                      rowPen[r1] = ev1.pen;
                      rowSumA[bestTargetR] += aM;
                      rowNatH[bestTargetR] = bestEv2.nh;
                      rowPen[bestTargetR] = bestEv2.pen;
                      totalH = bestCandH;
                      totalPen = bestCandPen;
                      curScaleErr = bestCandErr;
                      improved = true;
                      break;
                    }
                  }
                }
                if (!improved || curScaleErr <= 0.004) break;
              }
            }

            const refinedCounts = new Array(rCount);
            const refinedIndices = new Array(n);
            let outIdx = 0;
            let isIdentity = (oIdx === 0);
            for (let r = 0; r < rCount; r++) {
              const b = buckets[r];
              refinedCounts[r] = b.length;
              for (let j = 0; j < b.length; j++) {
                const v = b[j];
                if (v !== outIdx) isIdentity = false;
                refinedIndices[outIdx++] = v;
              }
            }
            if (outIdx !== n || !isValidIndexPermutation(refinedIndices, n)) {
              continue;
            }
            const reorderPenalty = isIdentity ? 0 : 0.003;
            const totalScore = curCost + reorderPenalty + rowCountDiffPenalty;

            if (totalScore < bestScore) {
              bestScore = totalScore;
              bestResult = {
                rowCounts: refinedCounts,
                numRows: rCount,
                score: totalScore,
                scaleErr: curScaleErr,
                orderedIndices: refinedIndices
              };
            }
          }
        }
      }

      if (!bestResult || !isValidIndexPermutation(bestResult.orderedIndices, n)) {
        bestResult = { rowCounts: [n], numRows: 1, score: 1.0, scaleErr: 0, orderedIndices: identityOrder };
      }

      ROWS_SOLVER_CACHE.set(cacheKey, bestResult);
      if (ROWS_SOLVER_CACHE.size > MAX_ROWS_SOLVER_CACHE) {
        const oldestKey = ROWS_SOLVER_CACHE.keys().next().value;
        ROWS_SOLVER_CACHE.delete(oldestKey);
      }

      return {
        rowCounts: bestResult.rowCounts.slice(),
        numRows: bestResult.numRows,
        score: bestResult.score,
        scaleErr: bestResult.scaleErr,
        orderedIndices: bestResult.orderedIndices.slice()
      };
    }

    // Evaluates Mondrian layout distortion for an array of k aspect ratios on (sw, sh)
    function evaluateMondrianCandidateCountDistortion(subAspects, sw, sh, gap) {
      const k = subAspects.length;
      if (k === 0) return Infinity;
      const targetGroupSize = k <= 6 ? 3 : 4;
      const numGroups = Math.max(1, Math.round(k / targetGroupSize));
      const groupProxies = new Array(numGroups);
      let idx = 0;
      const approxGroupW = Math.max(64, Math.round(sw / Math.sqrt(numGroups)));
      const approxGroupH = Math.max(64, Math.round(sh / Math.sqrt(numGroups)));
      for (let g = 0; g < numGroups; g++) {
        const remTiles = k - idx;
        const remGroups = numGroups - g;
        const c = Math.max(1, Math.round(remTiles / remGroups));
        const slice = new Array(c);
        for (let sIdx = 0; sIdx < c; sIdx++) {
          slice[sIdx] = {
            id: idx + sIdx + 1,
            aspect: clampTileAspect(subAspects[idx + sIdx]),
            sizeJitter: 1.0
          };
        }
        idx += c;
        const subRoot = solveAspectLockedSubtree(slice, approxGroupW, approxGroupH, gap, null, true);
        groupProxies[g] = {
          id: g + 1,
          proxies: subRoot && subRoot._orderedItems ? subRoot._orderedItems : slice,
          winMask: subRoot ? subRoot._winMask : null,
          winTopology: subRoot ? subRoot._winTopology : 'balanced',
          aspect: subRoot ? subRoot.effAspect : 1.33,
          sizeJitter: 1.0
        };
      }
      const topRoot = solveAspectLockedSubtree(groupProxies, sw, sh, gap, null, true);
      let maxLeafErr = 0;
      applySubtreeGeometry(topRoot, 0, 0, sw, sh, gap, (grp, gx, gy, gw, gh) => {
        const gSub = buildSubtreeWithFixedMaskAndTopology(grp.proxies, grp.winTopology, grp.winMask);
        applySubtreeGeometry(gSub, gx, gy, gw, gh, gap, (proxy, tx, ty, tw, th) => {
          const boxA = Math.max(8, tw) / Math.max(8, th);
          const err = Math.abs(Math.log(boxA / clampTileAspect(proxy.aspect)));
          if (err > maxLeafErr) maxLeafErr = err;
        });
      });
      return maxLeafErr;
    }

    // Computes the optimal active tile count within the ±25% Target Tile Count window [minCount, maxCount]
    // for both Mondrian and Rows modes to minimize edge blur / slack space without cropping
    function getDesiredMasonryTileCount(allowSteadyStateChange = false) {
      const { target, minCount, maxCount } = getTargetTileCountBounds(MASONRY_TILES);
      // Once the Masonry grid is populated within [minCount, maxCount] in steady state,
      // keep the active tile count stable so background preloads never trigger mid-flip layout rebuilds
      if (
        !allowSteadyStateChange &&
        masonryLoadPhase === 'done' &&
        masonryTileList.length >= minCount &&
        masonryTileList.length <= maxCount
      ) {
        return masonryTileList.length;
      }

      const sw = Math.max(320, window.innerWidth || 1920);
      const sh = Math.max(240, window.innerHeight || 1080);
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));

      const availableTotal = masonryTileList.length + readyImageQueue.length;
      if (availableTotal < minCount) {
        return target;
      }

      const maxCandidate = Math.min(maxCount, availableTotal);
      const combinedAspects = [];
      for (let i = 0; i < masonryTileList.length && combinedAspects.length < maxCandidate; i++) {
        combinedAspects.push(masonryTileList[i].rawAspect || masonryTileList[i].aspect || 1.33);
      }
      for (let i = 0; i < readyImageQueue.length && combinedAspects.length < maxCandidate; i++) {
        combinedAspects.push(readyImageQueue[i].aspect || 1.33);
      }

      if (combinedAspects.length < minCount) {
        return target;
      }

      if (MASONRY_LAYOUT === 'rows') {
        let bestCount = Math.min(maxCandidate, Math.max(minCount, target));
        let bestRowScore = Infinity;
        for (let k = minCount; k <= maxCandidate; k++) {
          const subAspects = combinedAspects.slice(0, k);
          const solved = solveOptimalRowsPartitionForAspects(subAspects, sw, sh, gap, target);
          const distPenalty = Math.abs(k - target) * 0.012;
          const keepCurrentBonus = (k === masonryTileList.length) ? -0.018 : 0;
          const score = solved.score + distPenalty + keepCurrentBonus;
          if (score < bestRowScore) {
            bestRowScore = score;
            bestCount = k;
          }
        }
        return bestCount;
      }

      // Mondrian mode: evaluate candidate counts k in [minCount, maxCandidate]
      // and pick the count whose group partition yields the lowest leaf aspect distortion
      let bestCount = Math.min(maxCandidate, Math.max(minCount, masonryTileList.length || target));
      let bestMondrianScore = Infinity;

      for (let k = minCount; k <= maxCandidate; k++) {
        const subAspects = combinedAspects.slice(0, k).map(a => clampTileAspect(a));
        const maxLeafErr = evaluateMondrianCandidateCountDistortion(subAspects, sw, sh, gap);
        const distPenalty = Math.abs(k - target) * 0.010;
        const keepCurrentBonus = (k === masonryTileList.length) ? -0.014 : 0;
        const score = maxLeafErr + distPenalty + keepCurrentBonus;
        if (score < bestMondrianScore) {
          bestMondrianScore = score;
          bestCount = k;
        }
      }
      return bestCount;
    }

    // Selects and removes the item from readyImageQueue whose aspect ratio is closest to targetAspect
    function pullBestAspectMatchFromReadyQueue(targetAspect) {
      if (readyImageQueue.length === 0) return null;
      if (!Number.isFinite(targetAspect) || targetAspect <= 0 || readyImageQueue.length === 1) {
        return readyImageQueue.shift();
      }
      let bestIdx = 0;
      let bestDiff = Infinity;
      for (let i = 0; i < readyImageQueue.length; i++) {
        const a = clampRowTileAspect(readyImageQueue[i].aspect);
        const diff = Math.abs(a - targetAspect);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestIdx = i;
        }
      }
      const [chosen] = readyImageQueue.splice(bestIdx, 1);
      return chosen;
    }

    // Builds a binary tree skeleton over an array of leaf items (tiles or groups)
    // topologyMode: 'balanced' ((2+2) for 4 items) or 'caterpillar' ((1+3) for 4 items)
    // Note: internalList is populated in strict bottom-up post-order (children always precede parents).
    function buildBinarySubtreeNodes(items, internalList, topologyMode = 'balanced', start = 0, end = items.length) {
      const len = end - start;
      if (len <= 1) {
        const leafItem = items[start];
        const clampedA = Math.max(0.22, Math.min(4.2, clampTileAspect(leafItem.aspect)));
        return {
          isLeaf: true,
          item: leafItem,
          effAspect: clampedA,
          splitVertically: true,
          ratio: 0.5
        };
      }
      const splitOffset = (topologyMode === 'caterpillar' && len >= 3)
        ? 1
        : (len >> 1);
      const mid = start + splitOffset;
      const left = buildBinarySubtreeNodes(items, internalList, topologyMode, start, mid);
      const right = buildBinarySubtreeNodes(items, internalList, topologyMode, mid, end);
      const node = {
        isLeaf: false,
        left,
        right,
        effAspect: 1.0,
        splitVertically: true,
        ratio: 0.5
      };
      if (internalList) internalList.push(node);
      return node;
    }

    // Fast non-recursive bottom-up aspect propagation using the post-ordered internal node list
    function propagateAspectPostOrder(internals, root) {
      const len = internals.length;
      for (let i = 0; i < len; i++) {
        const nd = internals[i];
        const aL = nd.left.effAspect;
        const aR = nd.right.effAspect;
        if (nd.splitVertically) {
          const sumA = aL + aR > 0.1 ? aL + aR : 0.1;
          nd.effAspect = sumA;
          const r = aL / sumA;
          nd.ratio = r < 0.06 ? 0.06 : (r > 0.94 ? 0.94 : r);
        } else {
          const invL = 1.0 / (aL > 0.1 ? aL : 0.1);
          const invR = 1.0 / (aR > 0.1 ? aR : 0.1);
          const invSum = invL + invR > 0.05 ? invL + invR : 0.05;
          nd.effAspect = 1.0 / invSum;
          const r = invL / invSum;
          nd.ratio = r < 0.06 ? 0.06 : (r > 0.94 ? 0.94 : r);
        }
      }
      return root.effAspect;
    }

    // Deterministically constructs a binary subtree over `items` locked to an exact topology and split bitmask.
    // Used when applying precomputed reflow plans so the live subtreeRoot is 100% identical to the planned geometry.
    function buildSubtreeWithFixedMaskAndTopology(items, winTopology = 'balanced', winMask = 0) {
      if (!items || items.length === 0) return null;
      if (items.length === 1) {
        const single = buildBinarySubtreeNodes(items, null, 'balanced');
        single._winMask = 0;
        single._winTopology = 'balanced';
        single._orderedItems = items.slice();
        return single;
      }
      const internals = [];
      const topo = (winTopology === 'caterpillar' && items.length >= 4) ? 'caterpillar' : 'balanced';
      const root = buildBinarySubtreeNodes(items, internals, topo);
      const mask = typeof winMask === 'number' ? winMask : 0;
      for (let b = 0; b < internals.length; b++) {
        internals[b].splitVertically = Boolean((mask >> b) & 1);
      }
      propagateAspectPostOrder(internals, root);
      root._winMask = mask;
      root._winTopology = topo;
      root._internals = internals;
      root._orderedItems = items.slice();
      return root;
    }

    // Bottom-up exact aspect ratio propagation fallback for arbitrary trees
    function propagateAspectBottomUp(node) {
      if (!node) return 1.0;
      if (node.isLeaf) {
        const baseA = clampTileAspect(node.item.aspect);
        node.effAspect = Math.max(0.22, Math.min(4.2, baseA));
        return node.effAspect;
      }
      const aL = propagateAspectBottomUp(node.left);
      const aR = propagateAspectBottomUp(node.right);
      if (node.splitVertically) {
        const sumA = Math.max(0.1, aL + aR);
        node.effAspect = sumA;
        node.ratio = Math.max(0.06, Math.min(0.94, aL / sumA));
      } else {
        const invL = 1.0 / Math.max(0.1, aL);
        const invR = 1.0 / Math.max(0.1, aR);
        const invSum = Math.max(0.05, invL + invR);
        node.effAspect = 1.0 / invSum;
        node.ratio = Math.max(0.06, Math.min(0.94, invL / invSum));
      }
      return node.effAspect;
    }

    // Evaluates total log-aspect distortion of leaves if laid out inside (w, h),
    // with branch-and-bound early pruning when partial error already exceeds cutoff.
    function evaluateSubtreeDistortion(node, w, h, gap, cutoff = Infinity) {
      if (!node) return 0;
      if (node.isLeaf) {
        const safeW = w > 8 ? w : 8;
        const safeH = h > 8 ? h : 8;
        const boxAspect = safeW / safeH;
        const mediaAspect = node.effAspect || clampTileAspect(node.item.aspect);
        const logDiff = Math.abs(Math.log(boxAspect / mediaAspect));
        const minDimPenalty = (safeW < 56 || safeH < 56) ? 1.5 : 0;
        return logDiff + minDimPenalty;
      }
      if (node.splitVertically) {
        const availW = w - gap > 16 ? w - gap : 16;
        const leftW = availW * node.ratio;
        const leftErr = evaluateSubtreeDistortion(node.left, leftW, h, gap, cutoff);
        if (leftErr >= cutoff) return leftErr;
        return leftErr + evaluateSubtreeDistortion(node.right, availW - leftW, h, gap, cutoff - leftErr);
      } else {
        const availH = h - gap > 16 ? h - gap : 16;
        const topH = availH * node.ratio;
        const topErr = evaluateSubtreeDistortion(node.left, w, topH, gap, cutoff);
        if (topErr >= cutoff) return topErr;
        return topErr + evaluateSubtreeDistortion(node.right, w, availH - topH, gap, cutoff - topErr);
      }
    }

    // Generates distinct leaf order index permutations for small groups (<= 4 items),
    // deduplicating permutations that have identical quantized aspect sequences.
    const _PERM_INDICES_3 = [
      [0, 1, 2], [0, 2, 1], [1, 0, 2],
      [1, 2, 0], [2, 0, 1], [2, 1, 0]
    ];
    const _PERM_INDICES_4 = [
      [0, 1, 2, 3], [0, 2, 1, 3], [0, 3, 1, 2],
      [1, 2, 0, 3], [1, 3, 0, 2], [2, 3, 0, 1],
      [1, 0, 2, 3], [2, 0, 1, 3], [3, 0, 1, 2],
      [3, 2, 1, 0]
    ];

    function generateCandidateLeafOrders(items, allowReorder) {
      const n = items.length;
      if (!allowReorder || n <= 1) {
        return [items.slice()];
      }
      const qAspects = new Int32Array(n);
      for (let i = 0; i < n; i++) {
        qAspects[i] = Math.round(clampTileAspect(items[i].aspect) * 100);
      }
      const seenSigs = new Set();
      const orders = [];
      const addIfUnique = (arr, sig) => {
        if (!seenSigs.has(sig)) {
          seenSigs.add(sig);
          orders.push(arr);
        }
      };

      if (n === 2) {
        addIfUnique([items[0], items[1]], `${qAspects[0]},${qAspects[1]}`);
        addIfUnique([items[1], items[0]], `${qAspects[1]},${qAspects[0]}`);
        return orders;
      }
      if (n === 3) {
        for (let p = 0; p < _PERM_INDICES_3.length; p++) {
          const idx = _PERM_INDICES_3[p];
          addIfUnique(
            [items[idx[0]], items[idx[1]], items[idx[2]]],
            `${qAspects[idx[0]]},${qAspects[idx[1]]},${qAspects[idx[2]]}`
          );
        }
        return orders;
      }
      if (n === 4) {
        for (let p = 0; p < _PERM_INDICES_4.length; p++) {
          const idx = _PERM_INDICES_4[p];
          addIfUnique(
            [items[idx[0]], items[idx[1]], items[idx[2]], items[idx[3]]],
            `${qAspects[idx[0]]},${qAspects[idx[1]]},${qAspects[idx[2]]},${qAspects[idx[3]]}`
          );
        }
        const asc = items.slice().sort((a, b) => a.aspect - b.aspect);
        addIfUnique(asc, asc.map(it => Math.round(clampTileAspect(it.aspect) * 100)).join(','));
        const desc = asc.slice().reverse();
        addIfUnique(desc, desc.map(it => Math.round(clampTileAspect(it.aspect) * 100)).join(','));
        return orders;
      }
      addIfUnique(items.slice(), Array.from(qAspects).join(','));
      const asc = items.slice().sort((a, b) => a.aspect - b.aspect);
      addIfUnique(asc, asc.map(it => Math.round(clampTileAspect(it.aspect) * 100)).join(','));
      const desc = asc.slice().reverse();
      addIfUnique(desc, desc.map(it => Math.round(clampTileAspect(it.aspect) * 100)).join(','));
      const rev = items.slice().reverse();
      addIfUnique(rev, rev.map(it => Math.round(clampTileAspect(it.aspect) * 100)).join(','));
      return orders;
    }

    function solveAspectLockedSubtree(items, boxW, boxH, gap, prevMask = null, allowReorder = true) {
      if (!items || items.length === 0) return null;
      const n = items.length;
      if (n === 1) {
        const single = buildBinarySubtreeNodes(items, null, 'balanced');
        single._winMask = 0;
        single._winTopology = 'balanced';
        single._orderedItems = items.slice();
        single._leafError = evaluateSubtreeDistortion(single, boxW, boxH, gap);
        return single;
      }

      // Check bounded memoization cache for subtrees up to 10 leaves/groups
      let cacheKey = null;
      if (n <= 10) {
        const qParts = new Array(n);
        for (let i = 0; i < n; i++) {
          qParts[i] = Math.round(clampTileAspect(items[i].aspect) * 250);
        }
        const pmKey = typeof prevMask === 'number' ? prevMask : -1;
        cacheKey = `${Math.round(boxW)}x${Math.round(boxH)}|${gap}|${pmKey}|${allowReorder ? 1 : 0}|${qParts.join(',')}`;
        const cached = MONDRIAN_SUBTREE_CACHE.get(cacheKey);
        if (cached && isValidIndexPermutation(cached.orderIndices, n)) {
          MONDRIAN_SUBTREE_CACHE.delete(cacheKey);
          MONDRIAN_SUBTREE_CACHE.set(cacheKey, cached);
          const orderedItems = cached.orderIndices.map(idx => items[idx]);
          const internals = [];
          const root = buildBinarySubtreeNodes(orderedItems, internals, cached.winTopology);
          const mask = cached.winMask;
          for (let b = 0; b < internals.length; b++) {
            internals[b].splitVertically = Boolean((mask >> b) & 1);
          }
          propagateAspectPostOrder(internals, root);
          root._winMask = mask;
          root._winTopology = cached.winTopology;
          root._internals = internals;
          root._orderedItems = orderedItems;
          root._leafError = cached.leafError;
          return root;
        }
      }

      const candidateOrders = generateCandidateLeafOrders(items, allowReorder);
      // For larger group trees (n >= 7), stick to balanced binary partitions so a single group
      // is never split against 6-9 groups in a degenerate caterpillar chain
      const topologies = (n >= 4 && n <= 6) ? ['balanced', 'caterpillar'] : ['balanced'];

      let bestRoot = null;
      let bestScore = Infinity;
      let bestMask = 0;
      let bestTopo = 'balanced';
      let bestOrder = candidateOrders[0];
      let bestInternals = null;
      let bestLeafError = 0;
      const targetBoxAspect = Math.max(0.2, boxW / Math.max(1, boxH));
      const hasPrevMask = typeof prevMask === 'number';

      for (let tIdx = 0; tIdx < topologies.length; tIdx++) {
        const topo = topologies[tIdx];
        const maxOrders = n >= 7 ? Math.min(2, candidateOrders.length) : candidateOrders.length;
        for (let o = 0; o < maxOrders; o++) {
          const order = candidateOrders[o];
          const reorderPenalty = (o === 0 && tIdx === 0) ? 0 : 0.008;
          if (reorderPenalty >= bestScore) continue;

          const internals = [];
          const root = buildBinarySubtreeNodes(order, internals, topo);
          const numInternals = internals.length;

          // Support exact bitmask optimization up to numInternals <= 9 (up to 10 groups / 36 tiles)
          if (numInternals <= 9) {
            const totalMasks = 1 << numInternals;
            for (let mask = 0; mask < totalMasks; mask++) {
              let flipDirectionChanges = 0;
              for (let b = 0; b < numInternals; b++) {
                const isVert = Boolean((mask >> b) & 1);
                internals[b].splitVertically = isVert;
                if (hasPrevMask && Boolean((prevMask >> b) & 1) !== isVert) {
                  flipDirectionChanges++;
                }
              }
              const stabilityPenalty = flipDirectionChanges * 0.015 + reorderPenalty;
              if (stabilityPenalty >= bestScore) continue;

              const rootAspect = propagateAspectPostOrder(internals, root);
              const rootMatchError = Math.abs(Math.log(rootAspect / targetBoxAspect)) * 0.55;
              const basePenalty = rootMatchError + stabilityPenalty;
              if (basePenalty >= bestScore) continue;

              const cutoff = bestScore - basePenalty;
              const leafError = evaluateSubtreeDistortion(root, boxW, boxH, gap, cutoff);
              const totalScore = leafError + basePenalty;
              if (totalScore < bestScore) {
                bestScore = totalScore;
                bestRoot = root;
                bestMask = mask;
                bestTopo = topo;
                bestOrder = order;
                bestInternals = internals;
                bestLeafError = leafError;
              }
            }
          } else {
            // Bottom-up balanced split fallback for >10 leaves
            let greedyMask = 0;
            for (let b = 0; b < numInternals; b++) {
              const nd = internals[b];
              const aL = nd.left.effAspect;
              const aR = nd.right.effAspect;
              // Try vertical vs horizontal split at this internal node and pick the one closer to targetBoxAspect
              const vertA = Math.max(0.1, aL + aR);
              const horizA = 1.0 / Math.max(0.05, (1.0 / Math.max(0.1, aL)) + (1.0 / Math.max(0.1, aR)));
              const isVert = Math.abs(Math.log(vertA / targetBoxAspect)) <= Math.abs(Math.log(horizA / targetBoxAspect));
              nd.splitVertically = isVert;
              if (isVert) {
                greedyMask |= (1 << b);
              }
              propagateAspectPostOrder([nd], nd);
            }
            const rootAspect = propagateAspectPostOrder(internals, root);
            const rootMatchError = Math.abs(Math.log(rootAspect / targetBoxAspect)) * 0.55;
            const leafError = evaluateSubtreeDistortion(root, boxW, boxH, gap);
            const totalScore = leafError + rootMatchError + reorderPenalty;
            if (totalScore < bestScore) {
              bestScore = totalScore;
              bestRoot = root;
              bestMask = greedyMask;
              bestTopo = topo;
              bestOrder = order;
              bestInternals = internals;
              bestLeafError = leafError;
            }
          }
        }
      }

      if (bestRoot && bestInternals) {
        for (let b = 0; b < bestInternals.length; b++) {
          bestInternals[b].splitVertically = Boolean((bestMask >> b) & 1);
        }
        propagateAspectPostOrder(bestInternals, bestRoot);
        bestRoot._winMask = bestMask;
        bestRoot._winTopology = bestTopo;
        bestRoot._internals = bestInternals;
        bestRoot._orderedItems = bestOrder;
        bestRoot._leafError = bestLeafError;

        if (cacheKey) {
          const usedIdx = new Set();
          const orderIndices = bestOrder.map(it => {
            for (let i = 0; i < items.length; i++) {
              if (items[i] === it && !usedIdx.has(i)) {
                usedIdx.add(i);
                return i;
              }
            }
            return -1;
          });
          if (isValidIndexPermutation(orderIndices, n)) {
            MONDRIAN_SUBTREE_CACHE.set(cacheKey, {
              orderIndices,
              winTopology: bestTopo,
              winMask: bestMask,
              leafError: bestLeafError
            });
            if (MONDRIAN_SUBTREE_CACHE.size > MAX_MONDRIAN_SUBTREE_CACHE) {
              const oldestKey = MONDRIAN_SUBTREE_CACHE.keys().next().value;
              MONDRIAN_SUBTREE_CACHE.delete(oldestKey);
            }
          }
        }
      }
      return bestRoot;
    }

    function applySubtreeGeometry(node, x, y, w, h, gap, onLeafRect) {
      if (!node) return;
      if (node.isLeaf) {
        const rx = Math.round(x);
        const ry = Math.round(y);
        const rw = Math.max(16, Math.round(w));
        const rh = Math.max(16, Math.round(h));
        onLeafRect(node.item, rx, ry, rw, rh);
        return;
      }
      if (node.splitVertically) {
        const availW = Math.max(0, w - gap);
        const leftW = Math.round(availW * node.ratio);
        const rightW = Math.max(0, availW - leftW);
        applySubtreeGeometry(node.left, x, y, leftW, h, gap, onLeafRect);
        applySubtreeGeometry(node.right, x + leftW + gap, y, rightW, h, gap, onLeafRect);
      } else {
        const availH = Math.max(0, h - gap);
        const topH = Math.round(availH * node.ratio);
        const bottomH = Math.max(0, availH - topH);
        applySubtreeGeometry(node.left, x, y, w, topH, gap, onLeafRect);
        applySubtreeGeometry(node.right, x, y + topH + gap, w, bottomH, gap, onLeafRect);
      }
    }

    function cancelTileReflowAnimation(tile) {
      if (!tile) return;
      if (tile.reflowAnim) {
        try { tile.reflowAnim.cancel(); } catch (e) {}
        tile.reflowAnim = null;
      }
      if (tile.element && typeof tile.element.getAnimations === 'function') {
        try {
          const anims = tile.element.getAnimations();
          for (let i = 0; i < anims.length; i++) {
            anims[i].cancel();
          }
        } catch (e) {}
      }
    }

    function cancelTileFlipAnimation(tile) {
      if (!tile) return;
      if (tile.flipAnim) {
        try { tile.flipAnim.cancel(); } catch (e) {}
        tile.flipAnim = null;
      }
      if (tile.flipInner && typeof tile.flipInner.getAnimations === 'function') {
        try {
          const anims = tile.flipInner.getAnimations();
          for (let i = 0; i < anims.length; i++) {
            anims[i].cancel();
          }
        } catch (e) {}
      }
    }

    function commitTileGeometryImmediate(tile, x, y, w, h) {
      cancelTileReflowAnimation(tile);
      tile.x = x;
      tile.y = y;
      tile.w = w;
      tile.h = h;
      tile.isReflowing = false;
      tile.flipReflowElapsed = 0;
      tile.reflowAccumSec = 0;
      if (tile.element) {
        tile.element.classList.remove('is-reflowing');
        tile.element.style.width = `${w}px`;
        tile.element.style.height = `${h}px`;
        tile.element.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      }
    }

    function applyTileTargetRectWithFlip(tile, nx, ny, nw, nh, oldRect, snapImmediately = false) {
      cancelTileReflowAnimation(tile);
      tile.x = nx;
      tile.y = ny;
      tile.w = nw;
      tile.h = nh;
      if (tile.element) {
        tile.element.style.width = `${nw}px`;
        tile.element.style.height = `${nh}px`;
      }

      if (!oldRect || snapImmediately) {
        tile.isReflowing = false;
        tile.flipReflowElapsed = 0;
        tile.reflowAccumSec = 0;
        if (tile.element) {
          tile.element.classList.remove('is-reflowing');
          tile.element.style.transform = `translate3d(${nx}px, ${ny}px, 0)`;
        }
        return;
      }

      const dx = oldRect.x - nx;
      const dy = oldRect.y - ny;
      const sx = oldRect.w / Math.max(1, nw);
      const sy = oldRect.h / Math.max(1, nh);

      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sx - 1) < 0.005 && Math.abs(sy - 1) < 0.005) {
        tile.isReflowing = false;
        tile.flipReflowElapsed = 0;
        tile.reflowAccumSec = 0;
        if (tile.element) {
          tile.element.classList.remove('is-reflowing');
          tile.element.style.transform = `translate3d(${nx}px, ${ny}px, 0)`;
        }
      } else {
        tile.flipFromX = dx;
        tile.flipFromY = dy;
        tile.flipFromSX = sx;
        tile.flipFromSY = sy;
        tile.flipReflowElapsed = 0;
        tile.reflowAccumSec = 0;
        tile.isReflowing = true;
        if (tile.element) {
          tile.element.classList.add('is-reflowing');
          const fromTransform = `translate3d(${oldRect.x.toFixed(1)}px, ${oldRect.y.toFixed(1)}px, 0) scale3d(${sx.toFixed(4)}, ${sy.toFixed(4)}, 1)`;
          const toTransform = `translate3d(${nx}px, ${ny}px, 0) scale3d(1, 1, 1)`;
          tile.element.style.transform = toTransform;
          if (typeof tile.element.animate === 'function') {
            try {
              const anim = tile.element.animate(
                [{ transform: fromTransform }, { transform: toTransform }],
                {
                  duration: Math.round(MASONRY_REFLOW_DURATION_SEC * 1000),
                  easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                  fill: 'none'
                }
              );
              tile.reflowAnim = anim;
              anim.onfinish = () => {
                if (tile.reflowAnim === anim) {
                  tile.reflowAnim = null;
                }
                tile.isReflowing = false;
                tile.flipReflowElapsed = 0;
                if (tile.element) {
                  tile.element.classList.remove('is-reflowing');
                  tile.element.style.transform = `translate3d(${tile.x}px, ${tile.y}px, 0)`;
                }
              };
              anim.oncancel = () => {
                if (tile.reflowAnim === anim) {
                  tile.reflowAnim = null;
                }
              };
            } catch (e) {
              tile.reflowAnim = null;
              tile.element.style.transform = fromTransform;
            }
          } else {
            tile.element.style.transform = fromTransform;
          }
        }
      }
    }

    function getTileCurrentVisualRect(tile) {
      if (!tile.isReflowing) {
        return { x: tile.x, y: tile.y, w: tile.w, h: tile.h };
      }
      const p = Math.min(1.0, tile.flipReflowElapsed / MASONRY_REFLOW_DURATION_SEC);
      const ease = 1 - Math.pow(1 - p, 3);
      const curX = tile.x + tile.flipFromX * (1 - ease);
      const curY = tile.y + tile.flipFromY * (1 - ease);
      const curSX = 1 + (tile.flipFromSX - 1) * (1 - ease);
      const curSY = 1 + (tile.flipFromSY - 1) * (1 - ease);
      return {
        x: curX,
        y: curY,
        w: tile.w * curSX,
        h: tile.h * curSY
      };
    }

    // -------------------------------------------------------------------------
    // ENGINE B: UNCROPPED DYNAMIC ROWS (VARIABLE ROW HEIGHTS & ZERO EXTRA GAPS)
    // -------------------------------------------------------------------------
    // Places each tile side-by-side at its exact uncropped width for the row's height,
    // distributing any remaining horizontal slack cleanly without cropping any media.
    function computeGooglePhotosRowRects(rowGroup) {
      const rectMap = new Map();
      if (!rowGroup || !rowGroup.tiles || rowGroup.tiles.length === 0) return rectMap;
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));
      const tiles = rowGroup.tiles;
      const n = tiles.length;
      const totalGapW = gap * Math.max(0, n - 1);
      const availW = Math.max(n * 16, rowGroup.w - totalGapW);
      const rh = Math.max(16, Math.round(rowGroup.h));

      let sumAspect = 0;
      const effAspects = [];
      for (let i = 0; i < n; i++) {
        const rawA = tiles[i].rawAspect !== undefined ? tiles[i].rawAspect : tiles[i].aspect;
        const a = clampRowTileAspect(rawA);
        effAspects.push(a);
        sumAspect += a;
      }
      sumAspect = Math.max(0.1, sumAspect);

      let curX = rowGroup.x;
      for (let i = 0; i < n; i++) {
        const isLast = (i === n - 1);
        const propW = availW * (effAspects[i] / sumAspect);
        const tw = isLast
          ? Math.max(16, (rowGroup.x + rowGroup.w) - curX)
          : Math.max(16, Math.round(propW));
        rectMap.set(tiles[i].id, {
          x: Math.round(curX),
          y: Math.round(rowGroup.y),
          w: tw,
          h: rh
        });
        curX += tw + gap;
      }
      return rectMap;
    }

    function layoutGooglePhotosRowTiles(rowGroup, prevRectsMap = null, flippedTileId = null) {
      if (!rowGroup || !rowGroup.tiles || rowGroup.tiles.length === 0) return;
      const rectMap = computeGooglePhotosRowRects(rowGroup);
      for (let i = 0; i < rowGroup.tiles.length; i++) {
        const tile = rowGroup.tiles[i];
        const target = rectMap.get(tile.id);
        if (!target) continue;
        if (prevRectsMap) {
          const old = prevRectsMap.get(tile.id);
          applyTileTargetRectWithFlip(tile, target.x, target.y, target.w, target.h, old, tile.id === flippedTileId);
        } else {
          commitTileGeometryImmediate(tile, target.x, target.y, target.w, target.h);
        }
      }
    }

    function buildGooglePhotosJustifiedLayout(prevRectsMap = null) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      if (sw <= 0 || sh <= 0 || masonryTileList.length === 0) return;
      const gap = Math.max(0, Math.min(10, Number(MASONRY_GAP) || 0));

      const aspects = masonryTileList.map(t => clampRowTileAspect(t.rawAspect || t.aspect));
      const solved = solveOptimalRowsPartitionForAspects(aspects, sw, sh, gap, MASONRY_TILES, true);
      const rowCounts = solved.rowCounts;
      const numRows = solved.numRows;
      const orderedTiles = isValidIndexPermutation(solved.orderedIndices, masonryTileList.length)
        ? solved.orderedIndices.map(idx => masonryTileList[idx])
        : masonryTileList.slice();
      masonryTileList = orderedTiles;

      masonryGroups = [];
      masonryTreeRoot = null;

      const rowBuckets = [];
      const rowAspectSums = [];
      let cursor = 0;
      for (let r = 0; r < numRows; r++) {
        const count = rowCounts[r];
        const slice = masonryTileList.slice(cursor, cursor + count);
        cursor += count;
        let aSum = 0;
        for (let i = 0; i < slice.length; i++) {
          slice[i].groupIndex = r;
          aSum += clampRowTileAspect(slice[i].rawAspect || slice[i].aspect);
        }
        rowBuckets.push(slice);
        rowAspectSums.push(Math.max(0.25, aSum));
      }

      // Compute exact uncropped natural row heights H_r = rowAvailW / aSum
      const rawHeights = [];
      let rawHeightSum = 0;
      for (let r = 0; r < numRows; r++) {
        const slice = rowBuckets[r];
        const aSum = rowAspectSums[r];
        const rowAvailW = Math.max(64, sw - gap * Math.max(0, slice.length - 1));
        const exactUncroppedH = rowAvailW / aSum;
        const clampedH = Math.max(24, exactUncroppedH);
        rawHeights.push(clampedH);
        rawHeightSum += clampedH;
      }

      const totalRowGaps = gap * Math.max(0, numRows - 1);
      const availScreenH = Math.max(numRows * 24, sh - totalRowGaps);
      const normScale = availScreenH / Math.max(1, rawHeightSum);

      let curY = 0;
      for (let r = 0; r < numRows; r++) {
        const slice = rowBuckets[r];
        const isLastRow = (r === numRows - 1);
        const rh = isLastRow
          ? Math.max(24, sh - curY)
          : Math.max(24, Math.round(rawHeights[r] * normScale));

        const rowGroup = {
          index: r,
          tiles: slice,
          aspect: rowAspectSums[r],
          sizeJitter: 1.0,
          subtreeRoot: null,
          x: 0,
          y: curY,
          w: sw,
          h: rh
        };
        masonryGroups.push(rowGroup);
        layoutGooglePhotosRowTiles(rowGroup, prevRectsMap, null);
        curY += rh + gap;
      }
    }

    // -------------------------------------------------------------------------
    // BACKGROUND PRE-ORGANIZATION & PRE-RENDERING OF NEXT MEDIA SWITCH
    // -------------------------------------------------------------------------
    function clearPreStagedMasonrySwitch(requeueMedia = true) {
      if (!preStagedMasonryPlan) return;
      const plan = preStagedMasonryPlan;
      preStagedMasonryPlan = null;

      if (plan.stagedMediaEl && plan.stagedMediaEl.parentNode) {
        plan.stagedMediaEl.parentNode.removeChild(plan.stagedMediaEl);
      }
      if (plan.stagedMediaEl) {
        plan.stagedMediaEl.className = 'masonry-media';
      }

      if (requeueMedia && plan.ready && plan.ready.media && readyImageQueue.length < 36) {
        readyImageQueue.unshift(plan.ready);
      } else if (plan.ready && plan.ready.media) {
        cleanupMediaNode(plan.ready.media);
      }
    }

    function cancelActiveMasonryFlipsAndPlans() {
      clearPreStagedMasonrySwitch(true);
      for (let i = 0; i < masonryTileList.length; i++) {
        const t = masonryTileList[i];
        cancelTileFlipAnimation(t);
        cancelTileReflowAnimation(t);
        if (t.activePreStage) {
          const ap = t.activePreStage;
          t.activePreStage = null;
          if (ap.stagedMediaEl && ap.stagedMediaEl !== t.mediaElement) {
            if (ap.stagedMediaEl.parentNode) {
              ap.stagedMediaEl.parentNode.removeChild(ap.stagedMediaEl);
            }
            cleanupMediaNode(ap.stagedMediaEl);
          }
        }
        if (t.isFlipping) {
