<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';" />
  <title>Danbooru Infinite Scroll, Polaroid, Fullscreen Slideshow & Masonry</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0b0d;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #polaroidBaseCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      display: none;
    }
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      contain: strict;
      z-index: 1;
    }
    #freezeOverlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      display: none;
    }

    /* --- Continuous Scroll Item (Horizontal & Vertical) --- */
    .slide-item {
      position: absolute;
      top: 0;
      left: 0;
      max-width: none;
      max-height: none;
      display: block;
      will-change: transform;
      backface-visibility: hidden;
      user-select: none;
      pointer-events: none;
    }

    /* --- Polaroid Item --- */
    .polaroid-item {
      position: absolute;
      top: 0;
      left: 0;
      background-color: #ffffff;
      padding: 12px 12px 34px 12px;
      border-radius: 3px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.35);
      transform-origin: center center;
      user-select: none;
      pointer-events: none;
    }
    .polaroid-item.falling {
      will-change: transform, opacity;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.75), 0 8px 20px rgba(0, 0, 0, 0.45);
    }
    .polaroid-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
      background-color: #111;
    }

    /* --- Fullscreen Slideshow Item --- */
    .slideshow-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      will-change: opacity;
      user-select: none;
      pointer-events: none;
    }

    /* --- Masonry Item & On-Demand 3D Y-Axis Flip Card (Uncropped Media, Zero Idle 3D Overhead) --- */
    .masonry-tile {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      user-select: none;
      pointer-events: none;
      contain: layout style paint;
    }
    .masonry-tile.is-flipping {
      perspective: 1100px;
      will-change: transform;
      z-index: 5;
    }
    .masonry-tile.is-reflowing {
      will-change: transform;
    }
    .masonry-flip-inner {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-color: #101014;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      border-radius: 2px;
      transform-origin: center center;
    }
    .masonry-tile.is-flipping .masonry-flip-inner {
      transform-style: preserve-3d;
      backface-visibility: hidden;
      will-change: transform;
    }
    .masonry-media {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      position: relative;
      z-index: 1;
    }
    .masonry-media.pre-staged-media {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 0;
      pointer-events: none;
    }
    /* When Rows (Google Photos) layout is selected, remove all blurred/ambient background sections */
    #stage.rows-mode .masonry-flip-inner {
      background-image: none !important;
      background-color: #0b0b0d;
    }
    #stage.rows-mode .masonry-media {
      object-fit: cover;
    }
  </style>
</head>
<body>
  <canvas id="polaroidBaseCanvas"></canvas>
  <div id="stage"></div>
  <canvas id="freezeOverlayCanvas"></canvas>

  <script>
    // Prevent any accidental drag, context menu, or navigation/download triggers inside WebView2
    window.addEventListener('dragstart', e => e.preventDefault());
    window.addEventListener('drop', e => e.preventDefault());
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('contextmenu', e => e.preventDefault());

    const stage = document.getElementById('stage');
    const polaroidBaseCanvas = document.getElementById('polaroidBaseCanvas');
    const polaroidCtx = polaroidBaseCanvas.getContext('2d');
    const freezeOverlayCanvas = document.getElementById('freezeOverlayCanvas');
    const freezeCtx = freezeOverlayCanvas.getContext('2d');

    const LOCAL_ORIGIN = (window.location.origin && window.location.origin.startsWith('http'))
      ? window.location.origin
      : 'http://127.0.0.1:8088';

    const urlParams = new URLSearchParams(window.location.search);
    const SCREEN_ID = urlParams.get('screen') || 'screen_1';

    // --- Configurable Defaults (Overridden by Settings / project.json) ---
    let SCREEN_ENABLED = false;       // Strictly false until confirmed enabled by /properties or setScreenEnabled(true)
    let APP_PAUSED = false;           // Master application pause (freezes everything)
    let WALLPAPER_PAUSED = false;     // Per-screen Display tab pause (pauses motion/transitions, keeps GIF/MP4 playing)

    let DISPLAY_MODE = 'scroll';      // 'scroll' | 'polaroid' | 'slideshow' | 'masonry'
    let SCROLL_DIRECTION = 'left';    // 'left' | 'right' | 'up' | 'down'
    let SCROLL_SPEED = 120;           // Pixels per second (0.1 to 600 px/s)
    let GAP = 12;                     // Space between scrolling images in pixels

    let POLAROID_DROP_SPEED = 1.0;    // Speed multiplier (0.2x to 4.0x)
    let POLAROID_MIN_SIZE = 220;      // Minimum polaroid target dimension (px)
    let POLAROID_MAX_SIZE = 440;      // Maximum polaroid target dimension (px)
    let POLAROID_DROP_DELAY = 0;      // Extra delay between polaroid drops (0 to 600s)

    let SLIDESHOW_FADE = 5.0;         // 0 to 10 (0 = 0s instant, 10 = 1.0s fade transition)
    let SLIDESHOW_DURATION = 10;      // 0 to 600 seconds per slide

    let MASONRY_LAYOUT = 'mondrian';  // 'mondrian' (Mondrian) | 'rows' (Rows / Google Photos)
    let MASONRY_TILES = 12;           // 4 to 36 tiles on screen
    let MASONRY_GAP = 4;              // 0 to 10 px gap between masonry tiles
    let MASONRY_DELAY = 5;            // 1 to 60 seconds before flipping one tile

    // --- Shared Queue, History & Parallel Preloader State ---
    const BASE_PRELOAD_BUFFER_TARGET = 16;
    let preloadBufferTarget = BASE_PRELOAD_BUFFER_TARGET;
    const MAX_CONCURRENT_LOADS = 4;
    const MIN_API_COOLDOWN_MS = 3000;
    const LOW_QUEUE_THRESHOLD = 12;

    let postQueue = [];
    let readyImageQueue = [];         // Preloaded { media, url, isVideo, isAnimated, isGif, gifLoopDurationSec, aspect, naturalW, naturalH, ambientBgUrl }
    let shownHistoryStack = [];       // Recently displayed descriptors for 'Previous' button requeueing
    const MAX_SHOWN_HISTORY = 60;
    let currentDisplayedDesc = null;  // Tracks the latest displayed descriptor so 'Previous' can requeue the one before or last shown

    let inFlightMedia = new Set();    // Active Image() or <video> elements currently downloading
    let activePreloadCount = 0;
    let preloadGeneration = 1;
    let consecutiveLoadErrors = 0;
    let preloaderBackoffUntil = 0;
    let isFetching = false;
    let nextAllowedFetchTime = 0;
    let consecutiveEmptyFetches = 0;
    let currentEpoch = null;
    let lastNavSeq = null;
    let lastPropSeq = null;
    let lastManualNavTimeMs = 0;
    const MANUAL_NAV_COOLDOWN_MS = 1000; // 1.0s internal Next/Previous button cooldown under high stress
    let lastTime = null;

    // --- Scroll Mode State ---
    let activeItems = [];

    // --- Polaroid Mode State & Hybrid Canvas-Baking Tuning ---
    const POLAROID_PAD_SIDE = 12;
    const POLAROID_PAD_TOP = 12;
    const POLAROID_PAD_BOTTOM = 34;

    const MAX_LIVE_POLAROID_DOM = 30;
    const OCCLUDED_GRACE_DROPS = 4;
    const COVERAGE_INSET_PX = 8;

    let polaroidItems = [];
    let fallingItems = [];
    let timeSinceLastDrop = 999;
    let nextZIndex = 1;
    let nextPolaroidId = 1;
    let fillScreenBurstRemaining = 0;

    const GRID_COLS = 96;
    const GRID_ROWS = 54;
    const TOTAL_GRID_CELLS = GRID_COLS * GRID_ROWS;
    let coverageGrid = new Int32Array(TOTAL_GRID_CELLS);
    let coveredCellCount = 0;
    let screenFullyCovered = false;

    // --- Slideshow Mode State ---
    let currentSlideItem = null;      // { element, mediaElement, isVideo, isAnimated, aspect, desc }
    let previousSlideItem = null;     // Outgoing slide during fade transition
    let slideshowTimer = 0;
    let slideshowFadeElapsed = 0;
    let slideshowIsFading = false;
    let activeFadeDurationSec = 0.5;

    // --- Masonry Mode State (Mondrian BSP + Rows Layout + Pre-Staged Switch & GPU FLIP) ---
    let masonryTreeRoot = null;       // Top-level BSP tree partitioning screen across local groups
    let masonryGroups = [];           // Array of local group objects (or horizontal row objects in 'rows' mode)
    let masonryTileList = [];         // Active tile objects on screen
    let masonrySwitchTimer = 0;
    let nextMasonryTileId = 1;
    let preStagedMasonryPlan = null;  // Single-slot background pre-rendered & pre-organized next media switch
    const MASONRY_PRE_STAGE_LEAD_SEC = 1.2;   // Pre-render & pre-organize 1.2s before flip starts
    const MASONRY_FLIP_HALF_SEC = 0.24;       // 0.24s out (0 -> 90deg) + 0.24s in (-90 -> 0deg)
    const MASONRY_REFLOW_DURATION_SEC = 0.34; // GPU FLIP translate3d/scale3d interpolation duration
    const ambientSampleCanvas = document.createElement('canvas');
    ambientSampleCanvas.width = 24;
    ambientSampleCanvas.height = 24;
    const ambientSampleCtx = ambientSampleCanvas.getContext('2d');
    const downscaleScratchCanvas = document.createElement('canvas');
    const downscaleScratchCtx = downscaleScratchCanvas.getContext('2d');
    let isDownscaleCanvasBusy = false;

    function normalizeModeName(rawMode) {
      const m = String(rawMode || '').toLowerCase().trim();
      if (m === 'polaroid') return 'polaroid';
      if (m === 'slideshow') return 'slideshow';
      if (m === 'masonry') return 'masonry';
      return 'scroll';
    }

    function normalizeMasonryLayout(rawLayout) {
      const l = String(rawLayout || '').toLowerCase().trim();
      if (l === 'rows' || l === 'row' || l === 'google_photos' || l === 'googlephotos' || l === 'google' || l === 'google photos') {
        return 'rows';
      }
      return 'mondrian';
    }

    function isHorizontalScroll() {
      return SCROLL_DIRECTION === 'left' || SCROLL_DIRECTION === 'right';
    }

    function isScreenLandscape() {
      return window.innerWidth >= window.innerHeight;
    }

    function matchesScreenOrientation(aspect) {
      if (!Number.isFinite(aspect) || aspect <= 0) return true;
      const screenLandscape = isScreenLandscape();
      return screenLandscape ? (aspect >= 1.0) : (aspect < 1.0);
    }

    function postMatchesScreenOrientation(post) {
      if (!post) return false;
      const w = Number(post.image_width || 0);
      const h = Number(post.image_height || 0);
      if (w > 0 && h > 0) {
        return matchesScreenOrientation(w / h);
      }
      return true;
    }

    function buildLocalMediaUrl(post) {
      if (!post) return '';
      if (post.media_url && String(post.media_url).startsWith('http://127.0.0.1:')) {
        return post.media_url;
      }
      if (post.proxy_url && String(post.proxy_url).startsWith('http://127.0.0.1:')) {
        return post.proxy_url.replace('/image?', '/media?');
      }
      if (post.file_url) {
        const ext = encodeURIComponent(String(post.file_ext || '').toLowerCase());
        const size = encodeURIComponent(String(post.file_size || 0));
        return `${LOCAL_ORIGIN}/media?url=${encodeURIComponent(post.file_url)}&ext=${ext}&size=${size}`;
      }
      return '';
    }

    // Record a shown item into history so the Display Tab "Previous" button can requeue it,
    // and notify the local Python service so the permanent 4-row Media Tags box shows its tags.
    function recordShownMedia(readyItem) {
      if (!readyItem || !readyItem.url) return;
      const postId = Number(readyItem.postId) || 0;
      const snapshot = {
        url: readyItem.url,
        postId: postId,
        isVideo: Boolean(readyItem.isVideo),
        isAnimated: Boolean(readyItem.isAnimated),
        isGif: Boolean(readyItem.isGif),
        gifLoopDurationSec: Number(readyItem.gifLoopDurationSec) || 2.5,
        aspect: Number(readyItem.aspect) || 1.0,
        naturalW: Number(readyItem.naturalW) || 1,
        naturalH: Number(readyItem.naturalH) || 1
      };
      if (currentDisplayedDesc) {
        shownHistoryStack.push(currentDisplayedDesc);
        if (shownHistoryStack.length > MAX_SHOWN_HISTORY) {
          shownHistoryStack.shift();
        }
      }
      currentDisplayedDesc = snapshot;

      if (postId > 0) {
        fetch(
          `${LOCAL_ORIGIN}/report_shown?screen=${encodeURIComponent(SCREEN_ID)}&post_id=${encodeURIComponent(postId)}`
        ).catch(() => {});
      }
    }

    function enforceSilentVideo(video) {
      if (!video) return;
      video.muted = true;
      video.defaultMuted = true;
      video.volume = 0;
      video.setAttribute('muted', '');
      video.setAttribute('playsinline', '');
      video.playsInline = true;
      video.loop = true;
      video.addEventListener('volumechange', () => {
        if (!video.muted || video.volume !== 0) {
          video.muted = true;
          video.volume = 0;
        }
      });
    }

    // Attach playthrough tracking to an MP4 or GIF item so Masonry waits for 1 full playthrough before flipping
    function attachPlaythroughTracker(tileObj) {
      if (!tileObj) return;
      tileObj.liveElapsedSec = 0;

      if (!tileObj.isAnimated) {
        tileObj.hasPlayedOnce = true;
        return;
      }

      tileObj.hasPlayedOnce = false;

      if (tileObj.isVideo && tileObj.mediaElement) {
        const vid = tileObj.mediaElement;
        let lastT = 0;
        const markPlayed = () => {
          tileObj.hasPlayedOnce = true;
        };
        vid.addEventListener('ended', markPlayed, { once: true });
        vid.onloadedmetadata = () => {
          if (Number.isFinite(vid.duration) && vid.duration > 0) {
            tileObj.minPlayDurationSec = Math.min(60, vid.duration);
          }
        };
        if (Number.isFinite(vid.duration) && vid.duration > 0) {
          tileObj.minPlayDurationSec = Math.min(60, vid.duration);
        } else {
          tileObj.minPlayDurationSec = 3.0;
        }
        vid.ontimeupdate = () => {
          const cur = vid.currentTime || 0;
          const dur = vid.duration || 0;
          if (cur < lastT - 0.25 || (dur > 0 && cur >= dur - 0.15)) {
            tileObj.hasPlayedOnce = true;
          }
          lastT = cur;
        };
      } else {
        // Animated GIF: use exact parsed binary loop duration
        tileObj.minPlayDurationSec = Math.max(1.2, Number(tileObj.gifLoopDurationSec) || 2.5);
      }
    }

    // Parses GIF89a Graphic Control Extension (0x21 0xF9) frame delays to compute 1 full loop duration in seconds
    function parseGifLoopDurationSec(uint8) {
      if (!uint8 || uint8.length < 14) return 2.5;
      // Verify GIF87a / GIF89a header
      if (uint8[0] !== 0x47 || uint8[1] !== 0x49 || uint8[2] !== 0x46) {
        return 2.5;
      }
      let totalCs = 0;
      let frameCount = 0;
      for (let i = 0; i < uint8.length - 7; i++) {
        if (uint8[i] === 0x21 && uint8[i + 1] === 0xF9 && uint8[i + 2] === 0x04 && uint8[i + 7] === 0x00) {
          const delayCs = uint8[i + 4] | (uint8[i + 5] << 8);
          totalCs += (delayCs < 2 ? 10 : delayCs);
          frameCount++;
        }
      }
      if (frameCount <= 1) return 1.0;
      return Math.max(1.0, Math.min(45.0, totalCs / 100.0));
    }

    function resizePolaroidCanvas(preserveContent = true) {
      const dpr = window.devicePixelRatio || 1;
      const targetW = Math.max(1, Math.round(window.innerWidth * dpr));
      const targetH = Math.max(1, Math.round(window.innerHeight * dpr));

      if (polaroidBaseCanvas.width === targetW && polaroidBaseCanvas.height === targetH) {
        return;
      }

      let tempCanvas = null;
      if (preserveContent && polaroidBaseCanvas.width > 0 && polaroidBaseCanvas.height > 0) {
        tempCanvas = document.createElement('canvas');
        tempCanvas.width = polaroidBaseCanvas.width;
        tempCanvas.height = polaroidBaseCanvas.height;
        tempCanvas.getContext('2d').drawImage(polaroidBaseCanvas, 0, 0);
      }

      polaroidBaseCanvas.width = targetW;
      polaroidBaseCanvas.height = targetH;

      if (tempCanvas) {
        polaroidCtx.drawImage(tempCanvas, 0, 0, targetW, targetH);
      }
    }

    function clearPolaroidCanvas() {
      polaroidCtx.clearRect(0, 0, polaroidBaseCanvas.width, polaroidBaseCanvas.height);
    }

    function bakePolaroidToCanvas(item) {
      if (!polaroidCtx || !item || !item.mediaElement) return;
      const dpr = window.devicePixelRatio || 1;
      const cx = item.targetX + item.totalW / 2;
      const cy = item.targetY + item.totalH / 2;
      const rad = (item.targetRot * Math.PI) / 180;
      const halfW = item.totalW / 2;
      const halfH = item.totalH / 2;
      const imgW = item.totalW - POLAROID_PAD_SIDE * 2;
      const imgH = item.totalH - POLAROID_PAD_TOP - POLAROID_PAD_BOTTOM;

      polaroidCtx.save();
      polaroidCtx.scale(dpr, dpr);
      polaroidCtx.translate(cx, cy);
      polaroidCtx.rotate(rad);

      polaroidCtx.shadowColor = 'rgba(0, 0, 0, 0.55)';
      polaroidCtx.shadowBlur = 24;
      polaroidCtx.shadowOffsetX = 0;
      polaroidCtx.shadowOffsetY = 8;
      polaroidCtx.fillStyle = '#ffffff';
      polaroidCtx.beginPath();
      if (polaroidCtx.roundRect) {
        polaroidCtx.roundRect(-halfW, -halfH, item.totalW, item.totalH, 3);
      } else {
        polaroidCtx.rect(-halfW, -halfH, item.totalW, item.totalH);
      }
      polaroidCtx.fill();

      polaroidCtx.shadowColor = 'transparent';
      polaroidCtx.shadowBlur = 0;
      polaroidCtx.shadowOffsetY = 0;
      polaroidCtx.fillStyle = '#111111';
      polaroidCtx.fillRect(-halfW + POLAROID_PAD_SIDE, -halfH + POLAROID_PAD_TOP, imgW, imgH);

      try {
        polaroidCtx.drawImage(
          item.mediaElement,
          -halfW + POLAROID_PAD_SIDE,
          -halfH + POLAROID_PAD_TOP,
          imgW,
          imgH
        );
      } catch (e) {}

      polaroidCtx.restore();
    }

    function drawCoverMedia(ctx, media, x, y, w, h, aspect) {
      if (!ctx || !media) return;
      const targetAspect = w / Math.max(1, h);
      const mediaAspect = aspect || targetAspect;
      let drawW = w;
      let drawH = h;
      let offsetX = x;
      let offsetY = y;

      if (mediaAspect > targetAspect) {
        drawH = h;
        drawW = h * mediaAspect;
        offsetX = x - (drawW - w) / 2;
      } else {
        drawW = w;
        drawH = w / mediaAspect;
        offsetY = y - (drawH - h) / 2;
      }
      try {
        ctx.drawImage(media, offsetX, offsetY, drawW, drawH);
      } catch (e) {}
    }

    // =========================================================================
    // PAUSE & FREEZE CALLBACKS
    // =========================================================================
    function renderFreezeSnapshot() {
      const dpr = window.devicePixelRatio || 1;
      freezeOverlayCanvas.width = Math.max(1, Math.round(window.innerWidth * dpr));
      freezeOverlayCanvas.height = Math.max(1, Math.round(window.innerHeight * dpr));
      freezeCtx.save();
      freezeCtx.scale(dpr, dpr);
      freezeCtx.fillStyle = document.body.style.backgroundColor || '#0b0b0d';
      freezeCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      if (DISPLAY_MODE === 'scroll') {
        for (let i = 0; i < activeItems.length; i++) {
          const it = activeItems[i];
          if (it.element) {
            try {
              freezeCtx.drawImage(it.element, it.x, it.y, it.width, it.height);
            } catch (e) {}
          }
        }
      } else if (DISPLAY_MODE === 'slideshow') {
        if (previousSlideItem && previousSlideItem.mediaElement) {
          freezeCtx.save();
          freezeCtx.globalAlpha = Number(previousSlideItem.element.style.opacity || 1);
          drawCoverMedia(
            freezeCtx,
            previousSlideItem.mediaElement,
            0,
            0,
            window.innerWidth,
            window.innerHeight,
            previousSlideItem.aspect
          );
          freezeCtx.restore();
        }
        if (currentSlideItem && currentSlideItem.mediaElement) {
          freezeCtx.save();
          freezeCtx.globalAlpha = Number(currentSlideItem.element.style.opacity || 1);
          drawCoverMedia(
            freezeCtx,
            currentSlideItem.mediaElement,
            0,
            0,
            window.innerWidth,
            window.innerHeight,
            currentSlideItem.aspect
          );
          freezeCtx.restore();
        }
      } else if (DISPLAY_MODE === 'masonry') {
        for (let i = 0; i < masonryTileList.length; i++) {
          const tile = masonryTileList[i];
          if (!tile.mediaElement) continue;
          freezeCtx.save();
          freezeCtx.beginPath();
          freezeCtx.rect(tile.x, tile.y, tile.w, tile.h);
          freezeCtx.clip();
          drawCoverMedia(freezeCtx, tile.mediaElement, tile.x, tile.y, tile.w, tile.h, tile.aspect);
          freezeCtx.restore();
        }
      } else {
        try {
          freezeCtx.drawImage(polaroidBaseCanvas, 0, 0, window.innerWidth, window.innerHeight);
        } catch (e) {}
        const allItems = polaroidItems.concat(fallingItems);
        for (let i = 0; i < allItems.length; i++) {
          const item = allItems[i];
          if (!item.mediaElement) continue;
          const isFalling = item.element && item.element.classList.contains('falling');
          const progress = isFalling ? Math.min(item.elapsed / item.duration, 1.0) : 1.0;
          const ease = 1 - Math.pow(1 - progress, 3);
          const curX = isFalling ? item.startX + (item.targetX - item.startX) * ease : item.targetX;
          const curY = isFalling ? item.startY + (item.targetY - item.startY) * ease : item.targetY;
          const curScale = isFalling ? item.startScale + (item.targetScale - item.startScale) * ease : 1.0;
          const curRot = isFalling ? item.startRot + (item.targetRot - item.startRot) * ease : item.targetRot;

          const cx = curX + item.totalW / 2;
          const cy = curY + item.totalH / 2;
          const halfW = item.totalW / 2;
          const halfH = item.totalH / 2;
          const imgW = item.totalW - POLAROID_PAD_SIDE * 2;
          const imgH = item.totalH - POLAROID_PAD_TOP - POLAROID_PAD_BOTTOM;

          freezeCtx.save();
          freezeCtx.translate(cx, cy);
          freezeCtx.scale(curScale, curScale);
          freezeCtx.rotate((curRot * Math.PI) / 180);
          freezeCtx.fillStyle = '#ffffff';
          freezeCtx.fillRect(-halfW, -halfH, item.totalW, item.totalH);
          try {
            freezeCtx.drawImage(
              item.mediaElement,
              -halfW + POLAROID_PAD_SIDE,
              -halfH + POLAROID_PAD_TOP,
              imgW,
              imgH
            );
          } catch (e) {}
          freezeCtx.restore();
        }
      }
      freezeCtx.restore();
    }

    window.applyPauseStates = function(appPaused, wallpaperPaused) {
      const prevAppPaused = APP_PAUSED;
      APP_PAUSED = Boolean(appPaused);
      WALLPAPER_PAUSED = Boolean(wallpaperPaused);

      if (APP_PAUSED && !prevAppPaused) {
        renderFreezeSnapshot();
        freezeOverlayCanvas.style.display = 'block';
        document.querySelectorAll('video').forEach(v => {
          try { v.pause(); } catch (e) {}
        });
      } else if (!APP_PAUSED && prevAppPaused) {
        freezeOverlayCanvas.style.display = 'none';
        document.querySelectorAll('video').forEach(v => {
          try {
            enforceSilentVideo(v);
            v.play().catch(() => {});
          } catch (e) {}
        });
        consecutiveLoadErrors = 0;
        preloaderBackoffUntil = 0;
        lastTime = null;
        pumpPreloader();
      }
    };

    window.setScreenEnabled = function(enabled) {
      const newEnabled = Boolean(enabled);
      if (SCREEN_ENABLED === newEnabled) return;
      SCREEN_ENABLED = newEnabled;
      if (!SCREEN_ENABLED) {
        clearReadyQueue();
        clearStageAll();
        stage.style.display = 'none';
        polaroidBaseCanvas.style.display = 'none';
      } else {
        stage.style.display = 'block';
        if (DISPLAY_MODE === 'polaroid') {
          resizePolaroidCanvas(false);
          polaroidBaseCanvas.style.display = 'block';
        }
        consecutiveLoadErrors = 0;
        preloaderBackoffUntil = 0;
        nextAllowedFetchTime = 0;
        timeSinceLastDrop = 999;
        slideshowTimer = 999999;
        masonrySwitchTimer = 0;
        pumpPreloader();
        if (DISPLAY_MODE === 'scroll') {
          fillScrollBuffer();
        } else if (DISPLAY_MODE === 'slideshow') {
          advanceSlideshowIfReady();
        } else if (DISPLAY_MODE === 'masonry') {
          populateMasonryIfNeeded();
        }
      }
    };

    window.triggerFillPolaroidScreen = function() {
      if (DISPLAY_MODE !== 'polaroid' || APP_PAUSED || !SCREEN_ENABLED) return;
      screenFullyCovered = false;
      fillScreenBurstRemaining = 28;
      preloadBufferTarget = 32;
      pumpPreloader();
      drainFillScreenBurst();
    };

    function drainFillScreenBurst() {
      if (DISPLAY_MODE !== 'polaroid' || fillScreenBurstRemaining <= 0 || APP_PAUSED) return;
      while (fillScreenBurstRemaining > 0 && readyImageQueue.length > 0 && !screenFullyCovered) {
        if (spawnNextPolaroidItem()) {
          fillScreenBurstRemaining--;
        } else {
          break;
        }
      }
      if (screenFullyCovered || fillScreenBurstRemaining <= 0) {
        fillScreenBurstRemaining = 0;
        preloadBufferTarget = BASE_PRELOAD_BUFFER_TARGET;
        timeSinceLastDrop = 0;
      } else {
        pumpPreloader();
      }
    }

    // =========================================================================
    // SEARCH BAR NAVIGATION CALLBACKS: PREVIOUS (REQUEUE LAST) & NEXT (PLAY NOW)
    // =========================================================================
    function createMediaElementFromDescriptor(desc, onComplete) {
      if (!desc || !desc.url) return;
      if (desc.isVideo) {
        const video = document.createElement('video');
        enforceSilentVideo(video);
        video.preload = 'auto';
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          video.onloadeddata = null;
          video.oncanplay = null;
          video.onerror = null;
          onComplete({
            media: video,
            url: desc.url,
            postId: Number(desc.postId) || 0,
            isVideo: true,
            isAnimated: true,
            isGif: false,
            gifLoopDurationSec: 3.0,
            aspect: desc.aspect || 1.0,
            naturalW: desc.naturalW || 16,
            naturalH: desc.naturalH || 9,
            ambientBgUrl: computeAmbientBackdropDataUrl(video)
          });
        };
        video.onloadeddata = finish;
        video.oncanplay = finish;
        video.onerror = () => { done = true; };
        video.src = desc.url;
        video.load();
      } else {
        const img = new Image();
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.onload = () => {
          onComplete({
            media: img,
            url: desc.url,
            postId: Number(desc.postId) || 0,
            isVideo: false,
            isAnimated: Boolean(desc.isAnimated),
            isGif: Boolean(desc.isGif),
            gifLoopDurationSec: Number(desc.gifLoopDurationSec) || 2.5,
            aspect: desc.aspect || ((img.naturalWidth || 1) / (img.naturalHeight || 1)),
            naturalW: img.naturalWidth || desc.naturalW || 1,
            naturalH: img.naturalHeight || desc.naturalH || 1,
            ambientBgUrl: computeAmbientBackdropDataUrl(img)
          });
        };
        img.src = desc.url;
      }
    }

    // "Previous" button: Requeues the last file shown to the front of readyImageQueue so it will show next
    window.triggerPreviousMedia = function(seq) {
      if (typeof seq === 'number') {
        if (lastNavSeq !== null && seq <= lastNavSeq) return;
        lastNavSeq = seq;
      }
      const nowMs = performance.now();
      if (nowMs - lastManualNavTimeMs < MANUAL_NAV_COOLDOWN_MS) return;
      lastManualNavTimeMs = nowMs;

      if (APP_PAUSED || !SCREEN_ENABLED) return;
      const targetDesc = shownHistoryStack.length > 0
        ? shownHistoryStack.pop()
        : currentDisplayedDesc;

      if (!targetDesc || !targetDesc.url) return;

      createMediaElementFromDescriptor(targetDesc, (requeuedItem) => {
        readyImageQueue.unshift(requeuedItem);
      });
    };

    // "Next" button: Immediately plays/transitions the next queued file in the active display mode (strictly once per click, 1.0s cooldown)
    window.triggerNextMedia = function(seq) {
      if (typeof seq === 'number') {
        if (lastNavSeq !== null && seq <= lastNavSeq) return;
        lastNavSeq = seq;
      }
      const nowMs = performance.now();
      if (nowMs - lastManualNavTimeMs < MANUAL_NAV_COOLDOWN_MS) return;

      if (APP_PAUSED || !SCREEN_ENABLED) return;
      if (DISPLAY_MODE === 'masonry' && isAnyMasonryTileBusy()) {
        return;
      }
      lastManualNavTimeMs = nowMs;

      if (readyImageQueue.length === 0) {
        pumpPreloader();
        return;
      }

      if (DISPLAY_MODE === 'slideshow') {
        slideshowIsFading = false;
        slideshowTimer = 0;
        advanceSlideshowIfReady(true);
      } else if (DISPLAY_MODE === 'polaroid') {
        if (spawnNextPolaroidItem()) {
          timeSinceLastDrop = 0;
        }
      } else if (DISPLAY_MODE === 'masonry') {
        if (triggerNextMasonryFlip(true)) {
          masonrySwitchTimer = 0;
        }
      } else if (DISPLAY_MODE === 'scroll') {
        spawnImmediateScrollNextItem();
      }
    };

    // =========================================================================
    // NETWORK FETCH & STRICT LOCAL PYTHON PROXY PRELOADER (/media)
    // =========================================================================
    async function fetchNextPage(forceImmediate = false) {
      if (isFetching || APP_PAUSED || !SCREEN_ENABLED) return;
      const now = performance.now();
      if (!forceImmediate && (now < nextAllowedFetchTime || now < preloaderBackoffUntil)) return;

      isFetching = true;
      nextAllowedFetchTime = now + MIN_API_COOLDOWN_MS;

      try {
        const res = await fetch(`${LOCAL_ORIGIN}/api?screen=${encodeURIComponent(SCREEN_ID)}`);
        if (res.ok) {
          const newPosts = await res.json();
          if (Array.isArray(newPosts) && newPosts.length > 0) {
            consecutiveEmptyFetches = 0;
            nextAllowedFetchTime = performance.now() + MIN_API_COOLDOWN_MS;

            if (DISPLAY_MODE === 'slideshow') {
              const filtered = newPosts.filter(postMatchesScreenOrientation);
              postQueue.push(...filtered);
              if (filtered.length === 0) {
                nextAllowedFetchTime = performance.now() + 400;
                setTimeout(() => fetchNextPage(), 420);
              }
            } else {
              postQueue.push(...newPosts);
            }
            pumpPreloader();
          } else {
            consecutiveEmptyFetches++;
            const backoffMs = Math.min(30000, MIN_API_COOLDOWN_MS * Math.pow(2, consecutiveEmptyFetches));
            nextAllowedFetchTime = performance.now() + backoffMs;
          }
        } else {
          consecutiveEmptyFetches++;
          const backoffMs = Math.min(30000, MIN_API_COOLDOWN_MS * Math.pow(2, consecutiveEmptyFetches));
          nextAllowedFetchTime = performance.now() + backoffMs;
        }
      } catch (err) {
        consecutiveEmptyFetches++;
        const backoffMs = Math.min(30000, MIN_API_COOLDOWN_MS * Math.pow(2, consecutiveEmptyFetches));
        nextAllowedFetchTime = performance.now() + backoffMs;
      } finally {
        isFetching = false;
      }
    }

    function finalizePreloadedMedia(mediaEl, localMediaUrl, gen, isVideo, isAnimated, isGif, gifLoopDurationSec, postId = 0) {
      if (!inFlightMedia.has(mediaEl)) return;
      inFlightMedia.delete(mediaEl);
      activePreloadCount = Math.max(0, activePreloadCount - 1);
      consecutiveLoadErrors = 0;
      preloaderBackoffUntil = 0;

      if (gen !== preloadGeneration || APP_PAUSED || !SCREEN_ENABLED) {
        cleanupMediaNode(mediaEl);
        return;
      }

      const naturalW = isVideo ? (mediaEl.videoWidth || 16) : (mediaEl.naturalWidth || 1);
      const naturalH = isVideo ? (mediaEl.videoHeight || 9) : (mediaEl.naturalHeight || 1);
      const aspect = naturalW / naturalH;

      // Enforce screen orientation match in Slideshow mode
      if (DISPLAY_MODE === 'slideshow' && !matchesScreenOrientation(aspect)) {
        cleanupMediaNode(mediaEl);
        pumpPreloader();
        return;
      }

      // Pre-compute the 24x24 ambient color backdrop during preload idle time
      // so the 90-degree flip midpoint never executes synchronous canvas.toDataURL()
      const precomputedAmbientUrl = computeAmbientBackdropDataUrl(mediaEl);

      readyImageQueue.push({
        media: mediaEl,
        url: localMediaUrl,
        postId: Number(postId) || 0,
        isVideo: isVideo,
        isAnimated: isAnimated,
        isGif: Boolean(isGif),
        gifLoopDurationSec: Number(gifLoopDurationSec) || 2.5,
        aspect: aspect,
        naturalW: naturalW,
        naturalH: naturalH,
        ambientBgUrl: precomputedAmbientUrl
      });

      if (DISPLAY_MODE === 'scroll') {
        fillScrollBuffer();
      } else if (DISPLAY_MODE === 'slideshow') {
        if (!currentSlideItem) {
          advanceSlideshowIfReady();
        }
      } else if (DISPLAY_MODE === 'masonry') {
        populateMasonryIfNeeded();
      } else if (fillScreenBurstRemaining > 0) {
        drainFillScreenBurst();
      }
      pumpPreloader();
    }

    function handleMediaLoadFailure(mediaEl) {
      if (inFlightMedia.has(mediaEl)) {
        inFlightMedia.delete(mediaEl);
        activePreloadCount = Math.max(0, activePreloadCount - 1);
      }
      cleanupMediaNode(mediaEl);

      if (APP_PAUSED || !SCREEN_ENABLED) return;

      consecutiveLoadErrors++;
      const backoffMs = Math.min(10000, 600 * Math.pow(1.6, Math.min(6, consecutiveLoadErrors)));
      preloaderBackoffUntil = performance.now() + backoffMs;

      setTimeout(pumpPreloader, backoffMs + 50);
    }

    function pumpPreloader() {
      if (APP_PAUSED || !SCREEN_ENABLED) return;
      const now = performance.now();
      if (now < preloaderBackoffUntil) return;

      // Once all Masonry tiles are populated on screen, keep a lean 10-item ready buffer
      // instead of holding 42 extra decoded media elements in memory alongside 36 live tiles
      const dynamicTarget = DISPLAY_MODE === 'masonry'
        ? (masonryTileList.length < MASONRY_TILES
            ? Math.max(BASE_PRELOAD_BUFFER_TARGET, MASONRY_TILES - masonryTileList.length + 6)
            : 10)
        : preloadBufferTarget;

      if (postQueue.length < LOW_QUEUE_THRESHOLD && !isFetching && now >= nextAllowedFetchTime) {
        fetchNextPage();
      }

      while (
        activePreloadCount < MAX_CONCURRENT_LOADS &&
        (readyImageQueue.length + activePreloadCount) < dynamicTarget &&
        postQueue.length > 0
      ) {
        const post = postQueue.shift();
        if (!post) continue;

        if (DISPLAY_MODE === 'slideshow' && !postMatchesScreenOrientation(post)) {
          continue;
        }

        const localMediaUrl = buildLocalMediaUrl(post);
        if (!localMediaUrl) continue;

        const postId = Number(post.id || 0);
        const ext = String(post.file_ext || '').toLowerCase();
        const isVideo = (ext === 'mp4') || localMediaUrl.toLowerCase().includes('ext=mp4');
        const isGif = !isVideo && ((ext === 'gif') || localMediaUrl.toLowerCase().includes('ext=gif'));
        const isAnimated = isVideo || isGif;

        activePreloadCount++;
        const gen = preloadGeneration;

        if (isVideo) {
          const video = document.createElement('video');
          enforceSilentVideo(video);
          video.preload = 'auto';
          inFlightMedia.add(video);

          let finalized = false;

          const onReady = () => {
            if (finalized) return;
            finalized = true;
            video.onloadeddata = null;
            video.oncanplay = null;
            video.onerror = null;
            const durSec = (Number.isFinite(video.duration) && video.duration > 0) ? video.duration : 3.0;
            finalizePreloadedMedia(video, localMediaUrl, gen, true, true, false, durSec, postId);
          };

          video.onloadeddata = onReady;
          video.oncanplay = onReady;

          video.onerror = () => {
            if (finalized) return;
            finalized = true;
            handleMediaLoadFailure(video);
          };

          video.src = localMediaUrl;
          video.load();
        } else if (isGif) {
          const img = new Image();
          img.decoding = 'async';
          img.referrerPolicy = 'no-referrer';
          inFlightMedia.add(img);

          // Single-pass GIF fetch: parse exact GIF89a frame-delay loop duration and load directly from local Blob URL
          fetch(localMediaUrl)
            .then(r => {
              if (!r.ok) throw new Error('GIF fetch failed');
              return r.arrayBuffer();
            })
            .then(buf => {
              const uint8 = new Uint8Array(buf);
              const loopSec = parseGifLoopDurationSec(uint8);
              const blobUrl = URL.createObjectURL(new Blob([buf], { type: 'image/gif' }));
              img.dataset.blobUrl = blobUrl;
              img.onload = () => {
                finalizePreloadedMedia(img, localMediaUrl, gen, false, true, true, loopSec, postId);
              };
              img.onerror = () => handleMediaLoadFailure(img);
              img.src = blobUrl;
            })
            .catch(() => {
              img.onload = () => {
                finalizePreloadedMedia(img, localMediaUrl, gen, false, true, true, 2.5, postId);
              };
              img.onerror = () => handleMediaLoadFailure(img);
              img.src = localMediaUrl;
            });
        } else {
          const img = new Image();
          img.decoding = 'async';
          img.referrerPolicy = 'no-referrer';
          inFlightMedia.add(img);

          img.onload = () => {
            // Downscale oversized 4K/8K static images in Masonry/Polaroid modes to bounded display resolution
            // to prevent GPU texture upload stalls during flips and eliminate VRAM bloat
            const maxAllowedDim = DISPLAY_MODE === 'masonry' ? 1280 : 1920;
            const nw = img.naturalWidth || 1;
            const nh = img.naturalHeight || 1;
            const canUseDownscaleCanvas =
              downscaleScratchCtx &&
              !isDownscaleCanvasBusy &&
              !(DISPLAY_MODE === 'masonry' && isAnyMasonryTileBusy());
            if ((nw > maxAllowedDim || nh > maxAllowedDim) && canUseDownscaleCanvas) {
              try {
                isDownscaleCanvasBusy = true;
                const scale = maxAllowedDim / Math.max(nw, nh);
                const tw = Math.max(16, Math.round(nw * scale));
                const th = Math.max(16, Math.round(nh * scale));
                downscaleScratchCanvas.width = tw;
                downscaleScratchCanvas.height = th;
                downscaleScratchCtx.drawImage(img, 0, 0, tw, th);
                downscaleScratchCanvas.toBlob((blob) => {
                  // Immediately release scratch canvas backing store so it never holds RAM
                  downscaleScratchCanvas.width = 1;
                  downscaleScratchCanvas.height = 1;
                  isDownscaleCanvasBusy = false;
                  if (!blob || !inFlightMedia.has(img)) {
                    finalizePreloadedMedia(img, localMediaUrl, gen, false, false, false, 0, postId);
                    return;
                  }
                  const blobUrl = URL.createObjectURL(blob);
                  const scaledImg = new Image();
                  scaledImg.decoding = 'async';
                  scaledImg.dataset.blobUrl = blobUrl;
                  inFlightMedia.delete(img);
                  cleanupMediaNode(img);
                  inFlightMedia.add(scaledImg);
                  scaledImg.onload = () => {
                    if (typeof scaledImg.decode === 'function') {
                      scaledImg.decode()
                        .then(() => finalizePreloadedMedia(scaledImg, localMediaUrl, gen, false, false, false, 0, postId))
                        .catch(() => finalizePreloadedMedia(scaledImg, localMediaUrl, gen, false, false, false, 0, postId));
                    } else {
                      finalizePreloadedMedia(scaledImg, localMediaUrl, gen, false, false, false, 0, postId);
                    }
                  };
                  scaledImg.onerror = () => handleMediaLoadFailure(scaledImg);
                  scaledImg.src = blobUrl;
                }, 'image/jpeg', 0.90);
                return;
              } catch (e) {
                downscaleScratchCanvas.width = 1;
                downscaleScratchCanvas.height = 1;
                isDownscaleCanvasBusy = false;
              }
            }

            if (typeof img.decode === 'function') {
              img.decode()
                .then(() => finalizePreloadedMedia(img, localMediaUrl, gen, false, false, false, 0, postId))
                .catch(() => finalizePreloadedMedia(img, localMediaUrl, gen, false, false, false, 0, postId));
            } else {
              finalizePreloadedMedia(img, localMediaUrl, gen, false, false, false, 0, postId);
            }
          };

          img.onerror = () => {
            handleMediaLoadFailure(img);
          };

          img.src = localMediaUrl;
        }
      }

      if (postQueue.length < LOW_QUEUE_THRESHOLD && !isFetching && performance.now() >= nextAllowedFetchTime) {
        fetchNextPage();
      }
    }

    function cleanupMediaNode(node) {
      if (!node) return;
      try {
        if (node.dataset && node.dataset.blobUrl) {
          URL.revokeObjectURL(node.dataset.blobUrl);
          delete node.dataset.blobUrl;
        }
        if (node.tagName === 'VIDEO') {
          node.onloadeddata = null;
          node.oncanplay = null;
          node.onerror = null;
          node.ontimeupdate = null;
          node.onloadedmetadata = null;
          node.pause();
          node.removeAttribute('src');
          node.load();
        } else {
          node.onload = null;
          node.onerror = null;
          node.src = '';
          node.removeAttribute('src');
        }
      } catch (e) {}
    }

    function destroyItem(item) {
      if (!item) return;
      const el = item.element;
      const media = item.mediaElement || (
        el && (el.tagName === 'IMG' || el.tagName === 'VIDEO')
          ? el
          : (el ? el.querySelector('img, video') : null)
      );
      if (media) {
        cleanupMediaNode(media);
      }
      if (el && el.parentNode) {
        el.parentNode.removeChild(el);
      }
      item.element = null;
      item.mediaElement = null;
    }

    function clearReadyQueue() {
      preloadGeneration++;

      for (const media of inFlightMedia) {
        cleanupMediaNode(media);
      }
      inFlightMedia.clear();
      activePreloadCount = 0;

      while (readyImageQueue.length > 0) {
        const preloaded = readyImageQueue.shift();
        if (preloaded && preloaded.media) {
          cleanupMediaNode(preloaded.media);
        }
      }
    }

    function filterQueuesForSlideshowOrientation() {
      postQueue = postQueue.filter(postMatchesScreenOrientation);
      const keptReady = [];
      while (readyImageQueue.length > 0) {
        const item = readyImageQueue.shift();
        if (matchesScreenOrientation(item.aspect)) {
          keptReady.push(item);
        } else if (item.media) {
          cleanupMediaNode(item.media);
        }
      }
      readyImageQueue = keptReady;
    }

    function clearStageAll() {
      clearPreStagedMasonrySwitch(false);
      for (let i = 0; i < activeItems.length; i++) destroyItem(activeItems[i]);
      for (let i = 0; i < polaroidItems.length; i++) destroyItem(polaroidItems[i]);
      for (let i = 0; i < fallingItems.length; i++) destroyItem(fallingItems[i]);
      for (let i = 0; i < masonryTileList.length; i++) {
        if (masonryTileList[i].activePreStage && masonryTileList[i].activePreStage.stagedMediaEl) {
          cleanupMediaNode(masonryTileList[i].activePreStage.stagedMediaEl);
        }
        if (masonryTileList[i].pendingReady && masonryTileList[i].pendingReady.media) {
          cleanupMediaNode(masonryTileList[i].pendingReady.media);
        }
        destroyItem(masonryTileList[i]);
      }
      if (currentSlideItem) destroyItem(currentSlideItem);
      if (previousSlideItem) destroyItem(previousSlideItem);

      activeItems = [];
      polaroidItems = [];
      fallingItems = [];
      masonryTileList = [];
      masonryGroups = [];
      masonryTreeRoot = null;
      masonrySwitchTimer = 0;

      currentSlideItem = null;
      previousSlideItem = null;
      slideshowTimer = 0;
      slideshowFadeElapsed = 0;
      slideshowIsFading = false;

      clearPolaroidCanvas();
      coverageGrid.fill(0);
      coveredCellCount = 0;
      screenFullyCovered = false;
      nextZIndex = 1;
      timeSinceLastDrop = 999;
      fillScreenBurstRemaining = 0;
    }

    function switchDisplayMode(rawNewMode) {
      const newMode = normalizeModeName(rawNewMode);
      if (DISPLAY_MODE === newMode) return;
      DISPLAY_MODE = newMode;
      clearStageAll();

      if (DISPLAY_MODE === 'polaroid' && SCREEN_ENABLED) {
        resizePolaroidCanvas(false);
        polaroidBaseCanvas.style.display = 'block';
      } else {
        polaroidBaseCanvas.style.display = 'none';
      }

      if (DISPLAY_MODE === 'slideshow') {
        filterQueuesForSlideshowOrientation();
        advanceSlideshowIfReady();
      } else if (DISPLAY_MODE === 'scroll') {
        fillScrollBuffer();
      } else if (DISPLAY_MODE === 'masonry') {
        populateMasonryIfNeeded();
      }

      pumpPreloader();
    }

    // =========================================================================
    // MODE 1: INFINITE CONTINUOUS SCROLL (LEFT, RIGHT, UP, DOWN)
    // =========================================================================
    function getRightmostEdge() {
      if (activeItems.length === 0) return 0;
      const last = activeItems[activeItems.length - 1];
      return last.x + last.width;
    }

    function getLeftmostEdge() {
      if (activeItems.length === 0) return window.innerWidth;
      return activeItems[0].x;
    }

    function getBottommostEdge() {
      if (activeItems.length === 0) return 0;
      const last = activeItems[activeItems.length - 1];
      return last.y + last.height;
    }

    function getTopmostEdge() {
      if (activeItems.length === 0) return window.innerHeight;
      return activeItems[0].y;
    }

    // Immediate "Next" action in Scroll mode: places the next queued file right at the incoming viewport edge
    function spawnImmediateScrollNextItem() {
      if (DISPLAY_MODE !== 'scroll' || readyImageQueue.length === 0) return;
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      if (screenW <= 0 || screenH <= 0) return;

      const ready = readyImageQueue.shift();
      recordShownMedia(ready);
      const media = ready.media;

      if (SCROLL_DIRECTION === 'left') {
        const computedWidth = Math.max(1, ready.aspect * screenH);
        const shiftAmount = computedWidth + GAP;
        for (let i = 0; i < activeItems.length; i++) {
          activeItems[i].x -= shiftAmount;
          activeItems[i].element.style.transform = `translate3d(${activeItems[i].x}px, 0, 0)`;
        }
        const spawnX = activeItems.length === 0 ? 0 : getRightmostEdge() + GAP;
        media.className = 'slide-item';
        media.style.width = `${computedWidth}px`;
        media.style.height = `${screenH}px`;
        media.style.transform = `translate3d(${spawnX}px, 0, 0)`;
        stage.appendChild(media);
        if (ready.isVideo) {
          enforceSilentVideo(media);
          media.play().catch(() => {});
        }
        activeItems.push({
          element: media,
          mediaElement: media,
          isVideo: ready.isVideo,
          isAnimated: ready.isAnimated,
          x: spawnX,
          y: 0,
          width: computedWidth,
          height: screenH,
          aspect: ready.aspect
        });
      } else if (SCROLL_DIRECTION === 'right') {
        const computedWidth = Math.max(1, ready.aspect * screenH);
        const shiftAmount = computedWidth + GAP;
        for (let i = 0; i < activeItems.length; i++) {
          activeItems[i].x += shiftAmount;
          activeItems[i].element.style.transform = `translate3d(${activeItems[i].x}px, 0, 0)`;
        }
        const spawnX = activeItems.length === 0 ? (screenW - computedWidth) : (getLeftmostEdge() - computedWidth - GAP);
        media.className = 'slide-item';
        media.style.width = `${computedWidth}px`;
        media.style.height = `${screenH}px`;
        media.style.transform = `translate3d(${spawnX}px, 0, 0)`;
        stage.appendChild(media);
        if (ready.isVideo) {
          enforceSilentVideo(media);
          media.play().catch(() => {});
        }
        activeItems.unshift({
          element: media,
          mediaElement: media,
          isVideo: ready.isVideo,
          isAnimated: ready.isAnimated,
          x: spawnX,
          y: 0,
          width: computedWidth,
          height: screenH,
          aspect: ready.aspect
        });
      } else if (SCROLL_DIRECTION === 'up') {
        const computedHeight = Math.max(1, screenW / Math.max(0.05, ready.aspect));
        const shiftAmount = computedHeight + GAP;
        for (let i = 0; i < activeItems.length; i++) {
          activeItems[i].y -= shiftAmount;
          activeItems[i].element.style.transform = `translate3d(0, ${activeItems[i].y}px, 0)`;
        }
        const spawnY = activeItems.length === 0 ? 0 : getBottommostEdge() + GAP;
        media.className = 'slide-item';
        media.style.width = `${screenW}px`;
        media.style.height = `${computedHeight}px`;
        media.style.transform = `translate3d(0, ${spawnY}px, 0)`;
        stage.appendChild(media);
        if (ready.isVideo) {
          enforceSilentVideo(media);
          media.play().catch(() => {});
        }
        activeItems.push({
          element: media,
          mediaElement: media,
          isVideo: ready.isVideo,
          isAnimated: ready.isAnimated,
          x: 0,
          y: spawnY,
          width: screenW,
          height: computedHeight,
          aspect: ready.aspect
        });
      } else if (SCROLL_DIRECTION === 'down') {
        const computedHeight = Math.max(1, screenW / Math.max(0.05, ready.aspect));
        const shiftAmount = computedHeight + GAP;
        for (let i = 0; i < activeItems.length; i++) {
          activeItems[i].y += shiftAmount;
          activeItems[i].element.style.transform = `translate3d(0, ${activeItems[i].y}px, 0)`;
        }
        const spawnY = activeItems.length === 0 ? (screenH - computedHeight) : (getTopmostEdge() - computedHeight - GAP);
        media.className = 'slide-item';
        media.style.width = `${screenW}px`;
        media.style.height = `${computedHeight}px`;
        media.style.transform = `translate3d(0, ${spawnY}px, 0)`;
        stage.appendChild(media);
        if (ready.isVideo) {
          enforceSilentVideo(media);
          media.play().catch(() => {});
        }
        activeItems.unshift({
          element: media,
          mediaElement: media,
          isVideo: ready.isVideo,
          isAnimated: ready.isAnimated,
          x: 0,
          y: spawnY,
          width: screenW,
          height: computedHeight,
          aspect: ready.aspect
        });
      }
      pumpPreloader();
    }

    function fillScrollBuffer() {
      if (DISPLAY_MODE !== 'scroll' || APP_PAUSED || !SCREEN_ENABLED) return;

      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      if (screenW <= 0 || screenH <= 0) return;

      let spawnedAny = false;

      if (SCROLL_DIRECTION === 'left') {
        while (readyImageQueue.length > 0 && getRightmostEdge() < screenW * 3.5) {
          const ready = readyImageQueue.shift();
          recordShownMedia(ready);
          const media = ready.media;
          const computedWidth = Math.max(1, ready.aspect * screenH);
          const spawnX = activeItems.length === 0 ? 0 : getRightmostEdge() + GAP;

          media.className = 'slide-item';
          media.style.width = `${computedWidth}px`;
          media.style.height = `${screenH}px`;
          media.style.transform = `translate3d(${spawnX}px, 0, 0)`;
          stage.appendChild(media);

          if (ready.isVideo) {
            enforceSilentVideo(media);
            media.play().catch(() => {});
          }

          activeItems.push({
            element: media,
            mediaElement: media,
            isVideo: ready.isVideo,
            isAnimated: ready.isAnimated,
            x: spawnX,
            y: 0,
            width: computedWidth,
            height: screenH,
            aspect: ready.aspect
          });
          spawnedAny = true;
        }
      } else if (SCROLL_DIRECTION === 'right') {
        while (readyImageQueue.length > 0 && getLeftmostEdge() > -screenW * 2.5) {
          const ready = readyImageQueue.shift();
          recordShownMedia(ready);
          const media = ready.media;
          const computedWidth = Math.max(1, ready.aspect * screenH);
          const spawnX = activeItems.length === 0
            ? (screenW - computedWidth)
            : (getLeftmostEdge() - computedWidth - GAP);

          media.className = 'slide-item';
          media.style.width = `${computedWidth}px`;
          media.style.height = `${screenH}px`;
          media.style.transform = `translate3d(${spawnX}px, 0, 0)`;
          stage.appendChild(media);

          if (ready.isVideo) {
            enforceSilentVideo(media);
            media.play().catch(() => {});
          }

          activeItems.unshift({
            element: media,
            mediaElement: media,
            isVideo: ready.isVideo,
            isAnimated: ready.isAnimated,
            x: spawnX,
            y: 0,
            width: computedWidth,
            height: screenH,
            aspect: ready.aspect
          });
          spawnedAny = true;
        }
      } else if (SCROLL_DIRECTION === 'up') {
        while (readyImageQueue.length > 0 && getBottommostEdge() < screenH * 3.5) {
          const ready = readyImageQueue.shift();
          recordShownMedia(ready);
          const media = ready.media;
          const computedHeight = Math.max(1, screenW / Math.max(0.05, ready.aspect));
          const spawnY = activeItems.length === 0 ? 0 : getBottommostEdge() + GAP;

          media.className = 'slide-item';
          media.style.width = `${screenW}px`;
          media.style.height = `${computedHeight}px`;
          media.style.transform = `translate3d(0, ${spawnY}px, 0)`;
          stage.appendChild(media);

          if (ready.isVideo) {
            enforceSilentVideo(media);
            media.play().catch(() => {});
          }

          activeItems.push({
            element: media,
            mediaElement: media,
            isVideo: ready.isVideo,
            isAnimated: ready.isAnimated,
            x: 0,
            y: spawnY,
            width: screenW,
            height: computedHeight,
            aspect: ready.aspect
          });
          spawnedAny = true;
        }
      } else if (SCROLL_DIRECTION === 'down') {
        while (readyImageQueue.length > 0 && getTopmostEdge() > -screenH * 2.5) {
          const ready = readyImageQueue.shift();
          recordShownMedia(ready);
          const media = ready.media;
          const computedHeight = Math.max(1, screenW / Math.max(0.05, ready.aspect));
          const spawnY = activeItems.length === 0
            ? (screenH - computedHeight)
            : (getTopmostEdge() - computedHeight - GAP);

          media.className = 'slide-item';
          media.style.width = `${screenW}px`;
          media.style.height = `${computedHeight}px`;
          media.style.transform = `translate3d(0, ${spawnY}px, 0)`;
          stage.appendChild(media);

          if (ready.isVideo) {
            enforceSilentVideo(media);
            media.play().catch(() => {});
          }

          activeItems.unshift({
            element: media,
            mediaElement: media,
            isVideo: ready.isVideo,
            isAnimated: ready.isAnimated,
            x: 0,
            y: spawnY,
            width: screenW,
            height: computedHeight,
            aspect: ready.aspect
          });
          spawnedAny = true;
        }
      }

      if (spawnedAny || (readyImageQueue.length === 0 && activePreloadCount === 0)) {
        pumpPreloader();
      }
    }

    function relayoutScrollItems() {
      if (DISPLAY_MODE !== 'scroll' || activeItems.length === 0) return;
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      if (screenWidth <= 0 || screenHeight <= 0) return;

      if (isHorizontalScroll()) {
        let runningX = activeItems[0].x;
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.width = Math.max(1, item.aspect * screenHeight);
          item.height = screenHeight;
          item.x = runningX;
          item.y = 0;
          item.element.style.width = `${item.width}px`;
          item.element.style.height = `${screenHeight}px`;
          item.element.style.transform = `translate3d(${item.x}px, 0, 0)`;
          runningX += item.width + GAP;
        }
      } else {
        let runningY = activeItems[0].y;
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.width = screenWidth;
          item.height = Math.max(1, screenWidth / Math.max(0.05, item.aspect));
          item.x = 0;
          item.y = runningY;
          item.element.style.width = `${screenWidth}px`;
          item.element.style.height = `${item.height}px`;
          item.element.style.transform = `translate3d(0, ${item.y}px, 0)`;
          runningY += item.height + GAP;
        }
      }
      fillScrollBuffer();
    }

    function updateScrollMode(deltaTime) {
      if (WALLPAPER_PAUSED) return;

      const moveBy = SCROLL_SPEED * deltaTime;
      let removedAny = false;

      if (SCROLL_DIRECTION === 'left') {
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.x -= moveBy;
          item.element.style.transform = `translate3d(${item.x}px, 0, 0)`;
        }
        while (activeItems.length > 0 && (activeItems[0].x + activeItems[0].width) < -100) {
          destroyItem(activeItems.shift());
          removedAny = true;
        }
      } else if (SCROLL_DIRECTION === 'right') {
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.x += moveBy;
          item.element.style.transform = `translate3d(${item.x}px, 0, 0)`;
        }
        while (activeItems.length > 0 && activeItems[activeItems.length - 1].x > window.innerWidth + 100) {
          destroyItem(activeItems.pop());
          removedAny = true;
        }
      } else if (SCROLL_DIRECTION === 'up') {
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.y -= moveBy;
          item.element.style.transform = `translate3d(0, ${item.y}px, 0)`;
        }
        while (activeItems.length > 0 && (activeItems[0].y + activeItems[0].height) < -100) {
          destroyItem(activeItems.shift());
          removedAny = true;
        }
      } else if (SCROLL_DIRECTION === 'down') {
        for (let i = 0; i < activeItems.length; i++) {
          const item = activeItems[i];
          item.y += moveBy;
          item.element.style.transform = `translate3d(0, ${item.y}px, 0)`;
        }
        while (activeItems.length > 0 && activeItems[activeItems.length - 1].y > window.innerHeight + 100) {
          destroyItem(activeItems.pop());
          removedAny = true;
        }
      }

      if (removedAny || readyImageQueue.length > 0 || activeItems.length === 0) {
        fillScrollBuffer();
      }
    }

    // =========================================================================
    // MODE 2: CONTINUOUS STACKING POLAROID
    // =========================================================================
    function chooseSmartLandingSpot(totalW, totalH) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const cellW = sw / GRID_COLS;
      const cellH = sh / GRID_ROWS;

      if (!screenFullyCovered && Math.random() < 0.85) {
        const uncoveredIndices = [];
        for (let i = 0; i < TOTAL_GRID_CELLS; i++) {
          if (coverageGrid[i] === 0) uncoveredIndices.push(i);
        }
        if (uncoveredIndices.length > 0) {
          const chosenIdx = uncoveredIndices[Math.floor(Math.random() * uncoveredIndices.length)];
          const col = chosenIdx % GRID_COLS;
          const row = Math.floor(chosenIdx / GRID_COLS);

          const jitterX = (Math.random() - 0.5) * cellW * 3;
          const jitterY = (Math.random() - 0.5) * cellH * 3;
          const centerX = (col + 0.5) * cellW + jitterX;
          const centerY = (row + 0.5) * cellH + jitterY;

          return {
            x: centerX - totalW / 2,
            y: centerY - totalH / 2
          };
        }
      }

      if (polaroidItems.length > 0 && Math.random() < 0.35) {
        const oldestId = polaroidItems[0].id;
        const oldestCells = [];
        for (let i = 0; i < TOTAL_GRID_CELLS; i++) {
          if (coverageGrid[i] === oldestId) oldestCells.push(i);
        }
        if (oldestCells.length > 0) {
          const chosenIdx = oldestCells[Math.floor(Math.random() * oldestCells.length)];
          const col = chosenIdx % GRID_COLS;
          const row = Math.floor(chosenIdx / GRID_COLS);

          const jitterX = (Math.random() - 0.5) * totalW * 0.35;
          const jitterY = (Math.random() - 0.5) * totalH * 0.35;
          const centerX = (col + 0.5) * cellW + jitterX;
          const centerY = (row + 0.5) * cellH + jitterY;

          return {
            x: centerX - totalW / 2,
            y: centerY - totalH / 2
          };
        }
      }

      const marginX = totalW * 0.2;
      const marginY = totalH * 0.2;
      const x = -marginX + Math.random() * (sw - totalW + marginX * 2);
      const y = -marginY + Math.random() * (sh - totalH + marginY * 2);
      return { x, y };
    }

    function markCoverageForLandedItem(item) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      if (sw <= 0 || sh <= 0) return;

      const cellW = sw / GRID_COLS;
      const cellH = sh / GRID_ROWS;

      const cx = item.targetX + item.totalW / 2;
      const cy = item.targetY + item.totalH / 2;

      const halfW = Math.max(10, item.totalW / 2 - COVERAGE_INSET_PX);
      const halfH = Math.max(10, item.totalH / 2 - COVERAGE_INSET_PX);

      const rad = (-item.targetRot * Math.PI) / 180;
      const cosA = Math.cos(rad);
      const sinA = Math.sin(rad);

      for (let r = 0; r < GRID_ROWS; r++) {
        const py = (r + 0.5) * cellH - cy;
        for (let c = 0; c < GRID_COLS; c++) {
          const px = (c + 0.5) * cellW - cx;
          const localX = px * cosA - py * sinA;
          const localY = px * sinA + py * cosA;

          if (Math.abs(localX) <= halfW && Math.abs(localY) <= halfH) {
            const idx = r * GRID_COLS + c;
            if (coverageGrid[idx] === 0) {
              coveredCellCount++;
            }
            coverageGrid[idx] = item.id;
          }
        }
      }

      if (coveredCellCount >= TOTAL_GRID_CELLS * 0.985) {
        screenFullyCovered = true;
      }
    }

    function prunePolaroidStackIfNeeded() {
      const visibleIds = new Set(coverageGrid);
      const remaining = [];

      for (let i = 0; i < polaroidItems.length; i++) {
        const item = polaroidItems[i];
        if (!visibleIds.has(item.id)) {
          item.occludedDrops = (item.occludedDrops || 0) + 1;
        } else {
          item.occludedDrops = 0;
        }

        if (item.occludedDrops >= OCCLUDED_GRACE_DROPS) {
          bakePolaroidToCanvas(item);
          destroyItem(item);
        } else {
          remaining.push(item);
        }
      }
      polaroidItems = remaining;

      let idx = 0;
      while (polaroidItems.length > MAX_LIVE_POLAROID_DOM && idx < polaroidItems.length) {
        if (!polaroidItems[idx].isAnimated) {
          const [staticItem] = polaroidItems.splice(idx, 1);
          bakePolaroidToCanvas(staticItem);
          destroyItem(staticItem);
        } else {
          idx++;
        }
      }

      while (polaroidItems.length > MAX_LIVE_POLAROID_DOM + 10) {
        const oldest = polaroidItems.shift();
        bakePolaroidToCanvas(oldest);
        destroyItem(oldest);
      }
    }

    function spawnNextPolaroidItem() {
      if (DISPLAY_MODE !== 'polaroid' || readyImageQueue.length === 0 || APP_PAUSED || !SCREEN_ENABLED) {
        pumpPreloader();
        return false;
      }
      if (window.innerWidth <= 0 || window.innerHeight <= 0) {
        return false;
      }

      const ready = readyImageQueue.shift();
      recordShownMedia(ready);
      pumpPreloader();

      const media = ready.media;
      const aspect = ready.aspect;

      const wrapper = document.createElement('div');
      wrapper.className = 'polaroid-item falling';
      wrapper.style.opacity = '0';

      media.className = 'polaroid-img';
      wrapper.appendChild(media);
      stage.appendChild(wrapper);

      if (ready.isVideo) {
        enforceSilentVideo(media);
        media.play().catch(() => {});
      }

      const minS = Math.min(POLAROID_MIN_SIZE, POLAROID_MAX_SIZE);
      const maxS = Math.max(POLAROID_MIN_SIZE, POLAROID_MAX_SIZE);
      const randomBaseSize = minS + Math.random() * (maxS - minS);

      let imgW, imgH;
      if (aspect >= 1) {
        imgW = randomBaseSize;
        imgH = randomBaseSize / aspect;
      } else {
        imgH = randomBaseSize;
        imgW = randomBaseSize * aspect;
      }

      const totalW = Math.round(imgW + POLAROID_PAD_SIDE * 2);
      const totalH = Math.round(imgH + POLAROID_PAD_TOP + POLAROID_PAD_BOTTOM);

      wrapper.style.width = `${totalW}px`;
      wrapper.style.height = `${totalH}px`;
      wrapper.style.zIndex = String(nextZIndex++);

      const landing = chooseSmartLandingSpot(totalW, totalH);
      const targetRot = (Math.random() - 0.5) * 28;
      const startRot = targetRot + (Math.random() - 0.5) * 30;

      const startX = (window.innerWidth - totalW) * 0.5 + (landing.x - (window.innerWidth - totalW) * 0.5) * 0.35;
      const startY = (window.innerHeight - totalH) * 0.5 + (landing.y - (window.innerHeight - totalH) * 0.5) * 0.35;

      const fallDuration = Math.max(0.25, 1.15 / Math.max(0.2, POLAROID_DROP_SPEED));

      const itemObj = {
        id: nextPolaroidId++,
        element: wrapper,
        mediaElement: media,
        isVideo: ready.isVideo,
        isAnimated: ready.isAnimated,
        totalW,
        totalH,
        startX,
        startY,
        targetX: landing.x,
        targetY: landing.y,
        startScale: 3.6,
        targetScale: 1.0,
        startRot,
        targetRot,
        elapsed: 0,
        duration: fallDuration,
        occludedDrops: 0
      };

      markCoverageForLandedItem(itemObj);
      fallingItems.push(itemObj);

      return true;
    }

    function updatePolaroidMode(deltaTime) {
      if (WALLPAPER_PAUSED) return;

      if (fillScreenBurstRemaining > 0) {
        drainFillScreenBurst();
      } else {
        timeSinceLastDrop += deltaTime;
        const baseInterval = Math.max(0.25, 1.6 / Math.max(0.2, POLAROID_DROP_SPEED));
        const spawnInterval = baseInterval + Math.max(0, Math.min(600, POLAROID_DROP_DELAY));

        if (timeSinceLastDrop >= spawnInterval) {
          if (spawnNextPolaroidItem()) {
            timeSinceLastDrop = 0;
          } else {
            timeSinceLastDrop = spawnInterval - 0.25;
          }
        }
      }

      for (let i = fallingItems.length - 1; i >= 0; i--) {
        const item = fallingItems[i];
        item.elapsed += deltaTime;
        const progress = Math.min(item.elapsed / item.duration, 1.0);
        const ease = 1 - Math.pow(1 - progress, 3);

        const curX = item.startX + (item.targetX - item.startX) * ease;
        const curY = item.startY + (item.targetY - item.startY) * ease;
        const curScale = item.startScale + (item.targetScale - item.startScale) * ease;
        const curRot = item.startRot + (item.targetRot - item.startRot) * ease;
        const curOpacity = Math.min(progress / 0.15, 1.0);

        item.element.style.opacity = curOpacity.toFixed(3);
        item.element.style.transform = `translate3d(${curX.toFixed(1)}px, ${curY.toFixed(1)}px, 0) scale(${curScale.toFixed(4)}) rotate(${curRot.toFixed(2)}deg)`;

        if (progress >= 1.0) {
          item.element.classList.remove('falling');
          item.element.style.willChange = 'auto';
          item.element.style.opacity = '1';
          item.element.style.transform = `translate3d(${item.targetX.toFixed(1)}px, ${item.targetY.toFixed(1)}px, 0) scale(1) rotate(${item.targetRot.toFixed(2)}deg)`;

          fallingItems.splice(i, 1);
          polaroidItems.push(item);

          prunePolaroidStackIfNeeded();
        }
      }
    }

    // =========================================================================
    // MODE 3: FULLSCREEN ORIENTATION-MATCHED SLIDESHOW WITH FADE TRANSITION
    // =========================================================================
    function popNextOrientationMatchedSlide() {
      while (readyImageQueue.length > 0) {
        const candidate = readyImageQueue.shift();
        if (matchesScreenOrientation(candidate.aspect)) {
          return candidate;
        }
        if (candidate && candidate.media) {
          cleanupMediaNode(candidate.media);
        }
      }
      return null;
    }

    function advanceSlideshowIfReady(forceInstantWhenManual = false) {
      if (DISPLAY_MODE !== 'slideshow' || APP_PAUSED || !SCREEN_ENABLED) {
        return false;
      }
      if (slideshowIsFading && !forceInstantWhenManual) {
        return false;
      }

      const nextReady = popNextOrientationMatchedSlide();
      pumpPreloader();
      if (!nextReady) return false;

      recordShownMedia(nextReady);

      const media = nextReady.media;
      media.className = 'slideshow-item';
      media.style.zIndex = '2';

      const fadeSec = Math.max(0, Math.min(10, SLIDESHOW_FADE)) / 10.0;

      if (!currentSlideItem || fadeSec <= 0.005) {
        media.style.opacity = '1';
        stage.appendChild(media);
        if (nextReady.isVideo) {
          enforceSilentVideo(media);
          media.play().catch(() => {});
        }
        if (previousSlideItem) {
          destroyItem(previousSlideItem);
          previousSlideItem = null;
        }
        if (currentSlideItem) {
          destroyItem(currentSlideItem);
        }
        currentSlideItem = {
          element: media,
          mediaElement: media,
          isVideo: nextReady.isVideo,
          isAnimated: nextReady.isAnimated,
          aspect: nextReady.aspect
        };
        slideshowTimer = 0;
        slideshowIsFading = false;
      } else {
        if (previousSlideItem) {
          destroyItem(previousSlideItem);
        }
        previousSlideItem = currentSlideItem;
        if (previousSlideItem && previousSlideItem.element) {
          previousSlideItem.element.style.zIndex = '1';
          previousSlideItem.element.style.opacity = '1';
        }

        media.style.opacity = '0';
        stage.appendChild(media);
        if (nextReady.isVideo) {
          enforceSilentVideo(media);
          media.play().catch(() => {});
        }

        currentSlideItem = {
          element: media,
          mediaElement: media,
          isVideo: nextReady.isVideo,
          isAnimated: nextReady.isAnimated,
          aspect: nextReady.aspect
        };
        slideshowFadeElapsed = 0;
        activeFadeDurationSec = fadeSec;
        slideshowIsFading = true;
        slideshowTimer = 0;
      }

      return true;
    }

    function updateSlideshowMode(deltaTime) {
      if (WALLPAPER_PAUSED) return;

      if (slideshowIsFading) {
        slideshowFadeElapsed += deltaTime;
        const progress = activeFadeDurationSec > 0
          ? Math.min(1.0, slideshowFadeElapsed / activeFadeDurationSec)
          : 1.0;

        if (currentSlideItem && currentSlideItem.element) {
          currentSlideItem.element.style.opacity = progress.toFixed(3);
        }
        if (previousSlideItem && previousSlideItem.element) {
          previousSlideItem.element.style.opacity = (1.0 - progress).toFixed(3);
        }

        if (progress >= 1.0) {
          if (currentSlideItem && currentSlideItem.element) {
            currentSlideItem.element.style.opacity = '1';
          }
          if (previousSlideItem) {
            destroyItem(previousSlideItem);
            previousSlideItem = null;
          }
          slideshowIsFading = false;
          slideshowTimer = 0;
        }
        return;
      }

      if (!currentSlideItem) {
        advanceSlideshowIfReady();
        return;
      }

      slideshowTimer += deltaTime;
      const holdSeconds = Math.max(0.25, Math.min(600, Number(SLIDESHOW_DURATION) || 0));
      if (slideshowTimer >= holdSeconds) {
        if (!advanceSlideshowIfReady()) {
          slideshowTimer = Math.max(0, holdSeconds - 0.25);
        }
      }
    }

    // =========================================================================
    // MODE 4: MASONRY LAYOUT (MONDRIAN BSP + ROWS JUSTIFIED LAYOUT +
    //         BACKGROUND PRE-RENDERING & PRE-ORGANIZATION OF NEXT MEDIA SWITCH)
    // =========================================================================

    function syncStageRowsModeClass() {
      if (!stage) return;
      if (DISPLAY_MODE === 'masonry' && MASONRY_LAYOUT === 'rows') {
        stage.classList.add('rows-mode');
      } else {
        stage.classList.remove('rows-mode');
      }
    }

    function computeAmbientBackdropDataUrl(mediaEl) {
      if (!mediaEl || !ambientSampleCtx) return '';
      try {
        if (mediaEl.tagName === 'VIDEO' && mediaEl.readyState < 2) {
          return '';
        }
        ambientSampleCtx.clearRect(0, 0, 24, 24);
        ambientSampleCtx.drawImage(mediaEl, 0, 0, 24, 24);
        ambientSampleCtx.fillStyle = 'rgba(10, 10, 14, 0.44)';
        ambientSampleCtx.fillRect(0, 0, 24, 24);
        return ambientSampleCanvas.toDataURL('image/jpeg', 0.65);
      } catch (e) {
        return '';
      }
    }

    // Applies the pre-baked 24x24 color-matched ambient backdrop in Mondrian mode,
    // or removes the blurred/ambient backdrop completely when Rows mode is active.
    function applyTileAmbientBackdrop(flipInner, mediaEl, isVideo, precomputedUrl) {
      if (!flipInner) return;
      if (MASONRY_LAYOUT === 'rows') {
        flipInner.style.backgroundImage = 'none';
        return;
      }
      if (precomputedUrl) {
        flipInner.style.backgroundImage = `url("${precomputedUrl}")`;
        return;
      }
      if (!mediaEl) return;
      const assignFromMedia = () => {
        if (MASONRY_LAYOUT === 'rows') {
          flipInner.style.backgroundImage = 'none';
          return;
        }
        const url = computeAmbientBackdropDataUrl(mediaEl);
        if (url) {
          flipInner.style.backgroundImage = `url("${url}")`;
        }
      };
      if (isVideo && mediaEl.readyState < 2) {
        mediaEl.addEventListener('loadeddata', assignFromMedia, { once: true });
      } else {
        assignFromMedia();
      }
    }

    function clampTileAspect(aspect) {
      return Math.max(0.28, Math.min(3.6, Number(aspect) || 1.0));
    }

    // Builds a binary tree skeleton over an array of leaf items (tiles or groups)
    function buildBinarySubtreeNodes(items, internalList) {
      if (items.length === 1) {
        return {
          isLeaf: true,
          item: items[0],
          effAspect: clampTileAspect(items[0].aspect) * (items[0].sizeJitter || 1.0),
          splitVertically: true,
          ratio: 0.5
        };
      }
      const mid = Math.floor(items.length / 2);
      const left = buildBinarySubtreeNodes(items.slice(0, mid), internalList);
      const right = buildBinarySubtreeNodes(items.slice(mid), internalList);
      const node = {
        isLeaf: false,
        left,
        right,
        effAspect: 1.0,
        splitVertically: true,
        ratio: 0.5
      };
      if (internalList) internalList.push(node);
      return node;
    }

    // Bottom-up exact aspect ratio propagation for a given split-direction assignment
    function propagateAspectBottomUp(node) {
      if (!node) return 1.0;
      if (node.isLeaf) {
        const baseA = clampTileAspect(node.item.aspect);
        const jitter = Number(node.item.sizeJitter) || 1.0;
        node.effAspect = Math.max(0.22, Math.min(4.2, baseA * jitter));
        return node.effAspect;
      }
      const aL = propagateAspectBottomUp(node.left);
      const aR = propagateAspectBottomUp(node.right);
      if (node.splitVertically) {
        const sumA = Math.max(0.1, aL + aR);
        node.effAspect = sumA;
        node.ratio = Math.max(0.22, Math.min(0.78, aL / sumA));
      } else {
        const invL = 1.0 / Math.max(0.1, aL);
        const invR = 1.0 / Math.max(0.1, aR);
        const invSum = Math.max(0.05, invL + invR);
        node.effAspect = 1.0 / invSum;
        node.ratio = Math.max(0.22, Math.min(0.78, invL / invSum));
      }
      return node.effAspect;
    }
