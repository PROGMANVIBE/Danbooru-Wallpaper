name: Build Windows Executable

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Optional: Release tag to upload to (leave blank to auto-detect latest release)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: public/updated_files

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pystray Pillow pywebview curl_cffi pyinstaller

      - name: Generate multi-size cardboard box icon.ico
        run: |
          python -c "from PIL import Image, ImageDraw; s=4; img=Image.new('RGBA',(64*s,64*s),(0,0,0,0)); d=ImageDraw.Draw(img); sc=lambda pts:[(x*s,y*s) for x,y in pts]; d.polygon(sc([(14,25),(32,33),(50,25),(32,18)]),fill=(115,78,42,255)); d.polygon(sc([(14,25),(32,33),(32,57),(14,49)]),fill=(150,105,60,255)); d.polygon(sc([(32,33),(50,25),(50,49),(32,57)]),fill=(194,142,86,255)); d.line(sc([(32,33),(32,57)]),fill=(130,88,50,255),width=2*s); d.polygon(sc([(14,25),(32,33),(25,23),(8,17)]),fill=(212,162,106,255)); d.line(sc([(14,25),(8,17)]),fill=(150,105,60,255),width=1*s); d.polygon(sc([(32,33),(50,25),(56,17),(39,23)]),fill=(212,162,106,255)); d.line(sc([(50,25),(56,17)]),fill=(150,105,60,255),width=1*s); d.polygon(sc([(14,25),(32,18),(28,11),(11,16)]),fill=(212,162,106,255)); d.polygon(sc([(32,18),(50,25),(53,16),(36,11)]),fill=(212,162,106,255)); img.save('icon.ico',format='ICO',bitmap_format='bmp',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build DanbooruWallpaper.exe with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --noconsole --onefile --clean --name DanbooruWallpaper --icon="icon.ico" --add-data "index.html;." --add-data "project.json;." --add-data "GLOSSARY.md;." --add-data "icon.ico;." --hidden-import "webview" --hidden-import "pystray" --hidden-import "PIL" --hidden-import "curl_cffi" --collect-all "curl_cffi" danbooru_service.py

      - name: Generate SHA256 Checksum
        run: |
          python -c "import hashlib; h = hashlib.sha256(open('dist/DanbooruWallpaper.exe', 'rb').read()).hexdigest().upper(); open('dist/DanbooruWallpaper.exe.sha256', 'w').write(f'{h}  DanbooruWallpaper.exe\n'); print(f'SHA256: {h}')"

      - name: Upload Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: DanbooruWallpaper-Windows
          path: |
            public/updated_files/dist/DanbooruWallpaper.exe
            public/updated_files/dist/DanbooruWallpaper.exe.sha256

      - name: Attach .exe to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.target_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import os, subprocess, json; tag = os.environ.get('INPUT_TAG', '').strip() or os.environ.get('RELEASE_TAG', '').strip(); res = subprocess.run(['gh', 'release', 'list', '--limit', '1', '--json', 'tagName'], capture_output=True, text=True); tag = tag or (json.loads(res.stdout)[0]['tagName'] if res.returncode == 0 and json.loads(res.stdout or '[]') else ''); print(f'Target release tag: {tag}'); subprocess.run(['gh', 'release', 'upload', tag, 'dist/DanbooruWallpaper.exe', 'dist/DanbooruWallpaper.exe.sha256', '--clobber'], check=True) if tag else print('WARNING: No published GitHub Release found in this repo!')"
