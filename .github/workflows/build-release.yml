name: Build Windows Executable

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Optional: Release tag to upload to (leave blank to auto-detect latest release)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pystray Pillow pywebview curl_cffi pyinstaller

      - name: Ensure icon.ico exists
        shell: pwsh
        run: |
          if (-not (Test-Path "icon.ico")) {
            Write-Host "No icon.ico found in repo; generating default icon.ico..."
            python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (64, 64), (10, 25, 47, 255)); d = ImageDraw.Draw(img); d.rectangle([16, 16, 48, 48], fill=(100, 255, 218, 255)); img.save('icon.ico', format='ICO')"
          }

      - name: Build DanbooruWallpaper.exe with PyInstaller
        shell: pwsh
        run: |
          $addData = @()
          foreach ($file in @("index.html", "project.json", "GLOSSARY.md", "icon.ico")) {
            if (Test-Path $file) {
              $addData += "--add-data"
              $addData += "$file;."
            } else {
              Write-Warning "$file not found in repository root!"
            }
          }
          pyinstaller --noconsole --onefile --clean --name DanbooruWallpaper --icon=icon.ico @addData danbooru_service.py

      - name: Generate SHA256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "dist/DanbooruWallpaper.exe" -Algorithm SHA256).Hash
          "$hash  DanbooruWallpaper.exe" | Out-File -FilePath "dist/DanbooruWallpaper.exe.sha256" -Encoding ascii

      - name: Upload Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: DanbooruWallpaper-Windows
          path: |
            dist/DanbooruWallpaper.exe
            dist/DanbooruWallpaper.exe.sha256

      - name: Attach .exe to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Determine which Release tag to upload to
          $tag = "${{ github.event.inputs.target_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag) -and "${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            # Auto-detect the latest published release in the repo
            $tag = (gh release view --json tagName -q .tagName 2>$null)
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Warning "No existing GitHub Release found! Create a Release on GitHub first, or download the .exe from the Artifacts section of this workflow run."
          } else {
            Write-Host "Uploading DanbooruWallpaper.exe to Release '$tag'..."
            gh release upload $tag "dist/DanbooruWallpaper.exe" "dist/DanbooruWallpaper.exe.sha256" --clobber
            Write-Host "Successfully attached DanbooruWallpaper.exe to Release '$tag'!"
          }
