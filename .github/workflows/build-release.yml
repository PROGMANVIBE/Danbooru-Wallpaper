name: Build Windows Executable

on:
  # 1. Automatically runs when you publish a new Release on GitHub
  release:
    types: [published]

  # 2. Also lets you trigger a test build manually from the "Actions" tab anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pystray Pillow pywebview curl_cffi pyinstaller

      - name: Ensure icon.ico exists
        shell: pwsh
        run: |
          if (-not (Test-Path "icon.ico")) {
            Write-Host "No icon.ico found in repo; generating default icon.ico..."
            python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (64, 64), (10, 25, 47, 255)); d = ImageDraw.Draw(img); d.rectangle([16, 16, 48, 48], fill=(100, 255, 218, 255)); img.save('icon.ico', format='ICO')"
          }

      - name: Build DanbooruWallpaper.exe with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --clean --name DanbooruWallpaper --icon=icon.ico --add-data "index.html;." --add-data "project.json;." --add-data "GLOSSARY.md;." --add-data "icon.ico;." danbooru_service.py

      - name: Generate SHA256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "dist/DanbooruWallpaper.exe" -Algorithm SHA256).Hash
          "$hash  DanbooruWallpaper.exe" | Out-File -FilePath "dist/DanbooruWallpaper.exe.sha256" -Encoding ascii

      # Always uploads the .exe to the Actions run summary (great for manual test builds)
      - name: Upload Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: DanbooruWallpaper-Windows
          path: |
            dist/DanbooruWallpaper.exe
            dist/DanbooruWallpaper.exe.sha256

      # Automatically attaches the .exe to your public GitHub Release page when you publish a release
      - name: Attach .exe to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DanbooruWallpaper.exe
            dist/DanbooruWallpaper.exe.sha256
